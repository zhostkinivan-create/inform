<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Раздел 4. Сделки и представительство</title>
<style>
  :root{--bg:#f5f7fa;--card:#fff;--text:#1a2332;--muted:#5a6a80;--accent:#1e5a96;--accent-hover:#164a7d;--border:#d8e0ea;--success:#1e7d4e;--error:#b03a3a;--warning:#a8761f;--shadow:0 2px 8px rgba(0,0,0,.06)}
  [data-theme="dark"]{--bg:#141a24;--card:#1d2532;--text:#e6ecf3;--muted:#93a3b8;--accent:#4a8fd1;--accent-hover:#6aa7e0;--border:#2c3a4d;--success:#4caf7d;--error:#e07a7a;--warning:#d4a548;--shadow:0 2px 8px rgba(0,0,0,.3)}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;transition:background .3s,color .3s}
  .layout{display:flex;min-height:100vh}
  .sidebar{width:320px;background:var(--card);border-right:1px solid var(--border);padding:20px 16px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;transition:transform .3s;z-index:100}
  .sidebar-header{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
  .sidebar-header h1{font-size:17px;color:var(--accent);margin-bottom:6px}
  .sidebar-header p{font-size:12px;color:var(--muted)}
  .search-box{width:100%;padding:8px 12px;margin-bottom:14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px}
  .search-box:focus{outline:2px solid var(--accent)}
  .progress-wrap{margin-bottom:14px}
  .progress-label{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
  .progress-bar-bg{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
  .progress-bar-fill{height:100%;background:var(--accent);width:0%;transition:width .4s}
  .nav-section{margin-bottom:6px}
  .nav-section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:10px 8px 6px}
  .nav-list{list-style:none}
  .nav-list li a{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:13.5px;color:var(--text);text-decoration:none;border-radius:6px;margin-bottom:2px;transition:background .15s}
  .nav-list li a:hover{background:var(--bg);color:var(--accent)}
  .nav-list li a.active{background:var(--accent);color:#fff}
  .nav-list li a .check{color:var(--success);font-weight:bold}
  .nav-list li a.active .check{color:#c8f5d8}
  .main{flex:1;margin-left:320px;padding:32px 40px 80px;max-width:900px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px;flex-wrap:wrap}
  .topbar .breadcrumb{font-size:13px;color:var(--muted)}
  .btn{padding:8px 14px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;cursor:pointer;font-size:13.5px;transition:all .2s;text-decoration:none;display:inline-block}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-primary:hover{background:var(--accent-hover);color:#fff}
  .ticket{display:none;animation:fade .3s}
  .ticket.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .ticket h2{font-size:24px;color:var(--accent);margin-bottom:6px;line-height:1.3}
  .ticket .subtitle{font-size:14px;color:var(--muted);margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid var(--border)}
  .ticket h3{font-size:18px;margin:26px 0 12px;color:var(--text);border-left:4px solid var(--accent);padding-left:10px}
  .ticket h4{font-size:15.5px;margin:18px 0 8px;color:var(--accent)}
  .ticket p{margin-bottom:12px}
  .ticket ul,.ticket ol{margin:0 0 14px 24px}
  .ticket li{margin-bottom:6px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin:16px 0;box-shadow:var(--shadow)}
  .card.note{border-left:4px solid var(--accent)}
  .card.warn{border-left:4px solid var(--warning);background:rgba(168,118,31,.06)}
  .card.law{border-left:4px solid var(--success);background:rgba(30,125,78,.05)}
  .card-title{font-weight:700;margin-bottom:8px;font-size:14.5px}
  .card.note .card-title{color:var(--accent)}
  .card.warn .card-title{color:var(--warning)}
  .card.law .card-title{color:var(--success)}
  table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}
  th,td{border:1px solid var(--border);padding:9px 12px;text-align:left;vertical-align:top}
  th{background:var(--bg);font-weight:700}
  .tasks-header{margin:34px 0 16px;padding:12px 18px;background:linear-gradient(90deg,var(--accent),var(--accent-hover));color:#fff;border-radius:10px;font-size:17px;font-weight:700}
  .task{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .task-title{font-weight:700;margin-bottom:10px;color:var(--accent);font-size:15px}
  .task .question{margin-bottom:12px}
  .options{list-style:none;margin:0 0 12px 0}
  .options li{margin-bottom:6px}
  .options label{display:flex;gap:9px;align-items:flex-start;padding:8px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;font-size:14px}
  .options label:hover{border-color:var(--accent);background:var(--bg)}
  .options input{margin-top:4px;accent-color:var(--accent)}
  .options label.correct{border-color:var(--success);background:rgba(30,125,78,.1)}
  .options label.wrong{border-color:var(--error);background:rgba(176,58,58,.1)}
  .feedback{margin-top:10px;font-size:14px;padding:10px 14px;border-radius:8px;display:none}
  .feedback.show{display:block}
  .feedback.ok{background:rgba(30,125,78,.12);color:var(--success);border-left:3px solid var(--success)}
  .feedback.bad{background:rgba(176,58,58,.1);color:var(--error);border-left:3px solid var(--error)}
  .feedback .explain{display:block;margin-top:6px;color:var(--text);font-size:13.5px}
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .match-item{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px}
  .match-item.left{background:var(--bg);font-weight:600}
  .match-item select{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:14px}
  textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;resize:vertical;margin-bottom:10px}
  textarea:focus{outline:2px solid var(--accent)}
  .reveal-btn{background:var(--bg);border:1px dashed var(--accent);color:var(--accent);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;margin-top:6px}
  .reveal-btn:hover{background:var(--accent);color:#fff}
  .reveal-content{display:none;margin-top:10px;padding:12px 16px;background:var(--bg);border-radius:8px;border-left:3px solid var(--accent);font-size:14px}
  .reveal-content.show{display:block}
  .ticket-nav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--border)}
  .ticket-nav .btn{flex:1;text-align:center}
  .menu-toggle{display:none;position:fixed;bottom:20px;right:20px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:200}
  @media (max-width:900px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}.main{margin-left:0;padding:20px 16px 90px}.menu-toggle{display:block}.match-grid{grid-template-columns:1fr}}
  .footer{margin-top:50px;padding-top:20px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>📘 Раздел 4</h1>
      <p>Сделки и представительство</p>
    </div>
    <input type="text" class="search-box" id="searchBox" placeholder="🔍 Поиск...">
    <div class="progress-wrap">
      <div class="progress-label"><span>Прогресс</span><span id="progressText">0 / 10</span></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    </div>
    <nav id="nav"></nav>
    <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn" onclick="toggleTheme()" id="themeBtn">🌙 Тема</button>
      <button class="btn" onclick="resetProgress()">↺ Сброс</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="breadcrumb" id="breadcrumb">Раздел 4 · Билет 1</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <a href="razdel3.html" class="btn">← Раздел 3</a>
        <a href="razdel5.html" class="btn">Раздел 5 →</a>
      </div>
    </div>
    <div id="content"></div>
    <div class="footer">© Учебный материал по курсу «Гражданское право (Общая часть)».<br>ГК Республики Беларусь (по состоянию на 2026 г.).</div>
  </main>
  <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
</div>

<script>
const tickets = [
{
  id:"b1",
  section:"Раздел 4. Сделки и представительство",
  title:"Билет 1. Понятие и признаки сделки",
  subtitle:"Сделка как правомерное волевое действие.",
  body:`
    <h3>1. Понятие сделки (ст. 154 ГК)</h3>
    <p><strong>Сделки</strong> — действия граждан и юридических лиц, направленные на установление, изменение или прекращение гражданских прав и обязанностей.</p>

    <h3>2. Основные признаки сделки</h3>
    <ul>
      <li><strong>Правомерное действие</strong> — совершается в соответствии с требованиями закона. Сделка, не соответствующая этим требованиям, недействительна.</li>
      <li><strong>Особая направленность</strong> — направлена на возникновение, изменение или прекращение прав и обязанностей.</li>
      <li><strong>Волевое действие</strong> — предполагает наличие у субъекта определённого уровня сознания и воли. Лица должны обладать правоспособностью и дееспособностью.</li>
      <li><strong>Юридический факт</strong> — факт реальной действительности, с наличием которого закон связывает юридические последствия.</li>
    </ul>

    <h3>3. Воля и волеизъявление</h3>
    <p>Для того чтобы сделка породила правовые последствия, воля лица должна быть выражена вовне. Способы выражения воли называются <strong>волеизъявлением</strong>. Три группы:</p>
    <ol>
      <li><strong>Прямое волеизъявление</strong> — устно или письменно (заключение договора купли-продажи).</li>
      <li><strong>Косвенное волеизъявление</strong> — конклюдентные действия (оплата проезда в транспорте, покупка через автомат).</li>
      <li><strong>Волеизъявление молчанием</strong> — в случаях, предусмотренных законом или соглашением сторон (например, возобновление договора аренды при отсутствии возражений).</li>
    </ol>

    <h3>4. Сделка как юридический факт</h3>
    <p>Сделка — правомерное действие, порождающее гражданско-правовые последствия. В отличие от других юридических фактов (например, событий), сделка всегда волевое действие.</p>

    <div class="card law">
      <div class="card-title">⚖️ Статья 154 ГК</div>
      Определяет сделку как действие, направленное на установление, изменение или прекращение гражданских прав и обязанностей.
    </div>

    <div class="card note">
      <div class="card-title">💡 Отличие от других действий</div>
      Сделка — всегда правомерное действие с направленностью на правовой результат. Неправомерные действия (причинение вреда, неосновательное обогащение) — не сделки, хотя могут порождать обязательства.
    </div>
  `,
  tasks:[
    {type:"single",q:"Что такое сделка?",options:["Любое действие человека","Действие, направленное на возникновение, изменение или прекращение прав и обязанностей","Только договор","Правонарушение"],correct:1,explain:"Ст. 154 ГК: сделка — действие, направленное на юридические последствия."},
    {type:"multi",q:"Какие признаки сделки?",options:["Правомерность","Направленность на правовой результат","Волевой характер","Неправомерность"],correct:[0,1,2],explain:"Неправомерность — не признак сделки."},
    {type:"match",q:"Соотнесите способ волеизъявления с примером:",left:["Прямое","Косвенное","Молчание"],right:["Подписание договора","Оплата через автомат","Отсутствие возражений при пролонгации аренды"],correct:[0,1,2],explain:"Три группы волеизъявления."},
    {type:"case",q:"Кейс. Гражданин приобрёл билет в метро через автомат. Какая форма волеизъявления использована?",answer:"Косвенное волеизъявление — конклюдентные действия. Гражданин не произносил слов и не подписывал документ, но своими действиями (опустил монету, взял билет) выразил волю на заключение договора перевозки. Сделка считается совершённой."}
  ]
},
{
  id:"b2",
  section:"Раздел 4. Сделки и представительство",
  title:"Билет 2. Виды сделок",
  subtitle:"Классификация сделок по различным критериям.",
  body:`
    <h3>1. Классификация по числу сторон</h3>
    <ul>
      <li><strong>Односторонние</strong> — для совершения достаточно волеизъявления одной стороны (завещание, выдача доверенности, отказ от наследства).</li>
      <li><strong>Двусторонние</strong> — договоры аренды, займа, купли-продажи.</li>
      <li><strong>Многосторонние</strong> — договор о совместной деятельности (простого товарищества).</li>
    </ul>

    <h3>2. По принципу встречного предоставления</h3>
    <ul>
      <li><strong>Возмездные</strong> — одной стороне соответствует встречное предоставление (купля-продажа, перевозка).</li>
      <li><strong>Безвозмездные</strong> — одна сторона предоставляет что-либо другой без встречного предоставления (дарение, ссуда).</li>
    </ul>

    <h3>3. По моменту заключения</h3>
    <ul>
      <li><strong>Консенсуальные</strong> — считаются совершёнными с момента достижения соглашения в требуемой форме (поставка, контрактация).</li>
      <li><strong>Реальные</strong> — кроме соглашения, требуется передача вещи (заём, хранение, дарение).</li>
    </ul>

    <h3>4. По основанию</h3>
    <ul>
      <li><strong>Каузальные</strong> — правовое основание известно (покупка, выполнение работы). Можно оспорить, ссылаясь на недействительность основания.</li>
      <li><strong>Абстрактные</strong> — действительность не зависит от основания (вексель).</li>
    </ul>

    <h3>5. Фидуциарные сделки</h3>
    <p>Сделки, имеющие <strong>доверительный характер</strong> (доверенность, договор поручения). Утрата доверия может привести к прекращению отношений в одностороннем порядке.</p>

    <h3>6. Условные сделки (ст. 158 ГК)</h3>
    <ul>
      <li><strong>Под отлагательным условием</strong> — возникновение прав и обязанностей зависит от обстоятельства, относительно которого неизвестно, наступит оно или нет.</li>
      <li><strong>Под отменительным условием</strong> — прекращение прав и обязанностей зависит от такого обстоятельства.</li>
    </ul>
    <p>Если наступлению условия недобросовестно воспрепятствовала сторона, которой это невыгодно, условие признаётся наступившим. Если недобросовестно содействовала — признаётся ненаступившим.</p>

    <div class="card note">
      <div class="card-title">💡 Пример условной сделки</div>
      «Продам квартиру, если получу работу в другом городе» — отлагательное условие. Если я не получу работу, сделка не вступит в силу.
    </div>
  `,
  tasks:[
    {type:"single",q:"Какая сделка является реальной?",options:["Купля-продажа","Заём","Поставка","Аренда"],correct:1,explain:"Заём считается заключённым с момента передачи денег или вещей."},
    {type:"multi",q:"Какие сделки относятся к односторонним?",options:["Завещание","Доверенность","Договор купли-продажи","Отказ от наследства"],correct:[0,1,3],explain:"Для односторонних сделок достаточно волеизъявления одной стороны."},
    {type:"match",q:"Соотнесите вид сделки с примером:",left:["Возмездная","Безвозмездная","Абстрактная"],right:["Купля-продажа","Дарение","Вексель"],correct:[0,1,2],explain:"Разные основания и признаки."},
    {type:"case",q:"Кейс. Гражданин обещал подарить другу автомобиль, если тот закончит университет с отличием. Друг окончил университет с отличием. Имеет ли он право на автомобиль?",answer:"Да. Это сделка под отлагательным условием (ст. 158 ГК): возникновение прав и обязанностей зависит от обстоятельства (окончание с отличием). Условие наступило, значит сделка вступает в силу. Гражданин обязан передать автомобиль. Если бы он недобросовестно воспрепятствовал наступлению условия, оно всё равно считалось бы наступившим."}
  ]
},
{
  id:"b3",
  section:"Раздел 4. Сделки и представительство",
  title:"Билет 3. Форма сделок и последствия её несоблюдения",
  subtitle:"Устная, письменная (простая и нотариальная) формы. Государственная регистрация.",
  body:`
    <h3>1. Понятие формы сделки</h3>
    <p><strong>Форма сделки</strong> — способ фиксации волеизъявления участников сделки. Воля может быть выражена устно, письменно, действием, молчанием.</p>

    <h3>2. Устная форма</h3>
    <p>Применяется, если закон не устанавливает обязательность письменной формы. Устно могут совершаться:</p>
    <ul>
      <li>сделки, исполняемые при самом их совершении (кроме сделок, требующих нотариальной формы или государственной регистрации);</li>
      <li>сделки во исполнение договора, заключённого в письменной форме (если это не противоречит закону, договору).</li>
    </ul>
    <p>Сделка, которая может быть совершена устно, считается совершённой и при совершении конклюдентных действий.</p>

    <h3>3. Письменная форма</h3>
    <h4>3.1. Простая письменная:</h4>
    <p>Совершается путём составления документа, подписанного сторонами, либо обмена документами (почта, электронная связь).</p>
    <p>Обязательна для:</p>
    <ul>
      <li>сделок юридических лиц между собой и с гражданами;</li>
      <li>сделок граждан между собой на сумму, превышающую 10 базовых величин;</li>
      <li>иных случаев, установленных законом.</li>
    </ul>
    <p><strong>Последствия несоблюдения:</strong> стороны лишаются права ссылаться на свидетельские показания, но могут приводить письменные и иные доказательства. В случаях, прямо указанных в законе, сделка недействительна (например, внешнеэкономическая сделка).</p>
    <h4>3.2. Нотариальная форма:</h4>
    <p>Требуется по закону (ипотека, рента, завещание) либо по соглашению сторон. Несоблюдение влечёт <strong>ничтожность</strong> сделки.</p>

    <p>Договор, подлежащий государственной регистрации, считается заключённым с момента регистрации.</p>

    <p>Молчание признаётся выражением воли совершить сделку только в случаях, прямо предусмотренных законом (например, если арендатор продолжает пользоваться имуществом после истечения срока договора при отсутствии возражений арендодателя).</p>

  body:`
    <h3>1. Понятие недействительной сделки</h3>
    <p><strong>Недействительная сделка</strong> — действие (юридический факт), направленное на возникновение, изменение или прекращение гражданского правоотношения, но не порождающее желаемых сторонами последствий, а влекущее иные негативные последствия.</p>

    <h3>2. Ничтожные и оспоримые сделки</h3>
    <table>
      <tr><th>Критерий</th><th>Ничтожная</th><th>Оспоримая</th></tr>

      <tr><td>Срок исковой давности</td><td>10 лет</td><td>1 год (по некоторым — 3 года)</td></tr>

    </table>

    <h3>3. Сделки с пороками субъектного состава</h3>
    <ul>
      <li><strong>Ничтожны:</strong> сделки малолетних (до 14 лет), кроме мелких бытовых; сделки граждан, признанных недееспособными.</li>
      <li><strong>Оспоримы:</strong> сделки несовершеннолетних 14–18 лет без согласия законных представителей; сделки граждан, ограниченных в дееспособности; сделки юридического лица, выходящие за пределы правоспособности.</li>

  body:`
    <h3>1. Понятие реституции</h3>
    <p><strong>Реституция</strong> — восстановление положения, существовавшего до нарушения права. Основное последствие недействительности сделки.</p>

    <h3>2. Двусторонняя реституция</h3>
    <p>Общее правило (п. 2 ст. 168 ГК): каждая сторона обязана возвратить другой всё полученное по сделке, а при невозможности возвратить в натуре — возместить стоимость в деньгах.</p>

    <h3>3. Односторонняя реституция</h3>
    <p>Потерпевшему возвращается всё полученное другой стороной, а полученное потерпевшим (а также причитавшееся ему) обращается в доход Республики Беларусь. Применяется при наличии умысла у одной стороны.</p>

    <h3>4. Недопущение реституции</h3>
    <p>При наличии умысла у обеих сторон сделки, совершение которой запрещено законодательством (ст. 170 ГК), всё полученное взыскивается в доход Республики Беларусь.</p>

    <h3>5. Дополнительные последствия</h3>
    <ul>
      <li>Возмещение расходов, стоимости утраченного или повреждённого имущества.</li>
      <li>Возмещение убытков (например, при обмане, насилии).</li>
      <li>Компенсация морального вреда в отдельных случаях.</li>
    </ul>

    <h3>6. Недействительность части сделки (ст. 181 ГК)</h3>
    <p>Недействительность части сделки не влечёт недействительности прочих частей, если можно предположить, что сделка была бы совершена и без включения недействительной части.</p>

    <h3>7. Момент недействительности</h3>
    <p>По общему правилу сделка недействительна с момента её совершения. Если из содержания сделки вытекает, что она может быть лишь прекращена на будущее время, суд прекращает её действие на будущее.</p>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 168–171 ГК</div>
      Регулируют последствия недействительности сделок и их виды.

  title:"Билет 7. Понятие и виды представительства",

  body:`
    <h3>1. Понятие представительства (ст. 183 ГК)</h3>
    <p><strong>Представительство</strong> — совершение одним лицом (представителем) в силу имеющегося у него полномочия сделок и иных юридических действий от имени и в интересах другого лица (представляемого), которые непосредственно создают, изменяют или прекращают гражданские права и обязанности представляемого.</p>

    <h3>2. Признаки представительства</h3>
    <ul>
      <li>Представитель действует не от своего имени, а от имени представляемого.</li>
      <li>Действия в пределах полномочий считаются действиями представляемого.</li>
      <li>Представитель действует строго в рамках полномочий. При превышении — права и обязанности возникают у представителя, если представляемый не одобрит сделку.</li>
      <li>Представитель должен действовать осмысленно и разумно (быть дееспособным).</li>
    </ul>

    <h3>3. Полномочие</h3>
    <p><strong>Полномочие</strong> — субъективное право представителя совершать сделки и иные юридические действия от имени представляемого. Определяет круг действий представителя.</p>

    <h3>4. Виды представительства</h3>
    <h4>4.1. Законное (обязательное):</h4>
    <p>Возникает в силу прямого указания закона. Не зависит от воли представляемого. Законные представители:</p>
    <ul>
      <li>родители, усыновители, опекуны — за малолетних и недееспособных;</li>
      <li>попечители — за ограниченных в дееспособности.</li>
    </ul>
    <h4>4.2. Добровольное (договорное):</h4>
    <p>Осуществляется на основании договора. Требует специального оформления. Круг действий определяется представляемым. Основано на выдаче доверенности или заключении договора.</p>

    <h3>5. Коммерческое представительство (ст. 185 ГК)</h3>
    <p>Особая разновидность добровольного представительства. Коммерческий представитель — лицо, постоянно и самостоятельно представительствующее от имени предпринимателей при заключении договоров в сфере предпринимательской деятельности.</p>

      <li>допускается одновременное представительство разных сторон с их согласия;</li>
      <li>обязан сохранять тайну сделок.</li>

    <p>Представитель не может совершать действия в отношении себя лично, а также в отношении другого лица, представителем которого он одновременно является (кроме коммерческого). Нельзя через представителя осуществлять права строго личного характера (вступление в брак, усыновление, составление завещания).</p>

const navEl=document.getElementById('nav');
const contentEl=document.getElementById('content');
const breadcrumbEl=document.getElementById('breadcrumb');
const progressTextEl=document.getElementById('progressText');
const progressFillEl=document.getElementById('progressFill');
let currentTicket=tickets[0].id;
const STORAGE_KEY='gp_progress_rz4_v1';
let progress=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');

function buildNav(){
  const sections={};
  tickets.forEach(t=>{if(!sections[t.section])sections[t.section]=[];sections[t.section].push(t);});
  let html='';
  Object.keys(sections).forEach(sec=>{
    html+=`<div class="nav-section"><div class="nav-section-title">${sec}</div><ul class="nav-list">`;
    sections[sec].forEach(t=>{
      const done=progress[t.id]?'<span class="check">✓</span>':'';
      html+=`<li><a href="#${t.id}" data-id="${t.id}">${done}<span>${t.title.replace(/^Билет \\d+\\.\\s*/,'')}</span></a></li>`;
    });
    html+='</ul></div>';
  });
  navEl.innerHTML=html;
  navEl.querySelectorAll('a').forEach(a=>{
    a.addEventListener('click',e=>{e.preventDefault();showTicket(a.dataset.id);document.getElementById('sidebar').classList.remove('open');});
  });
}
function showTicket(id){
  currentTicket=id;
  const t=tickets.find(x=>x.id===id);
  if(!t)return;
  breadcrumbEl.textContent=t.section+' · '+t.title.split('.')[0];
  contentEl.innerHTML=`
    <div class="ticket active">
      <h2>${t.title}</h2>
      <p class="subtitle">${t.subtitle}</p>
      ${t.body}
      <div class="tasks-header">📝 Задания для закрепления</div>
      <div id="tasks-${t.id}"></div>
      <div class="ticket-nav">
        ${prevTicketId(id)?`<button class="btn" onclick="showTicket('${prevTicketId(id)}')">← Предыдущий</button>`:'<span></span>'}
        <button class="btn btn-primary" onclick="markDone('${t.id}')">✓ Отметить как изученный</button>
        ${nextTicketId(id)?`<button class="btn" onclick="showTicket('${nextTicketId(id)}')">Следующий →</button>`:'<span></span>'}
      </div>
    </div>`;
  renderTasks(t);
  updateNavActive();
  window.scrollTo({top:0,behavior:'smooth'});
}
function prevTicketId(id){const i=tickets.findIndex(t=>t.id===id);return i>0?tickets[i-1].id:null;}
function nextTicketId(id){const i=tickets.findIndex(t=>t.id===id);return i<tickets.length-1?tickets[i+1].id:null;}
function updateNavActive(){navEl.querySelectorAll('a').forEach(a=>{a.classList.toggle('active',a.dataset.id===currentTicket);});}
function renderTasks(t){
  const container=document.getElementById('tasks-'+t.id);
  if(!container)return;
  let html='';
  t.tasks.forEach((task,idx)=>{
    html+=`<div class="task" id="task-${t.id}-${idx}"><div class="task-title">Задание ${idx+1}</div><div class="question">${task.q}</div>`;
    if(task.type==='single'){
      html+='<ul class="options">';
      task.options.forEach((opt,i)=>{html+=`<li><label><input type="radio" name="single-${t.id}-${idx}" value="${i}"> <span>${opt}</span></label></li>`;});
      html+='</ul>';
      html+=`<button class="btn btn-primary" onclick="checkSingle('${t.id}',${idx})">Проверить</button><div class="feedback" id="fb-${t.id}-${idx}"></div>`;
    }else if(task.type==='multi'){
      html+='<ul class="options">';
      task.options.forEach((opt,i)=>{html+=`<li><label><input type="checkbox" name="multi-${t.id}-${idx}" value="${i}"> <span>${opt}</span></label></li>`;});
      html+='</ul>';
      html+=`<button class="btn btn-primary" onclick="checkMulti('${t.id}',${idx})">Проверить</button><div class="feedback" id="fb-${t.id}-${idx}"></div>`;
    }else if(task.type==='match'){
      html+='<div class="match-grid">';
      task.left.forEach((left,i)=>{
        html+=`<div class="match-item left">${left}</div><div class="match-item"><select id="match-${t.id}-${idx}-${i}"><option value="">— выберите —</option>`;
        task.right.forEach((r,j)=>{html+=`<option value="${j}">${r}</option>`;});
        html+='</select></div>';
      });
      html+='</div>';
      html+=`<button class="btn btn-primary" onclick="checkMatch('${t.id}',${idx})">Проверить</button><div class="feedback" id="fb-${t.id}-${idx}"></div>`;
    }else if(task.type==='case'){
      html+=`<textarea placeholder="Напишите ответ..." id="case-${t.id}-${idx}"></textarea>`;
      html+=`<button class="reveal-btn" onclick="toggleReveal('${t.id}',${idx})">👁 Показать образец</button><div class="reveal-content" id="reveal-${t.id}-${idx}"><strong>Образец:</strong><br>${task.answer}</div>`;
    }
    html+='</div>';
  });
  container.innerHTML=html;
}
function checkSingle(tid,idx){
  const t=tickets.find(x=>x.id===tid);const task=t.tasks[idx];
  const selected=document.querySelector(`input[name="single-${tid}-${idx}"]:checked`);
  const fb=document.getElementById(`fb-${tid}-${idx}`);
  const labels=document.querySelectorAll(`#task-${tid}-${idx} .options label`);
  labels.forEach((l,i)=>{l.classList.remove('correct','wrong');if(i===task.correct)l.classList.add('correct');});
  if(!selected){fb.className='feedback show bad';fb.innerHTML='Выберите вариант.';return;}
  const val=parseInt(selected.value);
  if(val===task.correct){fb.className='feedback show ok';fb.innerHTML='✅ Правильно! <span class="explain">'+task.explain+'</span>';}
  else{selected.parentElement.classList.add('wrong');fb.className='feedback show bad';fb.innerHTML='❌ Неправильно. <span class="explain">'+task.explain+'</span>';}
}
function checkMulti(tid,idx){
  const t=tickets.find(x=>x.id===tid);const task=t.tasks[idx];
  const selected=Array.from(document.querySelectorAll(`input[name="multi-${tid}-${idx}"]:checked`)).map(c=>parseInt(c.value));
  const fb=document.getElementById(`fb-${tid}-${idx}`);
  const labels=document.querySelectorAll(`#task-${tid}-${idx} .options label`);
  labels.forEach((l,i)=>{l.classList.remove('correct','wrong');if(task.correct.includes(i))l.classList.add('correct');if(selected.includes(i)&&!task.correct.includes(i))l.classList.add('wrong');});
  const ok=selected.length===task.correct.length&&selected.every(v=>task.correct.includes(v));
  if(ok){fb.className='feedback show ok';fb.innerHTML='✅ Правильно! <span class="explain">'+task.explain+'</span>';}
  else{fb.className='feedback show bad';fb.innerHTML='❌ Неправильно. <span class="explain">'+task.explain+'</span>';}
}
function checkMatch(tid,idx){
  const t=tickets.find(x=>x.id===tid);const task=t.tasks[idx];
  const fb=document.getElementById(`fb-${tid}-${idx}`);
  let ok=true;
  task.left.forEach((_,i)=>{const sel=document.getElementById(`match-${tid}-${idx}-${i}`);if(parseInt(sel.value)!==task.correct[i])ok=false;});
  if(ok){fb.className='feedback show ok';fb.innerHTML='✅ Всё верно! <span class="explain">'+task.explain+'</span>';}
  else{fb.className='feedback show bad';fb.innerHTML='❌ Есть ошибки. <span class="explain">'+task.explain+'</span>';}
}
function toggleReveal(tid,idx){document.getElementById(`reveal-${tid}-${idx}`).classList.toggle('show');}
function markDone(id){progress[id]=true;localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));buildNav();updateNavActive();updateProgress();const next=nextTicketId(id);if(next)setTimeout(()=>showTicket(next),300);}
function updateProgress(){const done=Object.keys(progress).length;const total=tickets.length;progressTextEl.textContent=`${done} / ${total}`;progressFillEl.style.width=(done/total*100)+'%';}
function resetProgress(){if(confirm('Сбросить прогресс?')){progress={};localStorage.removeItem(STORAGE_KEY);buildNav();updateNavActive();updateProgress();}}
function toggleTheme(){const html=document.documentElement;const isDark=html.getAttribute('data-theme')==='dark';html.setAttribute('data-theme',isDark?'light':'dark');localStorage.setItem('gp_theme',isDark?'light':'dark');document.getElementById('themeBtn').textContent=isDark?'🌙 Тема':'☀️ Тема';}
document.getElementById('searchBox').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();navEl.querySelectorAll('a').forEach(a=>{const t=tickets.find(x=>x.id===a.dataset.id);const m=!q||t.title.toLowerCase().includes(q)||t.subtitle.toLowerCase().includes(q)||t.body.toLowerCase().includes(q);a.parentElement.style.display=m?'':'none';});navEl.querySelectorAll('.nav-section').forEach(sec=>{const v=Array.from(sec.querySelectorAll('li')).some(li=>li.style.display!=='none');sec.style.display=v?'':'none';});});
(function init(){const savedTheme=localStorage.getItem('gp_theme');if(savedTheme==='dark'){document.documentElement.setAttribute('data-theme','dark');document.getElementById('themeBtn').textContent='☀️ Тема';}buildNav();showTicket(currentTicket);updateProgress();})();
</script>
</body>
