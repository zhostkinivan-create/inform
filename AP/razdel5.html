<style>

  .progress-wrap{margin-bottom:14px}

  .nav-section{margin-bottom:6px}

  .nav-list li a{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:13.5px;color:var(--text);text-decoration:none;border-radius:6px;margin-bottom:2px;transition:background .15s}
  .nav-list li a:hover{background:var(--bg);color:var(--accent)}

  .task .question{margin-bottom:12px}
  .options{list-style:none;margin:0 0 12px 0}

  .options label.correct{border-color:var(--success);background:rgba(30,125,78,.1)}
  .options label.wrong{border-color:var(--error);background:rgba(176,58,58,.1)}
  .feedback{margin-top:10px;font-size:14px;padding:10px 14px;border-radius:8px;display:none}
  .feedback.show{display:block}
  .feedback.ok{background:rgba(30,125,78,.12);color:var(--success);border-left:3px solid var(--success)}
  .feedback.bad{background:rgba(176,58,58,.1);color:var(--error);border-left:3px solid var(--error)}
  .feedback .explain{display:block;margin-top:6px;color:var(--text);font-size:13.5px}
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .match-item{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px}
  .match-item.left{background:var(--bg);font-weight:600}
  .match-item select{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:14px}
  textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;resize:vertical;margin-bottom:10px}
  textarea:focus{outline:2px solid var(--accent)}
  .reveal-btn{background:var(--bg);border:1px dashed var(--accent);color:var(--accent);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;margin-top:6px}
  .reveal-btn:hover{background:var(--accent);color:#fff}
  .reveal-content{display:none;margin-top:10px;padding:12px 16px;background:var(--bg);border-radius:8px;border-left:3px solid var(--accent);font-size:14px}
  .reveal-content.show{display:block}
  .ticket-nav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--border)}
  .ticket-nav .btn{flex:1;text-align:center}
  .menu-toggle{display:none;position:fixed;bottom:20px;right:20px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:200}

  .footer{margin-top:50px;padding-top:20px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);text-align:center}
</style>

<script>
const tickets = [
{
  id:"b1",
  section:"Раздел 5. Сроки и исковая давность",
  title:"Билет 1. Понятие и виды сроков в гражданском праве",
  subtitle:"Классификация сроков и их правовое значение.",
  body:`
    <h3>1. Понятие срока (ст. 191 ГК)</h3>
    <p><strong>Срок</strong> — календарная дата либо период времени, с наступлением или истечением которого возникают, изменяются или прекращаются гражданские правоотношения.</p>

    <h3>2. Классификация сроков</h3>
    <h4>2.1. По тому, кем устанавливаются:</h4>
    <ul>
      <li><strong>Нормативные</strong> — установлены законодательством, носят императивный характер (сроки исковой давности, приобретательной давности).</li>
      <li><strong>Договорные</strong> — установлены соглашением сторон. Могут быть изменены соглашением сторон.</li>
      <li><strong>Судебные</strong> — установлены судом. Не могут быть изменены сторонами (например, срок совершения действий по опровержению сведений).</li>
    </ul>
    <h4>2.2. По правовым последствиям:</h4>
    <ul>
      <li><strong>Правообразующие</strong> — влекут возникновение правоотношения.</li>
      <li><strong>Правоизменяющие</strong> — влекут изменение правоотношения.</li>
      <li><strong>Правопрекращающие</strong> — влекут прекращение правоотношения.</li>
    </ul>
    <h4>2.3. По способу обозначения:</h4>
    <ul>
      <li>Установленные календарной датой.</li>
      <li>Возникающие с истечением периода времени.</li>
      <li>Определённые наступлением событий.</li>
    </ul>
    <h4>2.4. По назначению:</h4>
    <ul>
      <li><strong>Сроки осуществления гражданских прав</strong> — время, в течение которого управомоченное лицо может реализовать своё право. Подразделяются на:
        <ul>
          <li><strong>Пресекательные (преклюзивные)</strong> — предоставляются для реализации субъективного права;</li>
          <li><strong>Гарантийные</strong> — период, в течение которого обязанное лицо отвечает за ненадлежащее качество (продавец, изготовитель);</li>
          <li><strong>Претензионные</strong> — период для предварительного (до суда) обращения к нарушителю.</li>
        </ul>
      </li>
      <li><strong>Сроки исполнения обязанностей</strong> — время, в течение которого обязанные лица должны исполнить обязательства.</li>
      <li><strong>Сроки защиты нарушенных прав</strong> — исковая давность.</li>
    </ul>

    <h3>3. Исчисление сроков (ст. 192–194 ГК)</h3>
    <p>Течение срока, определённого периодом времени, начинается <strong>на следующий день</strong> после календарной даты или наступления события, которыми определено его начало (ст. 192 ГК).</p>
    <p>Окончание срока (ст. 193 ГК):</p>
    <ul>
      <li>срок, исчисляемый годами, истекает в соответствующий месяц и число последнего года;</li>
      <li>срок, исчисляемый месяцами, — в соответствующее число последнего месяца;</li>
      <li>срок, исчисляемый неделями, — в соответствующий день последней недели.</li>
    </ul>
    <p>В последний день срока действия могут быть выполнены до 24 часов. Если действие должно быть совершено в конкретной организации — срок истекает в тот час, когда в организации прекращаются соответствующие операции. Если последний день — нерабочий, днём окончания считается ближайший рабочий день (ст. 194 ГК).</p>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 191–194 ГК</div>
      Регулируют понятие, исчисление и окончание сроков.
    </div>
  `,
  tasks:[
    {type:"single",q:"С какого дня начинается течение срока, определённого периодом времени?",options:["Со дня подписания договора","На следующий день после календарной даты или наступления события","Через три дня","С момента регистрации"],correct:1,explain:"Ст. 192 ГК: течение срока начинается на следующий день после события."},
    {type:"multi",q:"Какие сроки выделяют по назначению?",options:["Сроки осуществления прав","Сроки исполнения обязанностей","Сроки защиты нарушенных прав","Сроки оплаты налогов"],correct:[0,1,2],explain:"Три группы по назначению."},
    {type:"match",q:"Соотнесите вид срока с примером:",left:["Пресекательный","Гарантийный","Претензионный"],right:["Срок реализации преимущественного права","Срок гарантии на товар","Срок для предъявления претензии перевозчику"],correct:[0,1,2],explain:"Разные виды сроков осуществления прав."},
    {type:"case",q:"Кейс. Договор заключён 15 марта 2026 года. Срок исполнения — 3 месяца. Когда истекает срок?",answer:"Течение срока начинается 16 марта 2026 года. Срок 3 месяца истекает 15 июня 2026 года (в соответствующее число последнего месяца). Если 15 июня — нерабочий день, срок переносится на ближайший рабочий день."}
  ]
},
{
  id:"b2",
  section:"Раздел 5. Сроки и исковая давность",
  title:"Билет 2. Понятие исковой давности и её значение",
  subtitle:"Срок для защиты нарушенного права.",
  body:`
    <h3>1. Понятие исковой давности (ст. 197 ГК)</h3>
    <p><strong>Исковая давность</strong> — установленный законодательными актами срок, в пределах которого лицо может защитить своё нарушенное субъективное право путём предъявления иска.</p>
    <p><strong>Иск</strong> — обращённое к суду и ответчику требование заинтересованного лица о защите нарушенного или оспоренного субъективного права.</p>

    <h3>2. Значение исковой давности</h3>
    <ul>
      <li>Устранение неопределённости в гражданском обороте.</li>
      <li>Упорядочение гражданских правоотношений.</li>
      <li>Стимулирование своевременной защиты прав.</li>
    </ul>

    <h3>3. Императивность правил</h3>
    <p>Правила об исковой давности носят <strong>императивный характер</strong>. Стороны не могут изменить их по своему соглашению. Исковая давность применяется судом только по заявлению стороны в споре, сделанному до вынесения решения.</p>

    <h3>4. Виды сроков исковой давности</h3>
    <ul>
      <li><strong>Общий срок — 3 года</strong> (ст. 197 ГК). Применяется ко всем правоотношениям, кроме тех, для которых установлен специальный срок или нет давностного срока.</li>
      <li><strong>Специальные сроки</strong> — могут быть как более, так и менее общего:
        <ul>
          <li>10 лет — по требованию об установлении факта ничтожности сделки;</li>
          <li>1 год — по спорам из перевозок всеми видами транспорта;</li>
          <li>3 месяца — для требований участника долевой собственности о переводе прав покупателя при нарушении преимущественного права покупки.</li>
        </ul>
      </li>
    </ul>

    <h3>5. Начало течения срока (ст. 201 ГК)</h3>
    <p>Течение срока исковой давности начинается <strong>со дня, когда лицо узнало или должно было узнать о нарушении своего права</strong>.</p>
    <p>По некоторым требованиям начальный момент определяется специальными правилами (например, по искам о недостатках работы по договору подряда — со дня принятия результата).</p>

    <h3>6. Требования, на которые исковая давность не распространяется (ст. 209 ГК)</h3>
    <ol>
      <li>Требования, вытекающие из нарушения личных неимущественных прав и других нематериальных благ (кроме случаев, предусмотренных законом).</li>
      <li>Требования вкладчиков к банку о возврате вкладов.</li>
      <li>Требования о возмещении вреда, причинённого жизни или здоровью гражданина. Однако требования, предъявленные по истечении 3 лет с момента возникновения права, удовлетворяются не более чем за 3 года, предшествовавшие предъявлению иска.</li>
      <li>Требования собственника или иного законного владельца об устранении всяких нарушений его права, не связанных с лишением владения (негаторный иск).</li>
    </ol>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 197–209 ГК</div>
      Регулируют исковую давность: понятие, виды, начало течения, требования, на которые она не распространяется.
    </div>
  `,
  tasks:[
    {type:"single",q:"Какой общий срок исковой давности?",options:["1 год","2 года","3 года","5 лет"],correct:2,explain:"Общий срок — 3 года (ст. 197 ГК)."},
    {type:"multi",q:"На какие требования исковая давность не распространяется?",options:["О защите личных неимущественных прав","О возврате банковских вкладов","О возмещении вреда жизни и здоровью","О взыскании долга по договору займа"],correct:[0,1,2],explain:"Взыскание долга — обычное требование, давность распространяется."},
    {type:"match",q:"Соотнесите вид срока с продолжительностью:",left:["Общий","Ничтожная сделка","Перевозка"],right:["3 года","10 лет","1 год"],correct:[0,1,2],explain:"Разные сроки для разных требований."},
    {type:"case",q:"Кейс. Гражданин узнал о нарушении своего права 10 января 2026 года. Когда истекает срок исковой давности?",answer:"Срок начинается 11 января 2026 года. Общий срок исковой давности — 3 года, значит, он истекает 10 января 2029 года. Если 10 января 2029 года — нерабочий день, срок переносится на ближайший рабочий день."}
  ]
},
{
  id:"b3",
  section:"Раздел 5. Сроки и исковая давность",
  title:"Билет 3. Приостановление, перерыв и восстановление сроков исковой давности",
  subtitle:"Изменение течения срока под влиянием обстоятельств.",
  body:`

const navEl=document.getElementById('nav');
const contentEl=document.getElementById('content');
const breadcrumbEl=document.getElementById('breadcrumb');
const progressTextEl=document.getElementById('progressText');
const progressFillEl=document.getElementById('progressFill');
let currentTicket=tickets[0].id;
const STORAGE_KEY='gp_progress_rz5_v1';
let progress=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');

function buildNav(){
  const sections={};
  tickets.forEach(t=>{if(!sections[t.section])sections[t.section]=[];sections[t.section].push(t);});
  let html='';
  Object.keys(sections).forEach(sec=>{
    html+=`<div class="nav-section"><div class="nav-section-title">${sec}</div><ul class="nav-list">`;
    sections[sec].forEach(t=>{
      const done=progress[t.id]?'<span class="check">✓</span>':'';
      html+=`<li><a href="#${t.id}" data-id="${t.id}">${done}<span>${t.title.replace(/^Билет \\d+\\.\\s*/,'')}</span></a></li>`;
    });
    html+='</ul></div>';
  });
  navEl.innerHTML=html;
  navEl.querySelectorAll('a').forEach(a=>{
    a.addEventListener('click',e=>{e.preventDefault();showTicket(a.dataset.id);document.getElementById('sidebar').classList.remove('open');});
  });
}
function showTicket(id){
  currentTicket=id;
  const t=tickets.find(x=>x.id===id);
  if(!t)return;
  breadcrumbEl.textContent=t.section+' · '+t.title.split('.')[0];
  contentEl.innerHTML=`
    <div class="ticket active">
      <h2>${t.title}</h2>
      <p class="subtitle">${t.subtitle}</p>
      ${t.body}
      <div class="tasks-header">📝 Задания для закрепления</div>
      <div id="tasks-${t.id}"></div>
      <div class="ticket-nav">
        ${prevTicketId(id)?`<button class="btn" onclick="showTicket('${prevTicketId(id)}')">← Предыдущий</button>`:'<span></span>'}
        <button class="btn btn-primary" onclick="markDone('${t.id}')">✓ Отметить как изученный</button>
        ${nextTicketId(id)?`<button class="btn" onclick="showTicket('${nextTicketId(id)}')">Следующий →</button>`:'<span></span>'}
      </div>
    </div>`;
  renderTasks(t);
  updateNavActive();
  window.scrollTo({top:0,behavior:'smooth'});
}
function prevTicketId(id){const i=tickets.findIndex(t=>t.id===id);return i>0?tickets[i-1].id:null;}
function nextTicketId(id){const i=tickets.findIndex(t=>t.id===id);return i<tickets.length-1?tickets[i+1].id:null;}
function updateNavActive(){navEl.querySelectorAll('a').forEach(a=>{a.classList.toggle('active',a.dataset.id===currentTicket);});}
function renderTasks(t){
  const container=document.getElementById('tasks-'+t.id);
  if(!container)return;
  let html='';
  t.tasks.forEach((task,idx)=>{
    html+=`<div class="task" id="task-${t.id}-${idx}"><div class="task-title">Задание ${idx+1}</div><div class="question">${task.q}</div>`;
    if(task.type==='single'){
      html+='<ul class="options">';
      task.options.forEach((opt,i)=>{html+=`<li><label><input type="radio" name="single-${t.id}-${idx}" value="${i}"> <span>${opt}</span></label></li>`;});
      html+='</ul>';
      html+=`<button class="btn btn-primary" onclick="checkSingle('${t.id}',${idx})">Проверить</button><div class="feedback" id="fb-${t.id}-${idx}"></div>`;
    }else if(task.type==='multi'){
      html+='<ul class="options">';
      task.options.forEach((opt,i)=>{html+=`<li><label><input type="checkbox" name="multi-${t.id}-${idx}" value="${i}"> <span>${opt}</span></label></li>`;});
      html+='</ul>';
      html+=`<button class="btn btn-primary" onclick="checkMulti('${t.id}',${idx})">Проверить</button><div class="feedback" id="fb-${t.id}-${idx}"></div>`;
    }else if(task.type==='match'){
      html+='<div class="match-grid">';
      task.left.forEach((left,i)=>{
        html+=`<div class="match-item left">${left}</div><div class="match-item"><select id="match-${t.id}-${idx}-${i}"><option value="">— выберите —</option>`;
        task.right.forEach((r,j)=>{html+=`<option value="${j}">${r}</option>`;});
        html+='</select></div>';
      });
      html+='</div>';
      html+=`<button class="btn btn-primary" onclick="checkMatch('${t.id}',${idx})">Проверить</button><div class="feedback" id="fb-${t.id}-${idx}"></div>`;
    }else if(task.type==='case'){
      html+=`<textarea placeholder="Напишите ответ..." id="case-${t.id}-${idx}"></textarea>`;
      html+=`<button class="reveal-btn" onclick="toggleReveal('${t.id}',${idx})">👁 Показать образец</button><div class="reveal-content" id="reveal-${t.id}-${idx}"><strong>Образец:</strong><br>${task.answer}</div>`;
    }
    html+='</div>';
  });
  container.innerHTML=html;
}
function checkSingle(tid,idx){
  const t=tickets.find(x=>x.id===tid);const task=t.tasks[idx];
  const selected=document.querySelector(`input[name="single-${tid}-${idx}"]:checked`);
  const fb=document.getElementById(`fb-${tid}-${idx}`);
  const labels=document.querySelectorAll(`#task-${tid}-${idx} .options label`);
  labels.forEach((l,i)=>{l.classList.remove('correct','wrong');if(i===task.correct)l.classList.add('correct');});
  if(!selected){fb.className='feedback show bad';fb.innerHTML='Выберите вариант.';return;}
  const val=parseInt(selected.value);
  if(val===task.correct){fb.className='feedback show ok';fb.innerHTML='✅ Правильно! <span class="explain">'+task.explain+'</span>';}
  else{selected.parentElement.classList.add('wrong');fb.className='feedback show bad';fb.innerHTML='❌ Неправильно. <span class="explain">'+task.explain+'</span>';}
}
function checkMulti(tid,idx){
  const t=tickets.find(x=>x.id===tid);const task=t.tasks[idx];
  const selected=Array.from(document.querySelectorAll(`input[name="multi-${tid}-${idx}"]:checked`)).map(c=>parseInt(c.value));
  const fb=document.getElementById(`fb-${tid}-${idx}`);
  const labels=document.querySelectorAll(`#task-${tid}-${idx} .options label`);
  labels.forEach((l,i)=>{l.classList.remove('correct','wrong');if(task.correct.includes(i))l.classList.add('correct');if(selected.includes(i)&&!task.correct.includes(i))l.classList.add('wrong');});
  const ok=selected.length===task.correct.length&&selected.every(v=>task.correct.includes(v));
  if(ok){fb.className='feedback show ok';fb.innerHTML='✅ Правильно! <span class="explain">'+task.explain+'</span>';}
  else{fb.className='feedback show bad';fb.innerHTML='❌ Неправильно. <span class="explain">'+task.explain+'</span>';}
}
function checkMatch(tid,idx){
  const t=tickets.find(x=>x.id===tid);const task=t.tasks[idx];
  const fb=document.getElementById(`fb-${tid}-${idx}`);
  let ok=true;
  task.left.forEach((_,i)=>{const sel=document.getElementById(`match-${tid}-${idx}-${i}`);if(parseInt(sel.value)!==task.correct[i])ok=false;});
  if(ok){fb.className='feedback show ok';fb.innerHTML='✅ Всё верно! <span class="explain">'+task.explain+'</span>';}
  else{fb.className='feedback show bad';fb.innerHTML='❌ Есть ошибки. <span class="explain">'+task.explain+'</span>';}
}
function toggleReveal(tid,idx){document.getElementById(`reveal-${tid}-${idx}`).classList.toggle('show');}
function markDone(id){progress[id]=true;localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));buildNav();updateNavActive();updateProgress();const next=nextTicketId(id);if(next)setTimeout(()=>showTicket(next),300);}
function updateProgress(){const done=Object.keys(progress).length;const total=tickets.length;progressTextEl.textContent=`${done} / ${total}`;progressFillEl.style.width=(done/total*100)+'%';}
function resetProgress(){if(confirm('Сбросить прогресс?')){progress={};localStorage.removeItem(STORAGE_KEY);buildNav();updateNavActive();updateProgress();}}
function toggleTheme(){const html=document.documentElement;const isDark=html.getAttribute('data-theme')==='dark';html.setAttribute('data-theme',isDark?'light':'dark');localStorage.setItem('gp_theme',isDark?'light':'dark');document.getElementById('themeBtn').textContent=isDark?'🌙 Тема':'☀️ Тема';}
document.getElementById('searchBox').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();navEl.querySelectorAll('a').forEach(a=>{const t=tickets.find(x=>x.id===a.dataset.id);const m=!q||t.title.toLowerCase().includes(q)||t.subtitle.toLowerCase().includes(q)||t.body.toLowerCase().includes(q);a.parentElement.style.display=m?'':'none';});navEl.querySelectorAll('.nav-section').forEach(sec=>{const v=Array.from(sec.querySelectorAll('li')).some(li=>li.style.display!=='none');sec.style.display=v?'':'none';});});
(function init(){const savedTheme=localStorage.getItem('gp_theme');if(savedTheme==='dark'){document.documentElement.setAttribute('data-theme','dark');document.getElementById('themeBtn').textContent='☀️ Тема';}buildNav();showTicket(currentTicket);updateProgress();})();
</script>
</body>
