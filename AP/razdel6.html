<style>

  .task .question{margin-bottom:12px}
  .options{list-style:none;margin:0 0 12px 0}

  .options label.correct{border-color:var(--success);background:rgba(30,125,78,.1)}
  .options label.wrong{border-color:var(--error);background:rgba(176,58,58,.1)}
  .feedback{margin-top:10px;font-size:14px;padding:10px 14px;border-radius:8px;display:none}

  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .match-item{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px}
  .match-item.left{background:var(--bg);font-weight:600}
  .match-item select{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:14px}
  textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;resize:vertical;margin-bottom:10px}
  textarea:focus{outline:2px solid var(--accent)}
  .reveal-btn{background:var(--bg);border:1px dashed var(--accent);color:var(--accent);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;margin-top:6px}
  .reveal-btn:hover{background:var(--accent);color:#fff}
  .reveal-content{display:none;margin-top:10px;padding:12px 16px;background:var(--bg);border-radius:8px;border-left:3px solid var(--accent);font-size:14px}

  .ticket-nav .btn{flex:1;text-align:center}
  .menu-toggle{display:none;position:fixed;bottom:20px;right:20px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:200}

</style>

<script>
const tickets = [
{
  id:"b1",
  section:"Раздел 6. Осуществление и защита гражданских прав",
  title:"Билет 1. Понятие и принципы осуществления субъективного гражданского права",
  subtitle:"Реализация прав и исполнение обязанностей.",
  body:`
    <h3>1. Понятие осуществления гражданских прав</h3>
    <p><strong>Осуществление гражданских прав</strong> — совершение тех действий, которые составляют содержание субъективных прав.</p>
    <p>Граждане и юридические лица <strong>по своему усмотрению</strong> осуществляют принадлежащие им гражданские права (п. 1 ст. 8 ГК). Лицо действует «своей властью и в своём интересе», никто не вправе понудить его осуществлять право.</p>

    <h3>2. Принципы осуществления прав</h3>
    <ul>
      <li><strong>Свобода усмотрения</strong> — лицо само решает, осуществлять право или нет.</li>
      <li><strong>Юридическое равенство</strong> — все субъекты равны в возможности осуществления прав.</li>
      <li><strong>Недопустимость ограничений</strong> — п. 2 ст. 8 ГК запрещает соглашения об ограничении осуществления гражданских прав. Исключение: отказ от права может повлечь его прекращение (например, отказ от права собственности — ст. 237 ГК).</li>
      <li><strong>Соответствие принципам права</strong> — осуществление прав не должно противоречить общественной пользе, безопасности, не наносить вред окружающей среде, историко-культурным ценностям, не ущемлять права других лиц, соответствовать моральным принципам.</li>
    </ul>

    <h3>3. Осуществление прав и исполнение обязанностей</h3>
    <p>Осуществление прав неразрывно связано с исполнением обязанностей. Реализуя право требования, можно добиться от других лиц исполнения обязанностей:</p>
    <ul>
      <li>в абсолютных отношениях — от любого из третьих лиц;</li>
      <li>в относительных — от конкретного лица.</li>
    </ul>
    <p><strong>Исполнение гражданских обязанностей</strong> — совершение тех действий, которые составляют содержание обязанности.</p>

    <h3>4. Способы осуществления гражданских прав</h3>
    <h4>4.1. Фактические способы:</h4>
    <p>Действия управомоченного лица, не обладающие признаками сделок (например, использование вещи, потребление плодов).</p>
    <h4>4.2. Юридические способы:</h4>
    <p>Действия, являющиеся сделками или иными юридическими действиями. Подразделяются на:</p>
    <ul>
      <li><strong>активные действия</strong>, осуществляемые самим управомоченным;</li>
      <li><strong>требования соответствующего поведения</strong> от обязанных лиц.</li>
    </ul>

    <h3>5. Исполнение обязанностей</h3>
    <p>В относительных правоотношениях исполнение обязанности происходит в <strong>активной форме</strong> (совершение действий), в абсолютных — в <strong>пассивной</strong> (воздержание от действий).</p>
    <p>Исполнение должно соответствовать требованиям законодательства и соглашению сторон.</p>

    <div class="card law">
      <div class="card-title">⚖️ Статья 8 ГК</div>
      Граждане и юридические лица по своему усмотрению осуществляют принадлежащие им гражданские права. Отказ от осуществления права не влечёт его прекращения, кроме случаев, предусмотренных законом.
    </div>
  `,
  tasks:[
    {type:"single",q:"Как осуществляются гражданские права?",options:["По указанию государства","По усмотрению самого лица","По решению суда","Только через представителя"],correct:1,explain:"П. 1 ст. 8 ГК: граждане и юридические лица по своему усмотрению осуществляют права."},
    {type:"multi",q:"Какие принципы осуществления гражданских прав?",options:["Свобода усмотрения","Юридическое равенство","Недопустимость ограничений","Обязательность осуществления"],correct:[0,1,2],explain:"Обязательности осуществления нет — это право, а не обязанность."},
    {type:"match",q:"Соотнесите способ осуществления с примером:",left:["Фактический","Юридический активный","Юридический — требование"],right:["Использование своей вещи","Заключение договора","Предъявление претензии"],correct:[0,1,2],explain:"Разные способы реализации права."},
    {type:"case",q:"Кейс. Гражданин унаследовал квартиру, но 5 лет не регистрировал право собственности и не пользовался ею. Утратил ли он право?",answer:"Нет, не утратил. Отказ от осуществления права не влечёт его прекращения (п. 2 ст. 8 ГК). Право собственности сохраняется. Однако для распоряжения квартирой необходимо зарегистрировать право. Также возможна ситуация с приобретательной давностью — если третье лицо открыто владело квартирой 15 лет, оно может претендовать на неё."}
  ]
},
{
  id:"b2",
  section:"Раздел 6. Осуществление и защита гражданских прав",
  title:"Билет 2. Пределы осуществления гражданских прав. Злоупотребление правом",
  subtitle:"Границы дозволенного поведения и последствия их нарушения.",
  body:`
    <h3>1. Понятие пределов осуществления прав</h3>
    <p><strong>Пределы осуществления субъективных гражданских прав</strong> — установленные законодательными актами границы поведения лица по реализации содержания этих прав.</p>
    <p>Пределы делятся на <strong>общие</strong> и <strong>специальные</strong>.</p>

    <h3>2. Общие пределы (ст. 9 ГК)</h3>
    <ul>
      <li>Не допускаются действия граждан и юридических лиц, осуществляемые <strong>исключительно с намерением причинить вред другому лицу</strong>, а также злоупотребление правом в иных формах.</li>
      <li>Не допускается использование гражданских прав в целях <strong>ограничения конкуренции</strong>, а также злоупотребление доминирующим положением на рынке.</li>
    </ul>
    <p>Общий предел — принцип приоритета общественных интересов (ст. 2 ГК).</p>

    <h3>3. Специальные пределы</h3>
    <p>Устанавливаются в актах гражданского законодательства, регулирующих осуществление конкретных гражданских прав:</p>
    <ul>
      <li>временные границы осуществления прав;</li>
      <li>определённый субъектный состав правоотношений;</li>
      <li>требования к форме и порядку реализации.</li>
    </ul>

    <h3>4. Злоупотребление правом</h3>
    <p><strong>Злоупотребление правом</strong> — особый тип гражданского правонарушения, совершаемого управомоченным лицом при осуществлении принадлежащего ему права, связанный с использованием недозволенных конкретных форм в рамках дозволенного законом общего типа поведения.</p>

    <h3>5. Формы злоупотребления правом</h3>
    <ul>
      <li><strong>Шикана</strong> — осуществление права с единственной целью причинить вред другому лицу (прямой умысел).</li>
      <li><strong>Злоупотребление правом в иных формах</strong> — объективно причиняющее вред третьим лицам (неосторожность).</li>
      <li><strong>Ограничение конкуренции</strong> — использование прав для ограничения конкуренции, злоупотребление доминирующим положением.</li>
    </ul>

    <h3>6. Правовые последствия злоупотребления правом</h3>
    <ul>
      <li><strong>Отказ суда в защите права</strong> лицу, злоупотребляющему своими гражданскими правами.</li>
      <li><strong>Обязанность восстановления положения</strong> лица, потерпевшего от злоупотребления.</li>
      <li><strong>Возмещение причинённого ущерба.</strong></li>
    </ul>

    <div class="card warn">
      <div class="card-title">⚠️ Пример</div>
      Собственник земельного участка строит глухой забор высотой 5 метров, чтобы лишить соседа солнечного света. Это злоупотребление правом (шикана), поскольку цель — причинить вред соседу, а не реализовать своё право.
    </div>

    <div class="card law">
      <div class="card-title">⚖️ Статья 9 ГК</div>
      Устанавливает общие пределы осуществления гражданских прав и запрет злоупотребления правом.
    </div>
  `,
  tasks:[
    {type:"single",q:"Что такое шикана?",options:["Злоупотребление правом в форме неосторожности","Осуществление права с единственной целью причинить вред другому","Ограничение конкуренции","Неосуществление права"],correct:1,explain:"Шикана — злоупотребление правом с прямым умыслом причинить вред."},
    {type:"multi",q:"Какие последствия злоупотребления правом?",options:["Отказ суда в защите права","Возмещение ущерба","Восстановление положения потерпевшего","Автоматическое прекращение права"],correct:[0,1,2],explain:"Право не прекращается автоматически — суд может отказать в защите."},
    {type:"match",q:"Соотнесите форму злоупотребления с примером:",left:["Шикана","Злоупотребление в иных формах","Ограничение конкуренции"],right:["Забор, чтобы лишить соседа света","Недобросовестное использование права","Демпинг для вытеснения конкурентов"],correct:[0,1,2],explain:"Разные формы злоупотребления."},
    {type:"case",q:"Кейс. Компания, занимающая доминирующее положение на рынке, установила цены ниже себестоимости, чтобы вытеснить конкурентов. Это правомерно?",answer:"Нет. Это злоупотребление правом в форме ограничения конкуренции (ст. 9 ГК). Компания использует своё положение для устранения конкурентов, что запрещено. Последствия: возможен отказ в защите права, штрафы со стороны антимонопольного органа, возмещение убытков конкурентам (Закон «О противодействии монополистической деятельности и развитии конкуренции»)."}
  ]
},

    <h4>3.1. Юрисдикционная форма:</h4>

      <li><strong>Специальный (административный) порядок</strong> — средство защиты: жалоба. Применяется в случаях, прямо предусмотренных законом (например, защита прав потребителей).</li>

    <p><strong>Самозащита гражданских прав</strong> — защита гражданских прав непосредственными действиями лица, права которого нарушены, без обращения к уполномоченным органам.</p>
    <p>Допускается, если такие действия:</p>
    <ul>
      <li>не сопряжены с нарушением законодательства;</li>

    <h3>2. Способы самозащиты</h3>
    <ul>
      <li><strong>Необходимая оборона</strong> — причинение вреда посягающему при защите своих прав, если не превышены пределы.</li>
      <li><strong>Крайняя необходимость</strong> — причинение вреда третьим лицам для устранения опасности, если опасность не могла быть устранена иными средствами.</li>

    <p>Применяются в обязательственных отношениях в одностороннем порядке. Характерны для предпринимательских договоров. Примеры:</p>
    <ul>
      <li>отказ от оплаты недоброкачественного товара;</li>

    <table>

const navEl=document.getElementById('nav');
const contentEl=document.getElementById('content');
const breadcrumbEl=document.getElementById('breadcrumb');
const progressTextEl=document.getElementById('progressText');
const progressFillEl=document.getElementById('progressFill');
let currentTicket=tickets[0].id;
const STORAGE_KEY='gp_progress_rz6_v1';
let progress=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');

function buildNav(){
  const sections={};
  tickets.forEach(t=>{if(!sections[t.section])sections[t.section]=[];sections[t.section].push(t);});
  let html='';
  Object.keys(sections).forEach(sec=>{
    html+=`<div class="nav-section"><div class="nav-section-title">${sec}</div><ul class="nav-list">`;
    sections[sec].forEach(t=>{
      const done=progress[t.id]?'<span class="check">✓</span>':'';
      html+=`<li><a href="#${t.id}" data-id="${t.id}">${done}<span>${t.title.replace(/^Билет \\d+\\.\\s*/,'')}</span></a></li>`;
    });
    html+='</ul></div>';
  });
  navEl.innerHTML=html;
  navEl.querySelectorAll('a').forEach(a=>{
    a.addEventListener('click',e=>{e.preventDefault();showTicket(a.dataset.id);document.getElementById('sidebar').classList.remove('open');});
  });
}
function showTicket(id){
  currentTicket=id;
  const t=tickets.find(x=>x.id===id);
  if(!t)return;
  breadcrumbEl.textContent=t.section+' · '+t.title.split('.')[0];
  contentEl.innerHTML=`
    <div class="ticket active">
      <h2>${t.title}</h2>
      <p class="subtitle">${t.subtitle}</p>
      ${t.body}
      <div class="tasks-header">📝 Задания для закрепления</div>
      <div id="tasks-${t.id}"></div>
      <div class="ticket-nav">
        ${prevTicketId(id)?`<button class="btn" onclick="showTicket('${prevTicketId(id)}')">← Предыдущий</button>`:'<span></span>'}
        <button class="btn btn-primary" onclick="markDone('${t.id}')">✓ Отметить как изученный</button>
        ${nextTicketId(id)?`<button class="btn" onclick="showTicket('${nextTicketId(id)}')">Следующий →</button>`:'<span></span>'}
      </div>
    </div>`;
  renderTasks(t);
  updateNavActive();
  window.scrollTo({top:0,behavior:'smooth'});
}
function prevTicketId(id){const i=tickets.findIndex(t=>t.id===id);return i>0?tickets[i-1].id:null;}
function nextTicketId(id){const i=tickets.findIndex(t=>t.id===id);return i<tickets.length-1?tickets[i+1].id:null;}
function updateNavActive(){navEl.querySelectorAll('a').forEach(a=>{a.classList.toggle('active',a.dataset.id===currentTicket);});}
function renderTasks(t){
  const container=document.getElementById('tasks-'+t.id);
  if(!container)return;
  let html='';
  t.tasks.forEach((task,idx)=>{
    html+=`<div class="task" id="task-${t.id}-${idx}"><div class="task-title">Задание ${idx+1}</div><div class="question">${task.q}</div>`;
    if(task.type==='single'){
      html+='<ul class="options">';
      task.options.forEach((opt,i)=>{html+=`<li><label><input type="radio" name="single-${t.id}-${idx}" value="${i}"> <span>${opt}</span></label></li>`;});
      html+='</ul>';
      html+=`<button class="btn btn-primary" onclick="checkSingle('${t.id}',${idx})">Проверить</button><div class="feedback" id="fb-${t.id}-${idx}"></div>`;
    }else if(task.type==='multi'){
      html+='<ul class="options">';
      task.options.forEach((opt,i)=>{html+=`<li><label><input type="checkbox" name="multi-${t.id}-${idx}" value="${i}"> <span>${opt}</span></label></li>`;});
      html+='</ul>';
      html+=`<button class="btn btn-primary" onclick="checkMulti('${t.id}',${idx})">Проверить</button><div class="feedback" id="fb-${t.id}-${idx}"></div>`;
    }else if(task.type==='match'){
      html+='<div class="match-grid">';
      task.left.forEach((left,i)=>{
        html+=`<div class="match-item left">${left}</div><div class="match-item"><select id="match-${t.id}-${idx}-${i}"><option value="">— выберите —</option>`;
        task.right.forEach((r,j)=>{html+=`<option value="${j}">${r}</option>`;});
        html+='</select></div>';
      });
      html+='</div>';
      html+=`<button class="btn btn-primary" onclick="checkMatch('${t.id}',${idx})">Проверить</button><div class="feedback" id="fb-${t.id}-${idx}"></div>`;
    }else if(task.type==='case'){
      html+=`<textarea placeholder="Напишите ответ..." id="case-${t.id}-${idx}"></textarea>`;
      html+=`<button class="reveal-btn" onclick="toggleReveal('${t.id}',${idx})">👁 Показать образец</button><div class="reveal-content" id="reveal-${t.id}-${idx}"><strong>Образец:</strong><br>${task.answer}</div>`;
    }
    html+='</div>';
  });
  container.innerHTML=html;
}
function checkSingle(tid,idx){
  const t=tickets.find(x=>x.id===tid);const task=t.tasks[idx];
  const selected=document.querySelector(`input[name="single-${tid}-${idx}"]:checked`);
  const fb=document.getElementById(`fb-${tid}-${idx}`);
  const labels=document.querySelectorAll(`#task-${tid}-${idx} .options label`);
  labels.forEach((l,i)=>{l.classList.remove('correct','wrong');if(i===task.correct)l.classList.add('correct');});
  if(!selected){fb.className='feedback show bad';fb.innerHTML='Выберите вариант.';return;}
  const val=parseInt(selected.value);
  if(val===task.correct){fb.className='feedback show ok';fb.innerHTML='✅ Правильно! <span class="explain">'+task.explain+'</span>';}
  else{selected.parentElement.classList.add('wrong');fb.className='feedback show bad';fb.innerHTML='❌ Неправильно. <span class="explain">'+task.explain+'</span>';}
}
function checkMulti(tid,idx){
  const t=tickets.find(x=>x.id===tid);const task=t.tasks[idx];
  const selected=Array.from(document.querySelectorAll(`input[name="multi-${tid}-${idx}"]:checked`)).map(c=>parseInt(c.value));
  const fb=document.getElementById(`fb-${tid}-${idx}`);
  const labels=document.querySelectorAll(`#task-${tid}-${idx} .options label`);
  labels.forEach((l,i)=>{l.classList.remove('correct','wrong');if(task.correct.includes(i))l.classList.add('correct');if(selected.includes(i)&&!task.correct.includes(i))l.classList.add('wrong');});
  const ok=selected.length===task.correct.length&&selected.every(v=>task.correct.includes(v));
  if(ok){fb.className='feedback show ok';fb.innerHTML='✅ Правильно! <span class="explain">'+task.explain+'</span>';}
  else{fb.className='feedback show bad';fb.innerHTML='❌ Неправильно. <span class="explain">'+task.explain+'</span>';}
}
function checkMatch(tid,idx){
  const t=tickets.find(x=>x.id===tid);const task=t.tasks[idx];
  const fb=document.getElementById(`fb-${tid}-${idx}`);
  let ok=true;
  task.left.forEach((_,i)=>{const sel=document.getElementById(`match-${tid}-${idx}-${i}`);if(parseInt(sel.value)!==task.correct[i])ok=false;});
  if(ok){fb.className='feedback show ok';fb.innerHTML='✅ Всё верно! <span class="explain">'+task.explain+'</span>';}
  else{fb.className='feedback show bad';fb.innerHTML='❌ Есть ошибки. <span class="explain">'+task.explain+'</span>';}
}
function toggleReveal(tid,idx){document.getElementById(`reveal-${tid}-${idx}`).classList.toggle('show');}
function markDone(id){progress[id]=true;localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));buildNav();updateNavActive();updateProgress();const next=nextTicketId(id);if(next)setTimeout(()=>showTicket(next),300);}
function updateProgress(){const done=Object.keys(progress).length;const total=tickets.length;progressTextEl.textContent=`${done} / ${total}`;progressFillEl.style.width=(done/total*100)+'%';}
function resetProgress(){if(confirm('Сбросить прогресс?')){progress={};localStorage.removeItem(STORAGE_KEY);buildNav();updateNavActive();updateProgress();}}
function toggleTheme(){const html=document.documentElement;const isDark=html.getAttribute('data-theme')==='dark';html.setAttribute('data-theme',isDark?'light':'dark');localStorage.setItem('gp_theme',isDark?'light':'dark');document.getElementById('themeBtn').textContent=isDark?'🌙 Тема':'☀️ Тема';}
document.getElementById('searchBox').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();navEl.querySelectorAll('a').forEach(a=>{const t=tickets.find(x=>x.id===a.dataset.id);const m=!q||t.title.toLowerCase().includes(q)||t.subtitle.toLowerCase().includes(q)||t.body.toLowerCase().includes(q);a.parentElement.style.display=m?'':'none';});navEl.querySelectorAll('.nav-section').forEach(sec=>{const v=Array.from(sec.querySelectorAll('li')).some(li=>li.style.display!=='none');sec.style.display=v?'':'none';});});
(function init(){const savedTheme=localStorage.getItem('gp_theme');if(savedTheme==='dark'){document.documentElement.setAttribute('data-theme','dark');document.getElementById('themeBtn').textContent='☀️ Тема';}buildNav();showTicket(currentTicket);updateProgress();})();
</script>
</body>
