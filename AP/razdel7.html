<head>
<meta charset="UTF-8">

<title>Раздел 7. Вещное право</title>
<style>
  :root{--bg:#f5f7fa;--card:#fff;--text:#1a2332;--muted:#5a6a80;--accent:#1e5a96;--accent-hover:#164a7d;--border:#d8e0ea;--success:#1e7d4e;--error:#b03a3a;--warning:#a8761f;--shadow:0 2px 8px rgba(0,0,0,.06)}
  [data-theme="dark"]{--bg:#141a24;--card:#1d2532;--text:#e6ecf3;--muted:#93a3b8;--accent:#4a8fd1;--accent-hover:#6aa7e0;--border:#2c3a4d;--success:#4caf7d;--error:#e07a7a;--warning:#d4a548;--shadow:0 2px 8px rgba(0,0,0,.3)}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;transition:background .3s,color .3s}
  .layout{display:flex;min-height:100vh}
  .sidebar{width:320px;background:var(--card);border-right:1px solid var(--border);padding:20px 16px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;transition:transform .3s;z-index:100}
  .sidebar-header{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
  .sidebar-header h1{font-size:17px;color:var(--accent);margin-bottom:6px}
  .sidebar-header p{font-size:12px;color:var(--muted)}
  .search-box{width:100%;padding:8px 12px;margin-bottom:14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px}
  .search-box:focus{outline:2px solid var(--accent)}
  .progress-wrap{margin-bottom:14px}
  .progress-label{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
  .progress-bar-bg{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
  .progress-bar-fill{height:100%;background:var(--accent);width:0%;transition:width .4s}
  .nav-section{margin-bottom:6px}
  .nav-section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:10px 8px 6px}
  .nav-list{list-style:none}
  .nav-list li a{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:13.5px;color:var(--text);text-decoration:none;border-radius:6px;margin-bottom:2px;transition:background .15s}
  .nav-list li a:hover{background:var(--bg);color:var(--accent)}
  .nav-list li a.active{background:var(--accent);color:#fff}
  .nav-list li a .check{color:var(--success);font-weight:bold}
  .nav-list li a.active .check{color:#c8f5d8}
  .main{flex:1;margin-left:320px;padding:32px 40px 80px;max-width:900px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px;flex-wrap:wrap}
  .topbar .breadcrumb{font-size:13px;color:var(--muted)}
  .btn{padding:8px 14px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;cursor:pointer;font-size:13.5px;transition:all .2s;text-decoration:none;display:inline-block}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-primary:hover{background:var(--accent-hover);color:#fff}
  .ticket{display:none;animation:fade .3s}
  .ticket.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .ticket h2{font-size:24px;color:var(--accent);margin-bottom:6px;line-height:1.3}
  .ticket .subtitle{font-size:14px;color:var(--muted);margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid var(--border)}
  .ticket h3{font-size:18px;margin:26px 0 12px;color:var(--text);border-left:4px solid var(--accent);padding-left:10px}
  .ticket h4{font-size:15.5px;margin:18px 0 8px;color:var(--accent)}
  .ticket p{margin-bottom:12px}
  .ticket ul,.ticket ol{margin:0 0 14px 24px}
  .ticket li{margin-bottom:6px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin:16px 0;box-shadow:var(--shadow)}
  .card.note{border-left:4px solid var(--accent)}
  .card.warn{border-left:4px solid var(--warning);background:rgba(168,118,31,.06)}
  .card.law{border-left:4px solid var(--success);background:rgba(30,125,78,.05)}
  .card-title{font-weight:700;margin-bottom:8px;font-size:14.5px}
  .card.note .card-title{color:var(--accent)}
  .card.warn .card-title{color:var(--warning)}
  .card.law .card-title{color:var(--success)}
  table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}
  th,td{border:1px solid var(--border);padding:9px 12px;text-align:left;vertical-align:top}
  th{background:var(--bg);font-weight:700}
  .tasks-header{margin:34px 0 16px;padding:12px 18px;background:linear-gradient(90deg,var(--accent),var(--accent-hover));color:#fff;border-radius:10px;font-size:17px;font-weight:700}
  .task{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .task-title{font-weight:700;margin-bottom:10px;color:var(--accent);font-size:15px}
  .task .question{margin-bottom:12px}
  .options{list-style:none;margin:0 0 12px 0}
  .options li{margin-bottom:6px}
  .options label{display:flex;gap:9px;align-items:flex-start;padding:8px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;font-size:14px}
  .options label:hover{border-color:var(--accent);background:var(--bg)}
  .options input{margin-top:4px;accent-color:var(--accent)}
  .options label.correct{border-color:var(--success);background:rgba(30,125,78,.1)}
  .options label.wrong{border-color:var(--error);background:rgba(176,58,58,.1)}
  .feedback{margin-top:10px;font-size:14px;padding:10px 14px;border-radius:8px;display:none}
  .feedback.show{display:block}
  .feedback.ok{background:rgba(30,125,78,.12);color:var(--success);border-left:3px solid var(--success)}
  .feedback.bad{background:rgba(176,58,58,.1);color:var(--error);border-left:3px solid var(--error)}
  .feedback .explain{display:block;margin-top:6px;color:var(--text);font-size:13.5px}
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .match-item{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px}
  .match-item.left{background:var(--bg);font-weight:600}
  .match-item select{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:14px}
  textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;resize:vertical;margin-bottom:10px}
  textarea:focus{outline:2px solid var(--accent)}
  .reveal-btn{background:var(--bg);border:1px dashed var(--accent);color:var(--accent);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;margin-top:6px}
  .reveal-btn:hover{background:var(--accent);color:#fff}
  .reveal-content{display:none;margin-top:10px;padding:12px 16px;background:var(--bg);border-radius:8px;border-left:3px solid var(--accent);font-size:14px}
  .reveal-content.show{display:block}
  .ticket-nav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--border)}
  .ticket-nav .btn{flex:1;text-align:center}
  .menu-toggle{display:none;position:fixed;bottom:20px;right:20px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:200}
  @media (max-width:900px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}.main{margin-left:0;padding:20px 16px 90px}.menu-toggle{display:block}.match-grid{grid-template-columns:1fr}}
  .footer{margin-top:50px;padding-top:20px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);text-align:center}
</style>
</head>

<div class="layout">

      <h1>📘 Раздел 7</h1>

    </div>
    <input type="text" class="search-box" id="searchBox" placeholder="🔍 Поиск...">
    <div class="progress-wrap">
      <div class="progress-label"><span>Прогресс</span><span id="progressText">0 / 15</span></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>

    <div class="topbar">

  </main>
  <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
</div>

<script>
const tickets = [
{
  id:"b1",
  section:"Раздел 7. Вещное право",
  title:"Билет 1. Понятие и признаки вещного права. Виды",
  subtitle:"Вещные права и их место в системе гражданских прав.",
  body:`
    <h3>1. Понятие вещного права</h3>
    <p><strong>Вещное право в объективном смысле</strong> — совокупность правовых норм, закрепляющих принадлежность вещей (имущества) субъектам вещных прав, регламентирующих правомочия этих субъектов по поводу этих вещей и устанавливающих ответственность за их нарушения.</p>
    <p><strong>Вещное право в субъективном смысле</strong> — право конкретного субъекта по владению, пользованию и распоряжению данным имуществом.</p>

    <h3>2. Признаки вещных прав</h3>
    <ul>
      <li><strong>Абсолютный характер защиты</strong> — вещные права относятся к числу абсолютных прав. Их носителю соответствует обязанность неопределённого круга лиц воздерживаться от нарушения этих прав.</li>
      <li><strong>Право следования</strong> — в случае перехода вещного права к другому лицу (правопреемнику) переходят и обременения этого права.</li>
    </ul>

    <h3>3. Виды вещных прав</h3>
    <p>Вещные права делятся на две группы:</p>
    <ol>
      <li><strong>Право собственности</strong> — в объективном смысле совокупность норм, регулирующих и охраняющих принадлежность материальных благ конкретным лицам; в субъективном — мера возможного поведения собственника.</li>
      <li><strong>Ограниченные вещные права (права на чужие вещи)</strong> — права несобственника в том или ином ограниченном законом отношении использовать чужое, обычно недвижимое имущество в собственных интересах без участия собственника (а иногда даже помимо его воли).</li>
    </ol>

    <h3>4. Примерный перечень ограниченных вещных прав (ст. 217 ГК)</h3>
    <ul>
      <li>право хозяйственного ведения и оперативного управления;</li>
      <li>право пожизненного наследуемого владения земельным участком;</li>
      <li>право постоянного пользования земельным участком;</li>
      <li>сервитуты и др.</li>
    </ul>

    <h3>5. Отличие вещных прав от обязательственных</h3>
    <table>
      <tr><th>Критерий</th><th>Вещные права</th><th>Обязательственные права</th></tr>
      <tr><td>Круг обязанных лиц</td><td>Неопределённый (абсолютные)</td><td>Строго определённый (относительные)</td></tr>
      <tr><td>Объект</td><td>Вещь</td><td>Действие обязанного лица</td></tr>
      <tr><td>Защита</td><td>Вещно-правовые иски (виндикация, негаторный)</td><td>Обязательственно-правовые иски (убытки, неустойка)</td></tr>
      <tr><td>Право следования</td><td>Есть</td><td>Нет</td></tr>
    </table>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 217 ГК</div>
      Примерный перечень вещных прав. Перечень не является исчерпывающим, но вещные права могут устанавливаться только законом.
    </div>

    <div class="card note">
      <div class="card-title">💡 Важно</div>
      Вещное право — это право на вещь, а не на действие. Оно даёт непосредственную власть над вещью.
    </div>
  `,
  tasks:[
    {type:"single",q:"Что такое вещное право в субъективном смысле?",options:["Совокупность правовых норм","Право конкретного субъекта по владению, пользованию и распоряжению имуществом","Право требования к должнику","Обязанность неопределённого круга лиц"],correct:1,explain:"В субъективном смысле — право конкретного субъекта на вещь."},
    {type:"multi",q:"Какие признаки вещных прав?",options:["Абсолютный характер защиты","Право следования","Относительный характер","Строгая определённость обязанных лиц"],correct:[0,1],explain:"Вещные права — абсолютные, с правом следования."},
    {type:"match",q:"Соотнесите вид права с примером:",left:["Право собственности","Ограниченное вещное право","Обязательственное право"],right:["Владение своей квартирой","Сервитут на проход","Право требовать возврата займа"],correct:[0,1,2],explain:"Разные категории прав."},
    {type:"case",q:"Кейс. Гражданин купил земельный участок, обременённый сервитутом (сосед имеет право прохода). Сохраняется ли сервитут после покупки?",answer:"Да, сервитут сохраняется. Это проявление права следования: при переходе вещного права к другому лицу переходят и обременения. Новый собственник обязан соблюдать сервитут. Он может требовать прекращения сервитута только при отпадении оснований (ст. 270 ГК)."}
  ]
},
{
  id:"b2",
  section:"Раздел 7. Вещное право",
  title:"Билет 2. Понятие и содержание права собственности",
  subtitle:"Правомочия собственника и его бремя.",
  body:`
    <h3>1. Понятие права собственности</h3>
    <p><strong>Право собственности в объективном смысле</strong> — совокупность правовых норм, регулирующих и охраняющих состояние принадлежности материальных благ конкретным лицам (институт права собственности).</p>
    <p><strong>Право собственности в субъективном смысле</strong> — мера возможного поведения собственника. Собственник вправе по своему усмотрению владеть, пользоваться и распоряжаться своим имуществом.</p>

    <h3>2. Содержание права собственности</h3>
    <p>Право собственности состоит из трёх правомочий:</p>
    <ul>
      <li><strong>Владение</strong> — основанная на законе возможность иметь у себя данное имущество, содержать его в своём хозяйстве (фактически обладать им, числить на балансе). Владение может быть <em>законным</em> (опирается на правовое основание) и <em>незаконным</em> (беститульным).</li>
      <li><strong>Пользование</strong> — основанная на законе возможность эксплуатации, хозяйственного или иного использования имущества путём извлечения из него полезных свойств, его потребления.</li>
      <li><strong>Распоряжение</strong> — возможность определения юридической судьбы имущества путём изменения его принадлежности, состояния или назначения (отчуждение по договору, передача по наследству, уничтожение).</li>
    </ul>

    <h3>3. Осуществление правомочий</h3>
    <p>Собственник осуществляет свои правомочия <strong>по своему усмотрению</strong> в рамках закона, не нарушая прав и законных интересов других лиц.</p>

    <h3>4. Бремя содержания и риск случайной гибели (ст. 212 ГК)</h3>
    <p>Собственник несёт:</p>
    <ul>
      <li><strong>бремя содержания имущества</strong> (расходы на ремонт, налоги, охрану);</li>
      <li><strong>риск случайной гибели (порчи, отчуждения) вещи</strong> — возможность наступления неблагоприятных последствий в виде убытков по обстоятельствам, в которых ни одна из сторон не виновна.</li>
    </ul>

    <h3>5. Определение через законодательство</h3>
    <p>Согласно ст. 210 ГК, собственнику принадлежат права владения, пользования и распоряжения своим имуществом. Собственник вправе совершать в отношении своего имущества любые действия, не противоречащие закону и не нарушающие права других лиц.</p>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 210, 212 ГК</div>
      Ст. 210 — содержание права собственности; ст. 212 — бремя содержания и риск случайной гибели.
    </div>

    <div class="card note">
      <div class="card-title">💡 Триада правомочий</div>
      Владение + Пользование + Распоряжение = классическая триада. Она пришла из римского права и закреплена во всех современных ГК.
    </div>
  `,
  tasks:[
    {type:"single",q:"Какое правомочие означает определение юридической судьбы вещи?",options:["Владение","Пользование","Распоряжение","Хранение"],correct:2,explain:"Распоряжение — определение юридической судьбы (продажа, дарение, уничтожение)."},
    {type:"multi",q:"Что входит в содержание права собственности?",options:["Владение","Пользование","Распоряжение","Наблюдение"],correct:[0,1,2],explain:"Триада правомочий собственника."},
    {type:"match",q:"Соотнесите правомочие с примером:",left:["Владение","Пользование","Распоряжение"],right:["Хранение вещи у себя","Эксплуатация автомобиля","Продажа квартиры"],correct:[0,1,2],explain:"Разные аспекты права собственности."},
    {type:"case",q:"Кейс. Собственник сдал квартиру в аренду. Кто владеет, пользуется и распоряжается квартирой?",answer:"Собственник сохраняет правомочие распоряжения (может продать, подарить). Владение и пользование переходят к арендатору на срок договора (ст. 577 ГК). Собственник получает арендную плату. После окончания договора все правомочия возвращаются собственнику в полном объёме."}
  ]
},
{
  id:"b3",
  section:"Раздел 7. Вещное право",
  title:"Билет 3. Формы и субъекты права собственности",
  subtitle:"Государственная и частная собственность.",
  body:`
    <h3>1. Формы собственности (ст. 213 ГК)</h3>
    <p>В соответствии с Конституцией и ст. 213 ГК собственность может быть:</p>
    <ul>
      <li><strong>государственной</strong>;</li>
      <li><strong>частной</strong>.</li>
    </ul>
    <p>Государство гарантирует равную защиту и равные условия для развития всех форм собственности.</p>

    <h3>2. Субъекты государственной собственности</h3>
    <ul>
      <li><strong>Республика Беларусь</strong> — субъект республиканской собственности;</li>
      <li><strong>административно-территориальные единицы</strong> — субъекты коммунальной собственности.</li>
    </ul>

    <h3>3. Субъекты частной собственности</h3>
    <ul>
      <li>физические лица;</li>
      <li>юридические лица (хозяйственные товарищества, общества, производственные кооперативы, потребительские кооперативы, общественные и религиозные организации и др.).</li>
    </ul>

    <h3>4. Объекты права собственности</h3>
    <p>Закон не содержит ограничений относительно объектов, которые могут находиться в собственности Республики Беларусь и административно-территориальных единиц.</p>
    <p>В собственности граждан и юридических лиц может находиться любое имущество, за исключением отдельных видов, которые в соответствии с Законом от 05.05.1998 «Об объектах, находящихся только в собственности государства» не могут находиться в собственности граждан или негосударственных юридических лиц.</p>

    <h3>5. Содержание права государственной собственности</h3>
    <ul>
      <li><strong>Республиканская собственность</strong> — используется в интересах всего населения Беларуси. Состоит из казны РБ и имущества, закреплённого за республиканскими юридическими лицами. Средства республиканского бюджета, золотовалютные резервы, другие объекты, находящиеся только в собственности государства, и иное имущество, не закреплённое за юридическими лицами, составляют <strong>казну Республики Беларусь</strong>.</li>
      <li><strong>Коммунальная собственность</strong> — используется в интересах населения соответствующей административно-территориальной единицы. Состоит из казны АТЕ и имущества, закреплённого за коммунальными юридическими лицами. Средства местного бюджета и иное коммунальное имущество, не закреплённое за юридическими лицами, составляют <strong>казну АТЕ</strong>.</li>
    </ul>

    <h3>6. Функции собственника</h3>
    <ul>
      <li>Функции собственника — Республики Беларусь — выполняет <strong>Совет Министров</strong>.</li>
      <li>Функции собственника — административно-территориальной единицы — выполняет <strong>местная администрация</strong>.</li>
    </ul>

    </div>

  body:`
    <h3>1. Понятие первоначальных способов</h3>
    <p><strong>Первоначальные способы</strong> — те, при которых право собственности на вещь возникает впервые либо независимо от воли прежнего собственника.</p>

    <ul>
      <li><strong>Изготовление или создание лицом вещи для себя</strong> (ст. 219 ГК). Право собственности возникает у лица, изготовившего вещь, при условии соблюдения закона.</li>
      <li><strong>Создание недвижимого имущества</strong> (ст. 220 ГК) — с соблюдением градостроительных норм, на отведённом участке.</li>
      <li><strong>Переработка</strong> (ст. 221 ГК) — создание новой движимой вещи путём переработки материалов, не принадлежащих переработчику. По общему правилу право собственности на новую вещь возникает у собственника материала, если стоимость переработки не превышает стоимость материала.</li>
      <li><strong>Обращение в собственность движимых вещей, от которых собственник отказался</strong> (ст. 226 ГК).</li>
      <li><strong>Обращение в собственность общедоступных для сбора вещей</strong> (сбор ягод, грибов, лов рыбы) (ст. 222 ГК).</li>
      <li><strong>Находка</strong> (ст. 228 ГК) — найденная вещь поступает в собственность нашедшего при соблюдении процедуры (заявление в милицию, хранение).</li>
      <li><strong>Приобретение права собственности на бесхозяйное имущество</strong> (ст. 225 ГК).</li>
      <li><strong>Приобретение права собственности на безнадзорных животных и пригульный скот</strong> (ст. 231–232 ГК).</li>
      <li><strong>Клад</strong> (ст. 234 ГК) — зарытые в земле или сокрытые иным способом деньги или ценные предметы, собственник которых не может быть установлен. Клад поступает в собственность собственника земельного участка или лица, обнаружившего клад, в равных долях, если соглашением не установлено иное. Клад, содержащий вещи, относящиеся к памятникам истории или культуры, поступает в собственность государства с вознаграждением.</li>
      <li><strong>Приобретение права собственности по давности владения</strong> (приобретательная давность) (ст. 235 ГК) — гражданин или юридическое лицо, не являющееся собственником, добросовестно, открыто и непрерывно владеющее имуществом как своим собственным в течение 15 лет (недвижимость) или 5 лет (движимое имущество), приобретает право собственности.</li>

    {type:"case",q:"Кейс. Гражданин нашёл на улице дорогой телефон. Через год никто не обратился. Может ли он стать собственником?",answer:"Да, но с соблюдением процедуры. Согласно ст. 228 ГК, нашедший обязан заявить о находке в милицию или орган местного управления. Если в течение 6 месяцев собственник не будет установлен, нашедший приобретает право собственности на находку. Если он не заявил о находке — права собственности не возникает, и он может быть привлечён к ответственности за присвоение находки."}

  title:"Билет 5. Производные способы приобретения права собственности",
  subtitle:"Возникновение права по воле предшественника.",
  body:`
    <h3>1. Понятие производных способов</h3>
    <p><strong>Производные способы</strong> характеризуются наличием волеизъявления отчуждателя и приобретателя — соглашения между ними. Право собственности у приобретателя основывается на праве предшественника.</p>

    <h3>2. Перечень производных способов</h3>
    <ul>
      <li><strong>Приобретение по договору</strong> (купля-продажа, мена, дарение, аренда с выкупом и др.).</li>
      <li><strong>Приобретение по наследству</strong> — по закону или по завещанию.</li>
      <li><strong>Приобретение имущества в процессе реорганизации юридического лица</strong> — правопреемство.</li>
      <li><strong>Приобретение собственности в процессе приватизации</strong> — переход государственного имущества в частную собственность.</li>
    </ul>

    <h3>3. Момент возникновения права собственности у приобретателя по договору (ст. 224 ГК)</h3>
    <p>Право собственности переходит к приобретателю <strong>в момент передачи вещи</strong>, если иное не предусмотрено законодательством или договором.</p>
    <p><strong>Передача</strong> — вручение вещи приобретателю, а равно сдача перевозчику для отправки приобретателю или сдача в организацию связи для пересылки приобретателю вещей, отчуждённых без обязательства доставки. К передаче приравнивается передача коносамента или иного товарораспорядительного документа.</p>

    <h3>4. Переход риска случайной гибели (ст. 213 ГК)</h3>
    <p>Риск случайной гибели или случайного повреждения имущества переходит на приобретателя одновременно с возникновением у него права собственности, если иное не предусмотрено договором.</p>
    <p><em>Исключение:</em> если продавец просрочил передачу — риск на нём.</p>

    <h3>5. Особенности для недвижимости</h3>
    <p>Право собственности на недвижимость возникает <strong>с момента государственной регистрации</strong>, если иное не установлено законом.</p>

    <h3>6. Различие первоначальных и производных способов</h3>
    <table>
      <tr><th>Критерий</th><th>Первоначальные</th><th>Производные</th></tr>
      <tr><td>Воля предшественника</td><td>Отсутствует или не учитывается</td><td>Учитывается (соглашение)</td></tr>
      <tr><td>Право собственности</td><td>Возникает впервые</td><td>Основано на праве предшественника</td></tr>
      <tr><td>Объём прав</td><td>Полный</td><td>Такой же, как у предшественника</td></tr>
    </table>

    <div class="card note">
      <div class="card-title">💡 Пример</div>
      Купили вы телефон в магазине — производный способ (договор купли-продажи). Нашли телефон на улице и через 6 месяцев стали собственником — первоначальный способ (находка).
    </div>

    {type:"case",q:"Кейс. Гражданин купил автомобиль, но не успел зарегистрировать в ГАИ. Автомобиль угнали. Кто несёт риск?",answer:"Риск случайной гибели перешёл к покупателю с момента передачи автомобиля (ст. 213, 224 ГК), если иное не предусмотрено договором. Регистрация в ГАИ носит учётный характер и не влияет на момент перехода права собственности. Следовательно, покупатель несёт риск. Если продавец просрочил передачу — риск остаётся на продавце."}

  id:"b6",
  section:"Раздел 7. Вещное право",
  title:"Билет 6. Прекращение права собственности",
  subtitle:"Основания прекращения по воле и помимо воли собственника.",
  body:`
    <h3>1. Принцип неприкосновенности собственности (ст. 2 ГК)</h3>
    <p>Прекращение права собственности происходит лишь в случаях, прямо предусмотренных законом.</p>

    <h3>2. Прекращение по воле собственника</h3>
    <ul>
      <li><strong>Отчуждение собственником своего имущества другим лицам</strong> — купля-продажа, мена, дарение, аренда с выкупом и т.д.</li>
      <li><strong>Добровольный отказ от права собственности</strong> — путём публичного объявления либо совершения реальных действий, бесспорно свидетельствующих о намерении (выброс имущества).</li>
      <li><strong>Утрата собственности на имущество</strong> — потребление вещей, гибель.</li>
    </ul>

    <h3>3. Прекращение помимо воли собственника</h3>
    <p>Принудительное изъятие допускается по общему правилу с компенсацией стоимости изымаемой вещи. Основания:</p>
    <ul>
      <li><strong>Обращение взыскания на имущество по обязательствам</strong> (по постановлению суда, безвозмездное изъятие).</li>
      <li><strong>Отчуждение имущества, которое не может принадлежать данному лицу</strong> в силу запрета в акте законодательства (вещи, изъятые из оборота или ограниченные в обороте).</li>
      <li><strong>Отчуждение недвижимости в связи с изъятием земельного участка</strong>.</li>
      <li><strong>Выкуп бесхозяйственно содержимых культурных ценностей</strong>.</li>
      <li><strong>Выкуп домашних животных при ненадлежащем обращении</strong> (ст. 240 ГК).</li>
      <li><strong>Реквизиция</strong> (ст. 243 ГК) — изъятие имущества в интересах общества при стихийных бедствиях, авариях, эпидемиях с выплатой стоимости.</li>
      <li><strong>Конфискация</strong> (ст. 244 ГК) — безвозмездное изъятие по решению суда в виде санкции за правонарушение.</li>
      <li><strong>Национализация</strong> (ст. 245 ГК) — обращение имущества в собственность государства с возмещением стоимости.</li>
    </ul>

    <h3>4. Приватизация</h3>
    <p>Особый случай прекращения права государственной собственности — приватизация имущества, принадлежащего Республике Беларусь или АТЕ (ст. 218 ГК). Распространяется только на государственное имущество и не может рассматриваться как общее основание прекращения права собственности.</p>

    <h3>5. Гарантии собственника</h3>
    <p>Принудительное изъятие допускается только в случаях, установленных законом, с соблюдением процедуры и, как правило, с компенсацией. Собственник вправе оспорить изъятие в суде.</p>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 236–245 ГК</div>
      Регулируют прекращение права собственности.

    <div class="card warn">

{
  id:"b7",
  section:"Раздел 7. Вещное право",
  title:"Билет 7. Понятие и виды общей собственности",
  subtitle:"Имущество, принадлежащее нескольким лицам.",
  body:`
    <h3>1. Понятие общей собственности</h3>
    <p><strong>Общая собственность</strong> — вид собственности, при котором имущество принадлежит нескольким субъектам одновременно.</p>
    <p><strong>Право общей собственности в объективном смысле</strong> — совокупность правовых норм, регулирующих принадлежность имущества двум или более лицам и их права и обязанности по владению, пользованию и распоряжению этим имуществом.</p>
    <p><strong>В субъективном смысле</strong> — право двух или более лиц сообща владеть, пользоваться и распоряжаться общим имуществом.</p>

    <h3>2. Основания возникновения</h3>
    <p>Основания аналогичны основаниям возникновения права собственности:</p>

      <li><strong>Производные</strong> — наследование имущества несколькими наследниками; приобретение имущества супругами в браке.</li>

    <p>Возникновение отдельных видов общей собственности предусмотрено законом (собственность супругов).</p>

    <h3>3. Участники</h3>
    <p>Участниками права общей собственности могут быть любые субъекты гражданского права: граждане, юридические лица, государство, АТЕ. В любом сочетании.</p>

    <h3>4. Виды общей собственности</h3>

      <li><strong>Общая долевая собственность</strong> — предполагает определение доли каждого сособственника в праве общей собственности.</li>
      <li><strong>Общая совместная собственность</strong> — возникает только на основании закона, характеризуется отсутствием чёткого определения доли каждого сособственника.</li>
    </ol>

    <h3>5. Общая долевая собственность</h3>
    <p>Если иное не предусмотрено в законе или договоре, доли всех сособственников признаются <strong>равными</strong>.</p>
    <p>Размер доли может быть увеличен или уменьшен вследствие:</p>

    <p><strong>Право постоянного пользования</strong> — право владения и пользования земельным участком в соответствии с целями, для которых он был предоставлен.</p>
    <p>Особенности:</p>

    <h3>3. Сервитут (ст. 268 ГК)</h3>
    <p><strong>Сервитут</strong> — предоставление одному лицу права пользования находящимся в собственности другого лица имуществом в ограниченном объёме. Собственник недвижимого имущества вправе требовать от собственника соседнего земельного участка (а в необходимых случаях — и от собственника другого земельного участка) предоставления права ограниченного пользования соседним участком.</p>
    <p>Сервитут устанавливается только в отношении недвижимого имущества.</p>

    <h3>4. Основания установления сервитута</h3>
    <ul>
      <li>обеспечение прохода и проезда через соседний земельный участок;</li>

      <li>обеспечение водоснабжения и мелиорации;</li>
      <li>другие нужды собственника недвижимого имущества, которые не могут быть обеспечены без установления сервитута (ч. 2 п. 1 ст. 268 ГК).</li>

    <h3>5. Правовой режим сервитута</h3>

  title:"Билет 13. Виндикационный иск",
  subtitle:"Истребование имущества из чужого незаконного владения.",
  body:`
    <h3>1. Понятие виндикационного иска (ст. 282 ГК)</h3>
    <p><strong>Виндикационный иск</strong> — требование собственника о принудительном истребовании имущества из чужого незаконного владения.</p>
    <p>Право на иск предоставляется собственнику для возвращения вещи, владение которой им утрачено.</p>

    <h3>2. Субъекты</h3>
    <ul>
      <li><strong>Истец</strong> — собственник, а также лицо, владеющее имуществом на праве пожизненного наследуемого владения, хозяйственного ведения, оперативного управления или ином законном основании.</li>
      <li><strong>Ответчик</strong> — незаконный владелец, обладающий вещью на момент предъявления иска.</li>
    </ul>

    <h3>3. Объект виндикации</h3>
    <p>Имущество, которое:</p>
    <ul>
      <li><strong>индивидуально-определено</strong> (не может быть заменено другой вещью);</li>
      <li><strong>сохранилось в натуре</strong>. При отсутствии предмета виндикации (уничтожении вещи) должно предъявляться обязательственно-правовое требование о возмещении убытков.</li>
    </ul>

    <h3>4. Условия удовлетворения иска</h3>
    <p>Зависят от добросовестности приобретателя:</p>
    <ul>
      <li><strong>Добросовестный приобретатель</strong> — не знал и не должен был знать, что приобретает вещь у лица, не имеющего права её отчуждать.</li>
      <li><strong>Недобросовестный приобретатель</strong> — знал или должен был знать о незаконности владения.</li>
    </ul>
    <p>У недобросовестного приобретателя имущество может быть истребовано <strong>всегда</strong>.</p>
    <p>У добросовестного — <strong>в определённых случаях</strong> (ограничение виндикации). Учитываются:</p>
    <ul>
      <li><strong>возмездность приобретения</strong>: если безвозмездно (дарение) — виндицируется;</li>
      <li><strong>способ выбытия имущества</strong>: если выбыло помимо воли собственника — подлежит истребованию. Если передано собственником по договору — не подлежит.</li>
    </ul>
    <p>Закон <strong>запрещает</strong> истребовать у добросовестного приобретателя деньги и ценные бумаги на предъявителя.</p>

    <h3>5. Расчёты при возврате имущества</h3>
    <ul>
      <li><strong>Недобросовестный владелец</strong> обязан возвратить все доходы, которые извлёк за всё время владения.</li>

      <li>Затраты на содержание имущества компенсируются собственником — как добросовестному, так и недобросовестному владельцу.</li>

  body:`
    <h3>1. Понятие негаторного иска (ст. 285 ГК)</h3>
    <p><strong>Негаторный иск</strong> — требование об устранении препятствий в осуществлении права собственности, т.е. о прекращении таких нарушений, которые не соединены с лишением собственника владения имуществом.</p>

    </ul>

    <h3>4. Цель предъявления</h3>

    <p>Правонарушение по негаторному иску не подвержено действию исковой давности и может быть предъявлено в любой момент, пока сохраняется правонарушение (ст. 209 ГК).</p>

{
  id:"b15",
  section:"Раздел 7. Вещное право",
  title:"Билет 15. Иск об освобождении имущества от ареста и иск о признании права собственности",
  subtitle:"Иные способы защиты вещных прав.",
  body:`
    <h3>1. Иск об освобождении имущества от ареста (исключении из описи)</h3>
    <p><strong>Иск об освобождении имущества от ареста</strong> — требование собственника или законного владельца об исключении имущества из описи, составленной судебным приставом-исполнителем при обращении взыскания на имущество должника.</p>
    <p>Основание — арестованное имущество фактически не принадлежит должнику, а принадлежит истцу.</p>
    <p>Истец должен доказать:</p>
    <ul>
      <li>право собственности на спорное имущество;</li>
      <li>что имущество не принадлежит должнику;</li>
      <li>что включение в опись нарушает его права.</li>
    </ul>
    <p>Ответчики: должник и взыскатель (а также лицо, в интересах которого наложен арест).</p>

    <h3>2. Иск о признании права собственности</h3>
    <p><strong>Иск о признании права собственности</strong> — требование о констатации факта принадлежности истцу права собственности на спорное имущество.</p>
    <p>Применяется, когда:</p>
    <ul>
      <li>право собственности оспаривается другим лицом;</li>
      <li>отсутствуют документы, подтверждающие право;</li>
      <li>невозможно зарегистрировать право в установленном порядке.</li>
    </ul>
    <p>Ответчик — лицо, оспаривающее право или претендующее на него.</p>

    <h3>3. Значение этих исков</h3>
    <ul>
      <li>Иск об освобождении от ареста защищает собственника от необоснованного взыскания.</li>
      <li>Иск о признании права собственности устраняет неопределённость в правовом статусе имущества.</li>
      <li>Оба иска могут предъявляться вместе с другими требованиями (например, о возмещении убытков).</li>
    </ul>

    <h3>4. Соотношение с другими способами защиты</h3>
    <table>
      <tr><th>Иск</th><th>Цель</th><th>Когда применяется</th></tr>
      <tr><td>Виндикационный</td><td>Возврат владения</td><td>Имущество выбыло из владения</td></tr>
      <tr><td>Негаторный</td><td>Устранение препятствий</td><td>Владение сохранено, но нарушено пользование</td></tr>

      <tr><td>О признании права</td><td>Констатация права</td><td>Право оспаривается</td></tr>
    </table>

    <div class="card law">
      <div class="card-title">⚖️ Постановление Пленума ВС № 12 от 10.12.1993</div>
      О практике применения судами законодательства при рассмотрении дел об освобождении имущества от ареста (исключении из описи).
    </div>

    <div class="card note">
      <div class="card-title">💡 Совет</div>
      Если ваше имущество арестовали по долгам другого лица — подавайте иск об освобождении от ареста. Доказательства: договор, чек, свидетели, документы о праве собственности.
    </div>
  `,
  tasks:[
    {type:"single",q:"Кто является ответчиком по иску об освобождении имущества от ареста?",options:["Только судебный пристав","Должник и взыскатель","Только взыскатель","Орган регистрации"],correct:1,explain:"Ответчики — должник и взыскатель, так как спор касается их интересов."},
    {type:"multi",q:"Что должен доказать истец по иску об освобождении от ареста?",options:["Право собственности на имущество","Что имущество не принадлежит должнику","Что включение в опись нарушает его права","Что должник неплатёжеспособен"],correct:[0,1,2],explain:"Неплатёжеспособность должника не входит в предмет доказывания."},
    {type:"match",q:"Соотнесите иск с целью:",left:["Виндикационный","Негаторный","О признании права","Об освобождении от ареста"],right:["Возврат владения","Устранение препятствий","Констатация права","Исключение из описи"],correct:[0,1,2,3],explain:"Разные цели разных исков."},
    {type:"case",q:"Кейс. Судебный пристав арестовал автомобиль за долги гражданина П. Но автомобиль принадлежит его брату, который дал П. машину на время. Что делать брату?",answer:"Брату необходимо подать иск об освобождении имущества от ареста (исключении из описи). Ответчики — должник (П.) и взыскатель. Истец должен доказать право собственности на автомобиль (ПТС, договор купли-продажи, страховка). Суд исключит автомобиль из описи, и взыскание на него не будет обращено."}
  ]
}
];

const navEl=document.getElementById('nav');
const contentEl=document.getElementById('content');
const breadcrumbEl=document.getElementById('breadcrumb');
const progressTextEl=document.getElementById('progressText');
const progressFillEl=document.getElementById('progressFill');
let currentTicket=tickets[0].id;
const STORAGE_KEY='gp_progress_rz7_v1';
let progress=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');

function buildNav(){
  const sections={};
  tickets.forEach(t=>{if(!sections[t.section])sections[t.section]=[];sections[t.section].push(t);});
  let html='';
  Object.keys(sections).forEach(sec=>{
    html+=`<div class="nav-section"><div class="nav-section-title">${sec}</div><ul class="nav-list">`;
    sections[sec].forEach(t=>{
      const done=progress[t.id]?'<span class="check">✓</span>':'';
      html+=`<li><a href="#${t.id}" data-id="${t.id}">${done}<span>${t.title.replace(/^Билет \\d+\\.\\s*/,'')}</span></a></li>`;
    });
    html+='</ul></div>';
  });
  navEl.innerHTML=html;
  navEl.querySelectorAll('a').forEach(a=>{
    a.addEventListener('click',e=>{e.preventDefault();showTicket(a.dataset.id);document.getElementById('sidebar').classList.remove('open');});
  });
}
function showTicket(id){
  currentTicket=id;
  const t=tickets.find(x=>x.id===id);
  if(!t)return;
  breadcrumbEl.textContent=t.section+' · '+t.title.split('.')[0];
  contentEl.innerHTML=`
    <div class="ticket active">
      <h2>${t.title}</h2>
      <p class="subtitle">${t.subtitle}</p>
      ${t.body}
      <div class="tasks-header">📝 Задания для закрепления</div>
      <div id="tasks-${t.id}"></div>
      <div class="ticket-nav">
        ${prevTicketId(id)?`<button class="btn" onclick="showTicket('${prevTicketId(id)}')">← Предыдущий</button>`:'<span></span>'}
        <button class="btn btn-primary" onclick="markDone('${t.id}')">✓ Отметить как изученный</button>
        ${nextTicketId(id)?`<button class="btn" onclick="showTicket('${nextTicketId(id)}')">Следующий →</button>`:'<span></span>'}
      </div>
    </div>`;
  renderTasks(t);
  updateNavActive();
  window.scrollTo({top:0,behavior:'smooth'});
}
function prevTicketId(id){const i=tickets.findIndex(t=>t.id===id);return i>0?tickets[i-1].id:null;}
function nextTicketId(id){const i=tickets.findIndex(t=>t.id===id);return i<tickets.length-1?tickets[i+1].id:null;}
function updateNavActive(){navEl.querySelectorAll('a').forEach(a=>{a.classList.toggle('active',a.dataset.id===currentTicket);});}
function renderTasks(t){
  const container=document.getElementById('tasks-'+t.id);
  if(!container)return;
  let html='';
  t.tasks.forEach((task,idx)=>{
    html+=`<div class="task" id="task-${t.id}-${idx}"><div class="task-title">Задание ${idx+1}</div><div class="question">${task.q}</div>`;
    if(task.type==='single'){
      html+='<ul class="options">';
      task.options.forEach((opt,i)=>{html+=`<li><label><input type="radio" name="single-${t.id}-${idx}" value="${i}"> <span>${opt}</span></label></li>`;});
      html+='</ul>';
      html+=`<button class="btn btn-primary" onclick="checkSingle('${t.id}',${idx})">Проверить</button><div class="feedback" id="fb-${t.id}-${idx}"></div>`;
    }else if(task.type==='multi'){
      html+='<ul class="options">';
      task.options.forEach((opt,i)=>{html+=`<li><label><input type="checkbox" name="multi-${t.id}-${idx}" value="${i}"> <span>${opt}</span></label></li>`;});
      html+='</ul>';
      html+=`<button class="btn btn-primary" onclick="checkMulti('${t.id}',${idx})">Проверить</button><div class="feedback" id="fb-${t.id}-${idx}"></div>`;
    }else if(task.type==='match'){
      html+='<div class="match-grid">';
      task.left.forEach((left,i)=>{
        html+=`<div class="match-item left">${left}</div><div class="match-item"><select id="match-${t.id}-${idx}-${i}"><option value="">— выберите —</option>`;
        task.right.forEach((r,j)=>{html+=`<option value="${j}">${r}</option>`;});
        html+='</select></div>';
      });
      html+='</div>';
      html+=`<button class="btn btn-primary" onclick="checkMatch('${t.id}',${idx})">Проверить</button><div class="feedback" id="fb-${t.id}-${idx}"></div>`;
    }else if(task.type==='case'){
      html+=`<textarea placeholder="Напишите ответ..." id="case-${t.id}-${idx}"></textarea>`;
      html+=`<button class="reveal-btn" onclick="toggleReveal('${t.id}',${idx})">👁 Показать образец</button><div class="reveal-content" id="reveal-${t.id}-${idx}"><strong>Образец:</strong><br>${task.answer}</div>`;
    }
    html+='</div>';
  });
  container.innerHTML=html;
}
function checkSingle(tid,idx){
  const t=tickets.find(x=>x.id===tid);const task=t.tasks[idx];
  const selected=document.querySelector(`input[name="single-${tid}-${idx}"]:checked`);
  const fb=document.getElementById(`fb-${tid}-${idx}`);
  const labels=document.querySelectorAll(`#task-${tid}-${idx} .options label`);
  labels.forEach((l,i)=>{l.classList.remove('correct','wrong');if(i===task.correct)l.classList.add('correct');});
  if(!selected){fb.className='feedback show bad';fb.innerHTML='Выберите вариант.';return;}
  const val=parseInt(selected.value);
  if(val===task.correct){fb.className='feedback show ok';fb.innerHTML='✅ Правильно! <span class="explain">'+task.explain+'</span>';}
  else{selected.parentElement.classList.add('wrong');fb.className='feedback show bad';fb.innerHTML='❌ Неправильно. <span class="explain">'+task.explain+'</span>';}
}
function checkMulti(tid,idx){
  const t=tickets.find(x=>x.id===tid);const task=t.tasks[idx];
  const selected=Array.from(document.querySelectorAll(`input[name="multi-${tid}-${idx}"]:checked`)).map(c=>parseInt(c.value));
  const fb=document.getElementById(`fb-${tid}-${idx}`);
  const labels=document.querySelectorAll(`#task-${tid}-${idx} .options label`);
  labels.forEach((l,i)=>{l.classList.remove('correct','wrong');if(task.correct.includes(i))l.classList.add('correct');if(selected.includes(i)&&!task.correct.includes(i))l.classList.add('wrong');});
  const ok=selected.length===task.correct.length&&selected.every(v=>task.correct.includes(v));
  if(ok){fb.className='feedback show ok';fb.innerHTML='✅ Правильно! <span class="explain">'+task.explain+'</span>';}
  else{fb.className='feedback show bad';fb.innerHTML='❌ Неправильно. <span class="explain">'+task.explain+'</span>';}
}
function checkMatch(tid,idx){
  const t=tickets.find(x=>x.id===tid);const task=t.tasks[idx];
  const fb=document.getElementById(`fb-${tid}-${idx}`);
  let ok=true;
  task.left.forEach((_,i)=>{const sel=document.getElementById(`match-${tid}-${idx}-${i}`);if(parseInt(sel.value)!==task.correct[i])ok=false;});
  if(ok){fb.className='feedback show ok';fb.innerHTML='✅ Всё верно! <span class="explain">'+task.explain+'</span>';}
  else{fb.className='feedback show bad';fb.innerHTML='❌ Есть ошибки. <span class="explain">'+task.explain+'</span>';}
}
function toggleReveal(tid,idx){document.getElementById(`reveal-${tid}-${idx}`).classList.toggle('show');}
function markDone(id){progress[id]=true;localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));buildNav();updateNavActive();updateProgress();const next=nextTicketId(id);if(next)setTimeout(()=>showTicket(next),300);}
function updateProgress(){const done=Object.keys(progress).length;const total=tickets.length;progressTextEl.textContent=`${done} / ${total}`;progressFillEl.style.width=(done/total*100)+'%';}
function resetProgress(){if(confirm('Сбросить прогресс?')){progress={};localStorage.removeItem(STORAGE_KEY);buildNav();updateNavActive();updateProgress();}}
function toggleTheme(){const html=document.documentElement;const isDark=html.getAttribute('data-theme')==='dark';html.setAttribute('data-theme',isDark?'light':'dark');localStorage.setItem('gp_theme',isDark?'light':'dark');document.getElementById('themeBtn').textContent=isDark?'🌙 Тема':'☀️ Тема';}
document.getElementById('searchBox').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();navEl.querySelectorAll('a').forEach(a=>{const t=tickets.find(x=>x.id===a.dataset.id);const m=!q||t.title.toLowerCase().includes(q)||t.subtitle.toLowerCase().includes(q)||t.body.toLowerCase().includes(q);a.parentElement.style.display=m?'':'none';});navEl.querySelectorAll('.nav-section').forEach(sec=>{const v=Array.from(sec.querySelectorAll('li')).some(li=>li.style.display!=='none');sec.style.display=v?'':'none';});});
(function init(){const savedTheme=localStorage.getItem('gp_theme');if(savedTheme==='dark'){document.documentElement.setAttribute('data-theme','dark');document.getElementById('themeBtn').textContent='☀️ Тема';}buildNav();showTicket(currentTicket);updateProgress();})();
</script>
</body>
</html>
