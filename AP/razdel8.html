<title>Раздел 8. Обязательственное право</title>
<style>
  :root{--bg:#f5f7fa;--card:#fff;--text:#1a2332;--muted:#5a6a80;--accent:#1e5a96;--accent-hover:#164a7d;--border:#d8e0ea;--success:#1e7d4e;--error:#b03a3a;--warning:#a8761f;--shadow:0 2px 8px rgba(0,0,0,.06)}

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;transition:background .3s,color .3s}
  .layout{display:flex;min-height:100vh}
  .sidebar{width:320px;background:var(--card);border-right:1px solid var(--border);padding:20px 16px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;transition:transform .3s;z-index:100}

  .sidebar-header h1{font-size:17px;color:var(--accent);margin-bottom:6px}

  .search-box{width:100%;padding:8px 12px;margin-bottom:14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px}
  .search-box:focus{outline:2px solid var(--accent)}
  .progress-wrap{margin-bottom:14px}
  .progress-label{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
  .progress-bar-bg{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
  .progress-bar-fill{height:100%;background:var(--accent);width:0%;transition:width .4s}
  .nav-section{margin-bottom:6px}
  .nav-section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:10px 8px 6px}
  .nav-list{list-style:none}
  .nav-list li a{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:13.5px;color:var(--text);text-decoration:none;border-radius:6px;margin-bottom:2px;transition:background .15s}
  .nav-list li a:hover{background:var(--bg);color:var(--accent)}
  .nav-list li a.active{background:var(--accent);color:#fff}
  .nav-list li a .check{color:var(--success);font-weight:bold}
  .nav-list li a.active .check{color:#c8f5d8}
  .main{flex:1;margin-left:320px;padding:32px 40px 80px;max-width:900px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px;flex-wrap:wrap}
  .topbar .breadcrumb{font-size:13px;color:var(--muted)}
  .btn{padding:8px 14px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;cursor:pointer;font-size:13.5px;transition:all .2s;text-decoration:none;display:inline-block}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-primary:hover{background:var(--accent-hover);color:#fff}
  .ticket{display:none;animation:fade .3s}
  .ticket.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .ticket h2{font-size:24px;color:var(--accent);margin-bottom:6px;line-height:1.3}
  .ticket .subtitle{font-size:14px;color:var(--muted);margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid var(--border)}
  .ticket h3{font-size:18px;margin:26px 0 12px;color:var(--text);border-left:4px solid var(--accent);padding-left:10px}
  .ticket h4{font-size:15.5px;margin:18px 0 8px;color:var(--accent)}
  .ticket p{margin-bottom:12px}
  .ticket ul,.ticket ol{margin:0 0 14px 24px}
  .ticket li{margin-bottom:6px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin:16px 0;box-shadow:var(--shadow)}
  .card.note{border-left:4px solid var(--accent)}
  .card.warn{border-left:4px solid var(--warning);background:rgba(168,118,31,.06)}
  .card.law{border-left:4px solid var(--success);background:rgba(30,125,78,.05)}
  .card-title{font-weight:700;margin-bottom:8px;font-size:14.5px}
  .card.note .card-title{color:var(--accent)}
  .card.warn .card-title{color:var(--warning)}
  .card.law .card-title{color:var(--success)}
  table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}
  th,td{border:1px solid var(--border);padding:9px 12px;text-align:left;vertical-align:top}
  th{background:var(--bg);font-weight:700}
  .tasks-header{margin:34px 0 16px;padding:12px 18px;background:linear-gradient(90deg,var(--accent),var(--accent-hover));color:#fff;border-radius:10px;font-size:17px;font-weight:700}
  .task{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .task-title{font-weight:700;margin-bottom:10px;color:var(--accent);font-size:15px}
  .task .question{margin-bottom:12px}
  .options{list-style:none;margin:0 0 12px 0}
  .options li{margin-bottom:6px}
  .options label{display:flex;gap:9px;align-items:flex-start;padding:8px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;font-size:14px}
  .options label:hover{border-color:var(--accent);background:var(--bg)}
  .options input{margin-top:4px;accent-color:var(--accent)}
  .options label.correct{border-color:var(--success);background:rgba(30,125,78,.1)}
  .options label.wrong{border-color:var(--error);background:rgba(176,58,58,.1)}
  .feedback{margin-top:10px;font-size:14px;padding:10px 14px;border-radius:8px;display:none}
  .feedback.show{display:block}
  .feedback.ok{background:rgba(30,125,78,.12);color:var(--success);border-left:3px solid var(--success)}
  .feedback.bad{background:rgba(176,58,58,.1);color:var(--error);border-left:3px solid var(--error)}
  .feedback .explain{display:block;margin-top:6px;color:var(--text);font-size:13.5px}
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .match-item{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px}
  .match-item.left{background:var(--bg);font-weight:600}
  .match-item select{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:14px}
  textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;resize:vertical;margin-bottom:10px}
  textarea:focus{outline:2px solid var(--accent)}
  .reveal-btn{background:var(--bg);border:1px dashed var(--accent);color:var(--accent);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;margin-top:6px}
  .reveal-btn:hover{background:var(--accent);color:#fff}
  .reveal-content{display:none;margin-top:10px;padding:12px 16px;background:var(--bg);border-radius:8px;border-left:3px solid var(--accent);font-size:14px}
  .reveal-content.show{display:block}
  .ticket-nav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--border)}
  .ticket-nav .btn{flex:1;text-align:center}
  .menu-toggle{display:none;position:fixed;bottom:20px;right:20px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:200}
  @media (max-width:900px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}.main{margin-left:0;padding:20px 16px 90px}.menu-toggle{display:block}.match-grid{grid-template-columns:1fr}}
  .footer{margin-top:50px;padding-top:20px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);text-align:center}
</style>
</head>

<script>
const tickets = [
{
  id:"b1",
  section:"Раздел 8. Обязательственное право",
  title:"Билет 1. Понятие обязательства. Обязательственное право и его система",
  subtitle:"Место обязательственного права в системе гражданского права.",
  body:`
    <h3>1. Понятие обязательственного права</h3>
    <p><strong>Обязательственное право</strong> — система правовых норм, регулирующих общественные отношения по перемещению материальных благ, обладающих свойством товара, от одного лица к другому в определённой форме (передача имущества, выполнение работ, оказание услуг и т.д.). Обязательственное право является <strong>подотраслью</strong> гражданского права.</p>

    <h3>2. Структура обязательственного права</h3>
    <p>Нормы обязательственного права разделены в ГК на две части:</p>
    <ul>
      <li><strong>Общие положения об обязательствах</strong> — основания возникновения, понятие, стороны, обеспечение исполнения, порядок и условия исполнения, ответственность за нарушение, прекращение.</li>
      <li><strong>Отдельные виды обязательств</strong> — купля-продажа и её разновидности, мена, дарение, перевозка, подряд, хранение и др.</li>
    </ul>
    <p>Также нормы могут содержаться в специальном законодательстве (транспортное, энергоснабжение и др.).</p>

    <h3>3. Понятие обязательства (ст. 288 ГК)</h3>
    <p><strong>Обязательство</strong> — гражданское правоотношение, в силу которого одно лицо (должник) обязано совершить в пользу другого лица (кредитора) определённое действие (передать имущество, выполнить работу, уплатить деньги и т.п.) либо воздержаться от определённого действия, а кредитор имеет право требовать от должника исполнения его обязанности.</p>

    <h3>4. Отличия обязательственных правоотношений от вещных</h3>
    <ul>
      <li><strong>Экономическое содержание:</strong> обязательства — динамика (перемещение благ), вещные — статика (принадлежность).</li>
      <li><strong>Связь субъектов:</strong> в обязательствах управомоченному лицу корреспондирует конкретное обязанное лицо (относительные); в вещных — неопределённый круг (абсолютные).</li>
      <li><strong>Содержание права:</strong> в обязательстве — право требования определённого поведения; в вещных — возможность самостоятельно действовать.</li>
      <li><strong>Содержание обязанности:</strong> в обязательстве — активные действия; в вещных — воздержание от действий.</li>
      <li><strong>Основания:</strong> в обязательстве — зависят от типа и вида; в вещных — опираются только на нормы закона.</li>
    </ul>

    <h3>5. Субъекты обязательства</h3>
    <ul>
      <li><strong>Кредитор</strong> — управомоченное лицо (активная сторона).</li>
      <li><strong>Должник</strong> — обязанное лицо (пассивная сторона).</li>
    </ul>
    <p>Возможны обязательства с множественностью лиц (см. отдельный билет).</p>

    <h3>6. Объект обязательства</h3>
    <p>Конкретное действие, совершения которого кредитор вправе требовать от должника.</p>

    <h3>7. Содержание обязательства</h3>
    <p>Права и обязанности сторон, возникающие в конкретном правоотношении.</p>

    <h3>8. Основания возникновения обязательств (ст. 288 ГК)</h3>
    <ul>
      <li>договоры;</li>
      <li>сделки;</li>
      <li>административные акты;</li>
      <li>причинение вреда (деликт);</li>
      <li>события;</li>
      <li>иные действия граждан и юридических лиц.</li>
    </ul>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 288 ГК</div>
      Определяет понятие обязательства и основания его возникновения.
    </div>
  `,
  tasks:[
    {type:"single",q:"Что такое обязательство?",options:["Право на вещь","Правоотношение, в силу которого должник обязан совершить действие в пользу кредитора","Право собственности","Административное отношение"],correct:1,explain:"Ст. 288 ГК: обязательство — правоотношение между должником и кредитором."},
    {type:"multi",q:"Какие основания возникновения обязательств?",options:["Договоры","Причинение вреда","События","Право собственности"],correct:[0,1,2],explain:"Право собственности — вещное право, не основание обязательства."},
    {type:"match",q:"Соотнесите элемент обязательства с характеристикой:",left:["Кредитор","Должник","Объект"],right:["Управомоченное лицо","Обязанное лицо","Действие, которое должно быть совершено"],correct:[0,1,2],explain:"Структура обязательства."},
    {type:"case",q:"Кейс. Гражданин занял у друга 500 рублей. Друг — кредитор. Какие обязательства возникли? Какой вид?",answer:"Возникло договорное обязательство займа (ст. 760 ГК). Кредитор — друг, должник — гражданин. Объект — возврат денег. Обязательство одностороннее (у заёмщика только обязанность, у займодавца только право), реальное (считается заключённым с момента передачи денег)."}
  ]
},
{
  id:"b2",
  section:"Раздел 8. Обязательственное право",
  title:"Билет 2. Виды обязательств",
  subtitle:"Классификация обязательств по различным основаниям.",
  body:`
    <h3>1. По основаниям возникновения</h3>
    <ul>
      <li><strong>Договорные</strong> — возникающие из договора.</li>
      <li><strong>Внедоговорные</strong> — возникающие из иных юридических фактов, исключая договор (деликты, неосновательное обогащение).</li>
    </ul>

    <h3>2. По распределению прав и обязанностей</h3>
    <ul>
      <li><strong>Односторонние</strong> — одна сторона только права, вторая — только обязанности (заём, дарение).</li>
      <li><strong>Двусторонние</strong> — каждая сторона имеет и права, и обязанности (купля-продажа, перевозка).</li>
      <li><strong>Многосторонние</strong> — более двух сторон с равными правами и обязанностями (простое товарищество).</li>
    </ul>

    <h3>3. По способу определения содержания</h3>
    <ul>
      <li><strong>Со строго определённым содержанием</strong> — должник обязуется совершить конкретное действие.</li>
      <li><strong>Альтернативные</strong> — должник обязан совершить одно из нескольких указанных действий. Право выбора принадлежит должнику, если иное не предусмотрено.</li>
    </ul>

    <h3>4. По связи с личностью сторон</h3>
    <ul>
      <li><strong>Тесно связанные с личностью</strong> должника или кредитора (поручение).</li>
      <li><strong>Не связанные с личностью</strong> — переход прав и обязанностей возможен.</li>
    </ul>

    <h3>5. По юридической значимости</h3>
    <ul>
      <li><strong>Главные</strong> — имеют самостоятельное значение.</li>
      <li><strong>Дополнительные (акцессорные)</strong> — дополняют главные и следуют их судьбе (залог, поручительство).</li>
    </ul>

    <h3>6. Регрессные обязательства</h3>
    <p><strong>Регрессное обязательство</strong> — гражданское правоотношение, в силу которого одно лицо (регрессат) обязано возместить другому лицу (регредиенту) по его требованию ущерб, понесённый регредиентом вследствие того, что по другому обязательству он исполнил обязанность за регрессата либо уплатил денежную сумму из-за его противоправного поведения.</p>
    <p>Признаки:</p>
    <ul>
      <li>производное — возникает при наличии основного обязательства;</li>
      <li>стороны: регрессат и регредиент (кредитор в регрессном обязательстве);</li>
      <li>одностороннее по содержанию.</li>
    </ul>
    <p>Значение — возможность для должника переложить неблагоприятные последствия на виновное лицо.</p>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 288–293 ГК</div>
      Регулируют понятие и виды обязательств.
    </div>
  `,
  tasks:[
    {type:"single",q:"Какое обязательство является односторонним?",options:["Купля-продажа","Заём","Перевозка","Аренда"],correct:1,explain:"Заём — одностороннее обязательство (у займодавца право, у заёмщика обязанность)."},
    {type:"multi",q:"Какие виды обязательств по распределению прав и обязанностей?",options:["Односторонние","Двусторонние","Многосторонние","Альтернативные"],correct:[0,1,2],explain:"Альтернативные — по способу определения содержания."},
    {type:"match",q:"Соотнесите вид обязательства с примером:",left:["Одностороннее","Двустороннее","Многостороннее"],right:["Дарение","Купля-продажа","Простое товарищество"],correct:[0,1,2],explain:"Разное распределение прав и обязанностей."},
    {type:"case",q:"Кейс. Должник обязан передать кредитору либо автомобиль, либо 10 000 рублей. Кто выбирает?",answer:"Это альтернативное обязательство (ст. 290 ГК). Право выбора принадлежит должнику, если иное не предусмотрено договором или законом. После выбора обязательство становится обычным (с конкретным предметом). Если должник выбрал автомобиль, он обязан передать именно его."}
  ]
},
{
  id:"b3",
  section:"Раздел 8. Обязательственное право",
  title:"Билет 3. Множественность лиц в обязательстве",
  subtitle:"Долевые, солидарные и субсидиарные обязательства.",
  body:`
    <h3>1. Понятие множественности лиц</h3>
    <p>На стороне должника или кредитора могут выступать несколько лиц. Такие обязательства называются обязательствами со множественностью лиц.</p>
    <ul>
      <li><strong>Пассивная множественность</strong> — несколько лиц на стороне должника.</li>
      <li><strong>Активная множественность</strong> — несколько лиц на стороне кредитора.</li>
      <li><strong>Смешанная множественность</strong> — несколько лиц на обеих сторонах.</li>
    </ul>

    <h3>2. Долевые обязательства (ст. 295 ГК)</h3>
    <p><strong>Долевое обязательство</strong> — каждый должник исполняет обязательство в своей доле, а каждый кредитор имеет право требовать исполнения только определённой доли обязательства. Доли предполагаются равными, если иное не установлено.</p>
    <p>Общее правило: при множественности лиц обязательство предполагается долевым, если закон или договор не устанавливают солидарность.</p>

    <h3>3. Солидарные обязательства (ст. 296–301 ГК)</h3>
    <p><strong>Солидарное обязательство</strong> — кредитор имеет право требовать исполнения от любого из содолжников как в полном объёме, так и в части (при пассивной множественности), либо каждый из сокредиторов вправе предъявить требование к должнику в полном объёме (при активной множественности).</p>
    <p>Солидарная обязанность или солидарное требование возникает, если это предусмотрено договором или установлено законом, в частности:</p>
    <ul>
      <li>при неделимости предмета обязательства;</li>
      <li>при совместном причинении вреда;</li>
      <li>при совместной деятельности нескольких лиц.</li>
    </ul>

    <h3>4. Субсидиарные обязательства (ст. 343 ГК)</h3>
    <p><strong>Субсидиарное обязательство</strong> — возложение на дополнительного должника обязанности исполнить требование кредитора в случае, если основной должник отказался удовлетворить требования кредитора или кредитор не получил от должника в разумный срок ответа на предъявленное требование.</p>
    <p>Примеры:</p>
    <ul>
      <li>гарант отвечает перед кредитором как субсидиарный (дополнительный) должник (ст. 349 ГК);</li>
      <li>родители за вред, причинённый несовершеннолетними 14–18 лет;</li>
      <li>собственник имущества казённого предприятия по его обязательствам.</li>
    </ul>

    <h3>5. Сравнение</h3>
    <table>
      <tr><th>Вид</th><th>Ответственность</th><th>Пример</th></tr>
      <tr><td>Долевое</td><td>Каждый в своей доле</td><td>Наследники по долгам наследодателя</td></tr>
      <tr><td>Солидарное</td><td>Любой в полном объёме</td><td>Совместное причинение вреда</td></tr>
      <tr><td>Субсидиарное</td><td>Дополнительный должник — при неисполнении основным</td><td>Поручитель, гарант</td></tr>
    </table>

      Регулируют множественность лиц в обязательстве.
    </div>

  body:`
    <h3>1. Понятие перемены лиц</h3>

    <h3>2. Уступка права требования (цессия) (ст. 353–360 ГК)</h3>
    <p><strong>Уступка права требования</strong> — соглашение между кредитором по обязательству (цедентом) и новым лицом (цессионарием) о передаче последнему права требования к должнику.</p>
    <p>Особенности:</p>

      <li>Форма уступки следует форме основной сделки.</li>

      <li>Должник вправе выдвигать против нового кредитора все возражения, которые имел против первоначального.</li>

  body:`
    <h3>1. Понятие исполнения обязательств</h3>
    <p><strong>Исполнение обязательств</strong> — совершение кредитором и должником тех действий, которые составляют содержание их прав и обязанностей в обязательстве.</p>

    <h3>2. Принципы исполнения (гл. 22 ГК)</h3>
    <ul>
      <li><strong>Надлежащее исполнение</strong> — исполнение в точном соответствии с указаниями законодательства, договора, а при их отсутствии — в соответствии с обычно предъявляемыми требованиями (обычаи делового оборота). Должны соблюдаться условия о субъектах, предмете, сроке, месте, способе исполнения.</li>
      <li><strong>Реальное исполнение</strong> — должник обязан исполнить обязательство в натуре (фактическая передача вещи, выполнение работы, оказание услуги) без права замены денежной компенсацией.</li>
      <li><strong>Недопустимость одностороннего отказа</strong> от исполнения обязательства и одностороннего изменения его условий, за исключением случаев, предусмотренных договором или законодательством.</li>
    </ul>

    <h3>3. Субъекты исполнения (ст. 294 ГК)</h3>
    <ul>
      <li><strong>Перепоручение (возложение)</strong> — обязательство исполняет третье лицо. Кредитор обязан принять исполнение, предложенное за должника третьим лицом, если иное не предусмотрено.</li>
      <li><strong>Переадресовка</strong> — должник исполняет обязательство не кредитору, а указанному им третьему лицу.</li>
    </ul>

    <h3>4. Предмет исполнения</h3>
    <p>Материальные и духовные ценности, с целью получения которых кредитор и должник вступают в правоотношения (вещи, услуги, работы, деньги).</p>

    <h3>5. Срок исполнения (ст. 295–296 ГК)</h3>
    <ul>
      <li>Если определён день или период — исполнение в этот день или в любой момент в пределах периода.</li>
      <li>Если срок не определён — исполнение в <strong>разумный срок</strong> после возникновения обязательства.</li>
      <li>Обязательство, не исполненное в разумный срок, а равно обязательство с моментом востребования — должник обязан исполнить в <strong>семидневный срок</strong> со дня поступления письменного требования кредитора.</li>
      <li><strong>Досрочное исполнение</strong> допускается, если иное не предусмотрено. Для предпринимательских обязательств досрочное исполнение допускается только в случаях, предусмотренных законом или договором.</li>
    </ul>

    <h3>6. Место исполнения (ст. 297 ГК)</h3>
    <p>Если не определено законодательством или договором:</p>
    <ol>
      <li>По обязательству передать недвижимость — в месте нахождения имущества.</li>
      <li>По обязательству передать товар с перевозкой — в месте сдачи первому перевозчику.</li>
      <li>По другим обязательствам передать товар — в месте изготовления или хранения (если известно кредитору).</li>

      <li>По всем другим — в месте жительства (нахождения) должника.</li>
    </ol>

      <div class="card-title">⚖️ Ст. 290–297 ГК</div>
      Регулируют исполнение обязательств.
    </div>

  subtitle:"Договор как основание обязательства.",
  body:`
    <h3>1. Понятие договора (ст. 390 ГК)</h3>
    <p><strong>Договор</strong> — соглашение двух или нескольких лиц, направленное на установление, изменение или прекращение гражданских прав и обязанностей.</p>
    <p>Договор — один из важнейших юридических фактов, разновидность сделки. К договорам применяются правила о двух- и многосторонних сделках.</p>

    <h3>2. Принцип свободы договора (ст. 391 ГК)</h3>
    <ul>
      <li>Граждане и юридические лица свободны в заключении договора.</li>
      <li>Понуждение к заключению договора не допускается, за исключением случаев, когда обязанность заключить договор предусмотрена законодательством или добровольно принятым обязательством.</li>
      <li>Стороны могут заключить договор, как предусмотренный, так и не предусмотренный законом, но не противоречащий ему.</li>
      <li>Стороны могут заключить смешанный договор (сочетающий элементы разных договоров).</li>
      <li>Условия договора определяются по усмотрению сторон, кроме случаев, когда содержание условия предписано законом.</li>
    </ul>

    <h3>3. Ограничения свободы договора</h3>
    <ul>
      <li>Публичный договор (ст. 396 ГК).</li>
      <li>Договор присоединения (ст. 398 ГК).</li>
      <li>Обязательное заключение договора (ст. 415 ГК).</li>
      <li>Антимонопольные ограничения.</li>
      <li>Предварительный договор (ст. 399 ГК).</li>
    </ul>

    <h3>4. Договор как правовой институт</h3>
    <p>Нормы о договорах сосредоточены в:</p>
    <ul>
      <li>Общей части ГК (раздел III «Общие положения об обязательствах», подраздел 2 «Общие положения о договоре»);</li>
      <li>Особенной части ГК (отдельные виды обязательств);</li>
      <li>специальном законодательстве.</li>
    </ul>

    <h3>5. Значение договора</h3>
    <ul>
      <li>Основное основание возникновения обязательств.</li>
      <li>Средство регулирования отношений сторон.</li>
      <li>Форма выражения автономии воли.</li>
      <li>Инструмент гражданского оборота.</li>
    </ul>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 390–391 ГК</div>

  subtitle:"Классификация договоров.",
  body:`
    <h3>1. По способу совершения</h3>
    <ul>
      <li><strong>Консенсуальные</strong> — достаточно соглашения сторон по всем существенным условиям (купля-продажа, подряд).</li>
      <li><strong>Реальные</strong> — кроме соглашения, необходима передача предмета договора (заём, хранение).</li>

    <h3>2. В зависимости от распределения прав и обязанностей</h3>
    <ul>
      <li><strong>Односторонние</strong> — у одной стороны только права, у другой — только обязанности (дарение).</li>
      <li><strong>Двусторонние</strong> — каждая сторона имеет и права, и обязанности (купля-продажа, аренда).</li>
      <li><strong>Многосторонние</strong> — все участники имеют равные права и обязанности (договор простого товарищества).</li>
    </ul>

    <h3>3. По характеру перемещения благ</h3>
    <ul>
      <li><strong>Возмездные</strong> — сторона получает плату или иное встречное предоставление.</li>
      <li><strong>Безвозмездные</strong> — предоставление без встречного.</li>
    </ul>

    <h3>4. По адресации интереса</h3>
    <ul>
      <li>В пользу стороны по договору.</li>
      <li><strong>В пользу третьего лица</strong> (ст. 400 ГК) — договор страхования жизни, договор в пользу третьего лица.</li>
    </ul>

    <h3>5. По характеру юридических последствий</h3>
    <ul>
      <li><strong>Окончательные (основные)</strong> — непосредственно порождают права и обязанности.</li>
      <li><strong>Предварительные</strong> (ст. 399 ГК) — создают обязанность заключить в будущем основной договор.</li>
    </ul>

    <h3>6. По юридической значимости</h3>
    <ul>
      <li><strong>Главные</strong> — имеют самостоятельное значение.</li>
      <li><strong>Придаточные (акцессорные)</strong> — дополняют главные и следуют их судьбе (договор о залоге).</li>
    </ul>

    <h3>7. По основаниям заключения</h3>
    <ul>
      <li><strong>Свободные</strong> — заключаются по усмотрению сторон.</li>
      <li><strong>Обязательные</strong> — заключение обязательно для одной или обеих сторон (публичный договор).</li>
    </ul>

    <h3>8. По способу определения условий</h3>
    <ul>
      <li>Договоры со взаимосогласованными условиями.</li>
      <li><strong>Договоры присоединения</strong> (ст. 398 ГК) — условия определяются одной стороной в формулярах или стандартных формах, принимаются другой только путём присоединения в целом.</li>
    </ul>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 391–401 ГК</div>
      Регулируют виды договоров.
    </div>
  `,

  body:`
    <h3>1. Содержание договора</h3>
    <p>Договор считается заключённым, если сторонами в требуемой форме достигнуто соглашение по всем существенным условиям.</p>
    <p>Условия договора делятся на:</p>
    <ul>
      <li><strong>Существенные</strong> — без которых договор не считается заключённым.</li>
      <li><strong>Обычные</strong> — предусмотрены нормативными актами и автоматически вступают в действие.</li>
      <li><strong>Случайные</strong> — не предусмотрены законом, отсутствие не влияет на заключённость.</li>

    <h3>2. Существенные условия (ст. 402 ГК)</h3>
    <ul>
      <li>Условия о предмете договора.</li>
      <li>Условия, названные в законодательстве как существенные, необходимые или обязательные для договоров данного вида.</li>
      <li>Условия, относительно которых по требованию одной из сторон должно быть достигнуто соглашение.</li>
    </ul>

    <h3>3. Обычные условия</h3>
    <p>Предусмотрены нормативными актами и автоматически вступают в действие в момент заключения договора. Например, цена при отсутствии в договоре может определяться по обычным ценам.</p>

    <h3>4. Случайные условия</h3>
    <p>Не предусмотрены законодательством и отсутствие которых не имеет значения для признания договора заключённым.</p>

    <h3>5. Форма договора</h3>
    <p>Подчиняется общим правилам о форме сделок. Для отдельных видов договоров закон устанавливает обязательную форму:</p>

      <li><strong>Простая письменная</strong> — для большинства договоров между юридическими лицами.</li>
      <li><strong>Нотариальная</strong> — для договора ренты, ипотеки.</li>
      <li><strong>Государственная регистрация</strong> — для сделок с недвижимостью.</li>
    </ul>
    <p>Договор может быть заключён путём:</p>
    <ul>
      <li>составления одного документа, подписанного сторонами;</li>
      <li>обмена документами посредством почтовой, телеграфной, электронной или иной связи.</li>
    </ul>

    <h3>6. Толкование договора (ст. 401 ГК)</h3>
    <p>При толковании условий договора принимается во внимание буквальное значение содержащихся в нём слов и выражений. Если буквальное значение неясно, оно устанавливается путём сопоставления с другими условиями и смыслом договора в целом.</p>

    <div class="card note">
      <div class="card-title">💡 Практический совет</div>
      Всегда фиксируйте все существенные условия письменно. Устные договорённости сложно доказывать.
    </div>

{
  id:"b9",
  section:"Раздел 8. Обязательственное право",
  title:"Билет 9. Заключение договора. Оферта и акцепт",
  subtitle:"Стадии заключения договора.",
  body:`
    <h3>1. Общий порядок заключения</h3>
    <p>Заключение договора проходит две стадии:</p>
    <ol>
      <li><strong>Оферта</strong> — предложение заключить договор.</li>
      <li><strong>Акцепт</strong> — принятие этого предложения.</li>
    </ol>

    <h3>2. Оферта (ст. 405 ГК)</h3>
    <p><strong>Оферта</strong> — адресованное одному или нескольким конкретным лицам предложение, которое достаточно определённо и выражает намерение лица, сделавшего предложение, считать себя заключившим договор с адресатом, которым будет принято предложение.</p>
    <p>Признаки оферты:</p>
    <ul>
      <li>достаточно определённа и выражает намерение заключить договор;</li>
      <li>содержит существенные условия договора;</li>
      <li>адресована одному или нескольким конкретным лицам.</li>
    </ul>

    <h3>3. Публичная оферта (ст. 405 ГК)</h3>
    <p><strong>Публичная оферта</strong> — содержащее все существенные условия договора предложение, из которого усматривается воля лица заключить договор на указанных в предложении условиях с любым, кто отзовётся.</p>

    <h3>4. Отзыв оферты (ст. 406 ГК)</h3>
    <p>Оферта связывает оферента с момента её получения адресатом. Оферта не может быть отозвана в течение срока, установленного для её акцепта, если иное не оговорено в самой оферте либо не вытекает из существа предложения или обстановки.</p>

    <h3>5. Акцепт (ст. 408 ГК)</h3>
    <p><strong>Акцепт</strong> — согласие лица принять адресованное ему предложение.</p>
    <p>Признаки:</p>
    <ul>
      <li>акцепт должен быть полным и безоговорочным;</li>
      <li>совершение действий по выполнению условий договора (отгрузка товара, уплата денег) считается акцептом, если иное не предусмотрено;</li>
      <li>акцептант связан согласием с момента получения акцепта оферентом;</li>
      <li>если акцепт получен с опозданием, оферент может уведомить акцептанта о принятии (ст. 410 ГК).</li>
    </ul>

    <h3>6. Отзыв акцепта (ст. 409 ГК)</h3>
    <p>Если извещение об отзыве акцепта поступило лицу, направившему оферту, ранее акцепта или одновременно с ним, акцепт считается не полученным.</p>

    <h3>7. Место заключения договора (ст. 411 ГК)</h3>
    <p>Договор признаётся заключённым в месте жительства (нахождения) оферента, если иное не предусмотрено.</p>

    <h3>8. Особые случаи</h3>
    <ul>
      <li>Заключение договора в обязательном порядке (ст. 415 ГК).</li>
      <li>Заключение договора на торгах (ст. 417–419 ГК).</li>
    </ul>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 402–419 ГК</div>
      Регулируют заключение договора.
    </div>

{
  id:"b10",
  section:"Раздел 8. Обязательственное право",
  title:"Билет 10. Изменение и расторжение договора",
  subtitle:"Основания и порядок.",
  body:`
    <h3>1. Общее правило</h3>
    <p>Договор может быть изменён или расторгнут по соглашению сторон, если иное не предусмотрено ГК и другими актами.</p>

    <h3>2. Одностороннее изменение и расторжение</h3>
    <p>Возможно в случаях, предусмотренных законодательством или соглашением сторон.</p>
    <p>Существенное значение имеет право стороны на односторонний отказ от договора (ст. 420 ГК) — если это предусмотрено законом или договором.</p>

    <h3>3. Изменение и расторжение по требованию одной стороны в судебном порядке (ст. 421 ГК)</h3>
    <p>Основания:</p>
    <ul>
      <li><strong>Существенное нарушение договора другой стороной.</strong> Существенным признаётся нарушение, влекущее для другой стороны такой ущерб, в результате которого она в значительной степени лишается того, на что вправе была рассчитывать при заключении договора.</li>
      <li><strong>Существенное изменение обстоятельств,</strong> из которых стороны исходили при заключении договора (если иное не предусмотрено договором или не вытекает из существа).</li>
      <li>Иные случаи, предусмотренные ГК, другими актами или договором.</li>
    </ul>

    <h3>4. Существенное изменение обстоятельств</h3>
    <p>Изменение обстоятельств признаётся существенным, если они изменились настолько, что, если бы стороны могли это разумно предвидеть, договор вообще не был бы ими заключён или был бы заключён на значительно отличающихся условиях (ч. 2 п. 1 ст. 421 ГК).</p>
    <p>Если стороны не достигли соглашения о приведении договора в соответствие с существенно изменившимися обстоятельствами или о его расторжении, договор может быть изменён или расторгнут по требованию заинтересованной стороны в судебном порядке при наличии одновременно всех условий (подп. 1–4 п. 2 ст. 421 ГК):</p>
    <ul>
      <li>в момент заключения стороны исходили из того, что такого изменения не произойдёт;</li>
      <li>изменение вызвано причинами, которые заинтересованная сторона не могла преодолеть после их возникновения при той степени заботливости и осмотрительности, какая от неё требовалась;</li>
      <li>исполнение договора без изменения условий настолько нарушило бы соотношение имущественных интересов сторон, что заинтересованная сторона понесла бы такой ущерб, что в значительной степени лишилась бы того, на что вправе была рассчитывать при заключении договора;</li>
      <li>из обычаев делового оборота или существа договора не вытекает, что риск изменения обстоятельств несёт заинтересованная сторона.</li>
    </ul>

    <h3>5. Порядок изменения и расторжения</h3>
    <p>Соглашение об изменении или расторжении договора совершается в той же форме, что и договор. Односторонний отказ — в письменной форме.</p>

    <h3>6. Правовые последствия (ст. 423 ГК)</h3>
    <ul>
      <li>При изменении — обязательства сторон сохраняются в изменённом виде.</li>
      <li>При расторжении — обязательства прекращаются.</li>
      <li>Стороны не вправе требовать возвращения исполненного до изменения или расторжения, если иное не предусмотрено законом или соглашением.</li>
      <li>Если основание — существенное нарушение, потерпевшая сторона вправе требовать возмещения убытков.</li>
    </ul>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 420–423 ГК</div>
      Регулируют изменение и расторжение договора.
    </div>
  `,
  tasks:[
    {type:"single",q:"Какое нарушение договора признаётся существенным?",options:["Любое нарушение","Нарушение, влекущее ущерб, при котором сторона лишается того, на что рассчитывала","Незначительное нарушение","Нарушение срока на 1 день"],correct:1,explain:"Ст. 421 ГК: существенное — лишающее сторону того, на что она рассчитывала."},
    {type:"multi",q:"Какие основания изменения и расторжения договора?",options:["Соглашение сторон","Существенное нарушение","Существенное изменение обстоятельств","Односторонний отказ без оснований"],correct:[0,1,2],explain:"Односторонний отказ без оснований не допускается."},
    {type:"case",q:"Кейс. Договор аренды помещения заключён на 5 лет. Через год здание сгорело. Что произойдёт с договором?",answer:"Это существенное изменение обстоятельств — договор может быть расторгнут по требованию заинтересованной стороны. Стороны освобождаются от дальнейшего исполнения. Убытки распределяются по правилам ст. 421 ГК. Если арендодатель застраховал здание — убытки возместит страховая. Если нет — арендодатель несёт риск гибели имущества как собственник."}
  ]
},
{
  id:"b11",
  section:"Раздел 8. Обязательственное право",
  title:"Билет 11. Способы обеспечения исполнения обязательств: общая характеристика",
  subtitle:"Меры, стимулирующие должника к исполнению.",
  body:`
    <h3>1. Понятие способов обеспечения</h3>
    <p><strong>Способы обеспечения исполнения обязательств</strong> — специальные меры принудительного характера, призванные обеспечить интересы кредитора в случае неисполнения или ненадлежащего исполнения должником обязательства.</p>

    <h3>2. Перечень способов (ст. 310 ГК)</h3>
    <ul>
      <li><strong>Неустойка</strong> — определённая денежная сумма, уплачиваемая при нарушении обязательства.</li>
      <li><strong>Залог</strong> — право кредитора получить удовлетворение из стоимости заложенного имущества.</li>
      <li><strong>Удержание</strong> — право кредитора удерживать вещь должника до исполнения обязательства.</li>
      <li><strong>Поручительство</strong> — обязанность поручителя отвечать за исполнение обязательства должником.</li>
      <li><strong>Гарантия</strong> — обязанность гаранта отвечать за исполнение обязательства должником.</li>
      <li><strong>Задаток</strong> — денежная сумма, выдаваемая в доказательство заключения договора и в обеспечение исполнения.</li>
    </ul>
    <p>Перечень <strong>открытый</strong> — могут применяться и другие меры.</p>

    <h3>3. Меры оперативного воздействия</h3>
    <p>Обеспечительным целям служат также меры оперативного воздействия:</p>
    <ul>
      <li>отказ от оплаты недоброкачественных товаров;</li>
      <li>перевод неисправного должника на аккредитивную форму расчётов;</li>
      <li>перевод покупателя на предварительную оплату.</li>
    </ul>

    <h3>4. Форма соглашения об обеспечении</h3>
    <p>Избранный сторонами способ обеспечения должен быть письменно зафиксирован либо в самом договоре, либо в дополнительном соглашении. Некоторые способы требуют нотариальной формы и государственной регистрации (залог недвижимости — ипотека).</p>

    <h3>5. Удержание</h3>
    <p>Удержание возникает <strong>в силу законодательства</strong> и не требует соглашения сторон.</p>

    <h3>6. Значение обеспечительных мер</h3>
    <ul>
      <li>Стимулируют должника к надлежащему исполнению.</li>
      <li>Защищают интересы кредитора.</li>
      <li>Снижают риски предпринимательской деятельности.</li>
      <li>Обеспечивают стабильность гражданского оборота.</li>
    </ul>

    <div class="card law">

      Перечисляет основные способы обеспечения исполнения обязательств.

      <div class="card-title">💡 Акцессорность</div>
      Большинство обеспечительных мер носят акцессорный (дополнительный) характер: прекращение основного обязательства влечёт прекращение обеспечения.

  id:"b12",
  section:"Раздел 8. Обязательственное право",
  title:"Билет 12. Неустойка как способ обеспечения исполнения обязательств",
  subtitle:"Виды неустойки и её соотношение с убытками.",
  body:`
    <h3>1. Понятие неустойки (ст. 311 ГК)</h3>
    <p><strong>Неустойка</strong> — определённая законодательством или договором денежная сумма, которую должник обязан уплатить кредитору в случае неисполнения или ненадлежащего исполнения обязательства, в частности в случае просрочки исполнения.</p>
    <p>По требованию об уплате неустойки кредитор <strong>не обязан доказывать причинение убытков</strong>.</p>

    <h3>2. Разновидности неустойки</h3>
    <ul>
      <li><strong>Штраф</strong> — однократно взыскиваемая неустойка.</li>
      <li><strong>Пеня</strong> — взыскивается при просрочке, начисляется непрерывно за каждый день просрочки. Определяется в процентном отношении к сумме невыполненного обязательства.</li>
    </ul>

    <h3>3. Виды неустойки по основанию установления</h3>
    <ul>
      <li><strong>Законная</strong> — устанавливается законодательством для некоторых видов обязательств и подлежит обязательному взысканию по требованию истца.</li>
      <li><strong>Договорная</strong> — устанавливается соглашением сторон.</li>
    </ul>

    <h3>4. Виды неустойки по соотношению с возмещением убытков (ст. 314 ГК)</h3>
    <ul>
      <li><strong>Зачётная</strong> — у должника сохраняется обязанность возмещать убытки, но только в части, не покрытой неустойкой. <em>Общее правило.</em></li>
      <li><strong>Штрафная</strong> — кредитор вправе требовать возмещения убытков в полной сумме сверх неустойки.</li>
      <li><strong>Исключительная</strong> — взыскивается только неустойка, без права на возмещение убытков.</li>
      <li><strong>Альтернативная</strong> — кредитор имеет право выбора между неустойкой и возмещением убытков.</li>
    </ul>

    <h3>5. Уменьшение неустойки (ст. 314 ГК)</h3>
    <p>Если подлежащая уплате неустойка явно несоразмерна последствиям нарушения обязательства, суд вправе уменьшить неустойку. Уменьшение допускается и по инициативе суда.</p>

    <h3>6. Значение неустойки</h3>
    <ul>
      <li>Обеспечительная функция — стимулирует должника к исполнению.</li>
      <li>Компенсационная функция — покрывает потери кредитора.</li>
      <li>Упрощает доказывание — не нужно доказывать убытки.</li>
    </ul>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 311–314 ГК</div>
      Регулируют неустойку: понятие, виды, соотношение с убытками, уменьшение.
    </div>
  `,
  tasks:[

    {type:"multi",q:"Какие виды неустойки по соотношению с убытками?",options:["Зачётная","Штрафная","Исключительная","Альтернативная"],correct:[0,1,2,3],explain:"Ст. 314 ГК."},
    {type:"case",q:"Кейс. Поставщик просрочил поставку на 10 дней. Договором предусмотрена пеня 0,1% за каждый день просрочки. Сумма поставки — 100 000 рублей. Какой размер неустойки?",answer:"Пеня = 100 000 × 0,1% × 10 = 1000 рублей. Кредитор вправе взыскать эту сумму. Если убытки больше, он может требовать их возмещения в части, не покрытой неустойкой (зачётная неустойка). Поставщик может просить суд уменьшить неустойку, если она явно несоразмерна."}

{
  id:"b13",
  section:"Раздел 8. Обязательственное право",
  title:"Билет 13. Залог как способ обеспечения исполнения обязательств",
  subtitle:"Понятие, предмет, виды залога.",
  body:`
    <h3>1. Понятие залога (ст. 315 ГК)</h3>
    <p><strong>Залог</strong> — способ обеспечения, при котором в случае неисполнения должником обязательства кредитор (залогодержатель) имеет право получить удовлетворение из стоимости заложенного имущества преимущественно перед другими кредиторами.</p>
    <p>Залогодержатель имеет право преимущественного удовлетворения перед другими кредиторами залогодателя.</p>

    <h3>2. Предмет залога</h3>
    <p>Любое имущество, за исключением:</p>
    <ul>
      <li>имущества, изъятого из оборота;</li>
      <li>денежных средств (противоречит сущности залога);</li>
      <li>требований, неразрывно связанных с личностью кредитора.</li>
    </ul>

    <h3>3. Основания возникновения залога</h3>
    <ul>
      <li><strong>Договор</strong>;</li>
      <li><strong>Акт законодательства</strong> (например, залог на основании закона при продаже в рассрочку).</li>
    </ul>

    <h3>4. Содержание договора залога</h3>
    <ul>
      <li>предмет залога и его стоимость;</li>
      <li>существо, размер и срок исполнения обязательства, обеспечиваемого залогом;</li>
      <li>указание на то, у какой стороны находится заложенное имущество.</li>
    </ul>

    <h3>5. Форма договора залога</h3>
    <ul>
      <li>Письменная форма.</li>
      <li>Договоры об ипотеке (залог недвижимости), о залоге движимого имущества или прав на имущество в обеспечение обязательств по договору — подлежат нотариальному удостоверению.</li>
      <li>Договор об ипотеке требует государственной регистрации.</li>
      <li>Залог вещей в ломбарде — выдачей ломбардом залогового билета.</li>
    </ul>

    <h3>6. Виды залога</h3>
    <ul>
      <li><strong>Залог с оставлением предмета у залогодателя</strong> — имущество остаётся у собственника.</li>
      <li><strong>Ипотека</strong> — залог недвижимости.</li>
      <li><strong>Залог товаров в обороте</strong> — товары могут изменяться, но общая стоимость сохраняется.</li>
      <li><strong>Залог вещей в ломбарде</strong> — особая разновидность.</li>
      <li><strong>Заклад</strong> — залог с передачей имущества залогодержателю.</li>
      <li><strong>Залог прав и ценных бумаг.</strong></li>
    </ul>

    <h3>7. Реализация заложенного имущества</h3>
    <p>Производится путём продажи с публичных торгов в порядке, установленном процессуальным законодательством.</p>
    <p>Иной порядок — для имущества, заложенного в ломбарде (продажа после льготного месяца).</p>

    <h3>8. Прекращение залога</h3>
    <ul>
      <li>Прекращение обеспеченного обязательства.</li>
      <li>Требование залогодателя при наличии оснований.</li>
      <li>Гибель заложенной вещи или прекращение права залога.</li>
    </ul>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 315–339 ГК, Закон «О залоге», Закон «Об ипотеке»</div>
      Регулируют залог, ипотеку, реализацию.
    </div>
  `,
  tasks:[
    {type:"single",q:"Что может быть предметом залога?",options:["Только недвижимость","Любое имущество, кроме изъятого из оборота и денег","Только ценные бумаги","Только товары в обороте"],correct:1,explain:"Ст. 315 ГК: любое имущество, кроме изъятого из оборота и денежных средств."},
    {type:"multi",q:"Какие виды залога вы знаете?",options:["Ипотека","Залог товаров в обороте","Заклад","Залог вещей в ломбарде"],correct:[0,1,2,3],explain:"Все перечисленные — виды залога."},
    {type:"case",q:"Кейс. Гражданин взял кредит в банке под залог квартиры. Он не платит 6 месяцев. Что может сделать банк?",answer:"Банк (залогодержатель) вправе обратить взыскание на заложенную квартиру. Реализация производится путём продажи с публичных торгов (ст. 320 ГК). Из вырученной суммы банк получает удовлетворение преимущественно перед другими кредиторами. Остаток возвращается залогодателю. Ипотека подлежит государственной регистрации."}
  ]

{
  id:"b14",
  section:"Раздел 8. Обязательственное право",
  title:"Билет 14. Поручительство и гарантия",
  subtitle:"Обязательства третьих лиц по обеспечению долга.",
  body:`
    <h3>1. Поручительство (ст. 341 ГК)</h3>
    <p><strong>Поручительство</strong> — по договору поручительства поручитель обязывается перед кредитором другого лица отвечать за исполнение последним своего обязательства полностью или частично.</p>
    <p>Поручителями могут быть несколько лиц.</p>

    <h3>2. Форма договора поручительства</h3>
    <p>Письменная форма. Несоблюдение влечёт недействительность договора поручительства.</p>

    <h3>3. Объём ответственности поручителя</h3>
    <ul>
      <li>Определяется договором (частичная или полная).</li>
      <li>Если не указан — предполагается полная.</li>
      <li>Поручитель отвечает солидарно с должником, если не предусмотрена субсидиарная ответственность.</li>
    </ul>

    <h3>4. Прекращение поручительства (ст. 347 ГК)</h3>
    <ul>
      <li>С прекращением основного обязательства.</li>
      <li>В случае изменения обязательства, влекущего увеличение ответственности или иные неблагоприятные последствия для поручителя (без его согласия).</li>
      <li>В случае перевода долга (без согласия поручителя).</li>
      <li>По истечении срока, на который выдано.</li>
    </ul>

    <h3>5. Гарантия (ст. 348 ГК)</h3>
    <p><strong>Гарантия</strong> — способ обеспечения обязательств, при котором гарант обязуется перед кредитором другого лица (должника) отвечать полностью или частично за исполнение обязательства этого лица.</p>

    <h3>6. Отличия гарантии от поручительства</h3>
    <table>
      <tr><th>Критерий</th><th>Поручительство</th><th>Гарантия</th></tr>
      <tr><td>Ответственность</td><td>Солидарная (по умолчанию)</td><td>Субсидиарная</td></tr>
      <tr><td>Регрессный иск</td><td>Есть</td><td>Нет</td></tr>
      <tr><td>Обеспечиваемое требование</td><td>Может быть будущим</td><td>Только действительное</td></tr>
    </table>

    <h3>7. Правило о форме</h3>
    <p>Правила о форме гарантийного обязательства те же, что и при поручительстве.</p>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 341–350 ГК</div>
      Регулируют поручительство и гарантию.
    </div>

    <div class="card note">
      <div class="card-title">💡 Совет</div>
      При заключении договора поручительства требуйте чёткого определения объёма ответственности. Иначе поручитель будет отвечать в полном объёме.
    </div>

  tasks:[
    {type:"single",q:"Какая ответственность поручителя по умолчанию?",options:["Субсидиарная","Солидарная","Долевая","Никакой"],correct:1,explain:"По умолчанию поручитель отвечает солидарно с должником."},
    {type:"multi",q:"В каких случаях прекращается поручительство?",options:["С прекращением основного обязательства","При изменении обязательства без согласия поручителя","При переводе долга без согласия поручителя","По истечении срока"],correct:[0,1,2,3],explain:"Ст. 347 ГК."},
    {type:"case",q:"Кейс. Гражданин поручился за друга по кредиту. Друг перестал платить. Банк требует деньги с поручителя. Правомерно ли это?",answer:"Да, правомерно. По договору поручительства поручитель отвечает солидарно с должником, если не предусмотрено иное. Банк может требовать исполнения как от должника, так и от поручителя. Если поручитель выплатит долг, он вправе предъявить регрессное требование к должнику. Поручительство прекращается только по основаниям ст. 347 ГК."}

{
  id:"b15",
  section:"Раздел 8. Обязательственное право",
  title:"Билет 15. Удержание и задаток",
  subtitle:"Иные способы обеспечения обязательств.",
  body:`
    <h3>1. Удержание (ст. 340 ГК)</h3>
    <p><strong>Удержание</strong> — способ обеспечения, при котором кредитор, у которого находится вещь, подлежащая передаче должнику либо другому лицу, вправе удерживать её до тех пор, пока возникшее обязательство не будет исполнено.</p>
    <p>Правом удержания обладают:</p>
    <ul>
      <li>подрядчик (удерживает результат работы);</li>
      <li>перевозчик;</li>
      <li>хранитель;</li>
      <li>комиссионер и др.</li>
    </ul>
    <p>При удержании, как и при залоге, кредитор вправе требовать удовлетворения за счёт удерживаемого имущества. Права кредитора реализуются так же, как права залогодержателя.</p>
    <p><strong>Важно:</strong> удержание возникает на основании закона, для его использования не требуется согласия должника.</p>

    <h3>2. Задаток (ст. 351 ГК)</h3>
    <p><strong>Задаток</strong> — денежная сумма, выдаваемая одной из договаривающихся сторон в счёт причитающихся с неё по договору платежей другой стороне, в доказательство заключения договора и в обеспечение его исполнения.</p>

    <h3>3. Функции задатка</h3>
    <ul>
      <li><strong>Обеспечительная</strong> — стимулирует стороны к исполнению.</li>
      <li><strong>Платёжная</strong> — засчитывается в счёт платежей по договору.</li>
      <li><strong>Доказательственная</strong> — подтверждает заключение договора.</li>
    </ul>

    <h3>4. Форма соглашения о задатке</h3>
    <p>Независимо от суммы — <strong>письменная форма</strong>.</p>

    <h3>5. Последствия неисполнения обязательства</h3>
    <ul>
      <li>Если сторона, давшая задаток, уклонится от исполнения — она <strong>теряет задаток</strong>.</li>
      <li>Если сторона, получившая задаток, уклонится от исполнения — она возвращает его <strong>в двойном размере</strong>.</li>
      <li>Кроме того, сторона, виновная в неисполнении, обязана возместить другой стороне убытки с зачётом суммы задатка, если иное не предусмотрено.</li>
    </ul>

    <h3>6. Отличие задатка от аванса</h3>
    <table>
      <tr><th>Критерий</th><th>Задаток</th><th>Аванс</th></tr>
      <tr><td>Функция</td><td>Обеспечительная + платёжная</td><td>Только платёжная</td></tr>
      <tr><td>Последствия неисполнения</td><td>Потеря или двойной возврат</td><td>Только возврат</td></tr>
      <tr><td>Оформление</td><td>Обязательно указать «задаток»</td><td>Достаточно указания «аванс»</td></tr>
    </table>
    <p><strong>Важно:</strong> чтобы сумма выполняла обеспечительную функцию, необходимо специально оговорить в договоре, назвать её задатком.</p>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 340, 351 ГК</div>
      Регулируют удержание и задаток.
    </div>

  tasks:[

{
  id:"b17",
  section:"Раздел 8. Обязательственное право",
  title:"Билет 17. Виды и формы гражданско-правовой ответственности",
  subtitle:"Договорная, внедоговорная, долевая, солидарная, субсидиарная.",
  body:`
    <h3>1. Виды ответственности по основаниям возникновения</h3>
    <ul>
      <li><strong>Договорная</strong> — наступает за нарушение договорного обязательства.</li>
      <li><strong>Внедоговорная</strong> — наступает в тех случаях, когда вред имуществу или личности причинён не в связи с нарушением договора. Разновидность — ответственность за причинение морального вреда.</li>
    </ul>

    <h3>2. Виды по характеру распределения между несколькими лицами</h3>
    <ul>
      <li><strong>Долевая</strong> — каждый должник несёт ответственность в определённой, установленной законом или договором доле. По общему правилу ответственность долевая, если иное не установлено.</li>
      <li><strong>Солидарная</strong> — кредитор вправе требовать исполнения как от всех должников совместно, так и от любого из них в отдельности, как полностью, так и в части долга. Наступает только в случаях, прямо предусмотренных законом или договором (например, при совместном причинении вреда).</li>
      <li><strong>Субсидиарная</strong> — дополнительная ответственность субсидиарного должника по обязательству основного. Требование можно предъявить только тогда, когда основной должник отказался удовлетворить требования кредитора или кредитор не получил от него в разумные сроки ответа. Может быть предусмотрена законом или договором (родители за вред несовершеннолетних 14–18 лет, члены производственного кооператива по долгам кооператива).</li>
    </ul>

    <h3>3. Ответственность в порядке регресса</h3>
    <p>Регрессное требование к непосредственному причинителю вреда или убытков предъявляет лицо, исполнившее за него обязанность по их возмещению.</p>

    <h3>4. Формы гражданско-правовой ответственности</h3>
    <ul>
      <li><strong>Возмещение убытков</strong> (ст. 14 ГК). Под убытками понимаются:
        <ul>
          <li><strong>реальный ущерб</strong> — расходы, которые лицо произвело или должно будет произвести для восстановления нарушенного права, утрата или повреждение имущества;</li>
          <li><strong>упущенная выгода</strong> — неполученные доходы, которые лицо получило бы при обычных условиях гражданского оборота, если бы его право не было нарушено.</li>
        </ul>
      </li>
      <li><strong>Уплата неустойки</strong> — специальная мера, применяется лишь в случаях, прямо предусмотренных законом или договором.</li>
    </ul>
    <p>Возмещение убытков — универсальная форма ответственности, применяемая при любом нарушении обязательства.</p>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 14, гл. 25 ГК</div>
      Регулируют убытки и виды ответственности.
    </div>

{
  id:"b18",
  section:"Раздел 8. Обязательственное право",
  title:"Билет 18. Условия наступления гражданско-правовой ответственности",
  subtitle:"Состав гражданского правонарушения.",
  body:`
    <h3>1. Основание ответственности</h3>
    <p>Основанием возникновения гражданско-правовой ответственности всегда является <strong>гражданское правонарушение</strong>, которое выражается в нарушении требований либо законодательства, либо договора.</p>

    <h3>2. Состав гражданского правонарушения</h3>
    <p>Для ответственности в форме возмещения убытков, как правило, необходимо наличие <strong>четырёх условий</strong> (полный состав):</p>
    <ol>
      <li><strong>Противоправное поведение</strong> — поведение (действие, бездействие), противоречащее нормам объективного права и нормам договора, нарушающее субъективные права других лиц.</li>
      <li><strong>Наличие убытков</strong> — реальный ущерб и (или) упущенная выгода.</li>
      <li><strong>Причинная связь</strong> между противоправным деянием и причинением вреда или убытков.</li>
      <li><strong>Вина правонарушителя</strong>.</li>
    </ol>

    <h3>3. Усечённый состав</h3>
    <p>Для ответственности в форме уплаты неустойки требуется наличие двух условий:</p>
    <ul>
      <li>противоправное поведение;</li>
      <li>вина должника.</li>
    </ul>

    <h3>4. Обстоятельства, исключающие противоправность</h3>
    <ul>
      <li>Причинение вреда в состоянии необходимой обороны (если не превышены её пределы) и крайней необходимости.</li>
      <li>Осуществление профессиональной деятельности лицами некоторых профессий (пожарные при тушении пожара).</li>
      <li>Согласие лица на причинение вреда, если действия причинителя не нарушают нравственных принципов общества (например, согласие на хирургическую операцию).</li>
    </ul>

    <h3>5. Презумпция виновности</h3>
    <p>В гражданском праве установлена презумпция виновности: лицо предполагается виновным, пока не докажет свою невиновность.</p>

    <h3>6. Ответственность без вины</h3>
    <p>Законодательство может устанавливать случаи, когда ответственность наступает без вины:</p>
    <ul>
      <li>при невозможности исполнения обязательства должником, наступившей после просрочки с его стороны;</li>
      <li>при ответственности должника за действия третьих лиц, на которых было возложено исполнение обязательства;</li>
      <li>при нарушении обязательства, связанного с осуществлением предпринимательской деятельности;</li>
      <li>в случае причинения вреда источником повышенной опасности;</li>
      <li>в других случаях, предусмотренных законодательством.</li>
    </ul>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 372, 373 ГК</div>
      Регулируют условия ответственности и вину.
    </div>

    {type:"case",q:"Кейс. Водитель сбил пешехода, внезапно выбежавшего на дорогу. Водитель не виновен. Будет ли он нести ответственность?",answer:"Да, если автомобиль является источником повышенной опасности (ст. 948 ГК). Ответственность наступает независимо от вины. Владелец источника повышенной опасности освобождается только при наличии умысла потерпевшего или непреодолимой силы. При грубой неосторожности потерпевшего размер возмещения может быть уменьшен. В данном случае — грубая неосторожность пешехода, но ответственность сохраняется."}

{
  id:"b19",
  section:"Раздел 8. Обязательственное право",
  title:"Билет 19. Вина в гражданском праве. Формы вины",
  subtitle:"Умысел и неосторожность.",
  body:`
    <h3>1. Понятие вины</h3>
    <p><strong>Вина</strong> — психическое отношение лица к своему противоправному поведению. Вина — субъективное основание гражданско-правовой ответственности.</p>

    <h3>2. Презумпция виновности</h3>
    <p>В гражданском праве установлена <strong>презумпция виновности</strong>: лицо предполагается виновным, пока не докажет свою невиновность. Это облегчает положение потерпевшего.</p>

    <h3>3. Формы вины</h3>
    <ul>
      <li><strong>Умысел</strong> — преднамеренное нарушение обязательства.</li>
      <li><strong>Неосторожность</strong> — лицо не проявляет должной осмотрительности и не предвидит последствий своей неосмотрительности, хотя должно и могло их предвидеть.</li>
    </ul>

    <h3>4. Виды неосторожности</h3>
    <ul>
      <li><strong>Простая (лёгкая) неосторожность</strong> — лицо не проявляет достаточной осмотрительности.</li>
      <li><strong>Грубая неосторожность</strong> — лицо проявляет явное пренебрежение к исполнению обязательств.</li>
    </ul>
    <p>ГК не содержит определений простой и грубой неосторожности и перечня ситуаций. Различие — по степени пренебрежительного отношения к исполнению обязательств.</p>

    <h3>5. Значение формы вины</h3>
    <ul>
      <li>Для определения размера ответственности при смешанной вине.</li>
      <li>Для установления оснований освобождения от ответственности.</li>
      <li>Для квалификации отдельных правонарушений (например, при причинении вреда источником повышенной опасности).</li>
    </ul>

    <h3>6. Ответственность без вины</h3>
    <p>Законодательство может устанавливать случаи, когда ответственность наступает без вины:</p>
    <ul>
      <li>нарушение обязательства, связанного с предпринимательской деятельностью;</li>
      <li>причинение вреда источником повышенной опасности;</li>
      <li>невозможность исполнения после просрочки должника.</li>
    </ul>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 372 ГК</div>
      Лицо, не исполнившее обязательство либо исполнившее его ненадлежащим образом, несёт ответственность при наличии вины (умысла или неосторожности), кроме случаев, когда законом или договором предусмотрены иные основания ответственности.
    </div>

  section:"Раздел 8. Обязательственное право",
  title:"Билет 20. Основания освобождения от ответственности",
  subtitle:"Случай и непреодолимая сила.",
  body:`
    <h3>1. Обстоятельства, освобождающие от ответственности</h3>
    <p>Лицо, не исполнившее обязательство, освобождается от ответственности, если докажет, что надлежащее исполнение оказалось невозможным вследствие:</p>
    <ul>
      <li><strong>Непреодолимой силы</strong> — чрезвычайного и непредотвратимого при данных условиях обстоятельства.</li>
      <li><strong>Случая</strong> — обстоятельства, которое никто не может ни предвидеть, ни предотвратить.</li>
    </ul>

    <h3>2. Понятие непреодолимой силы</h3>
    <p><strong>Непреодолимая сила</strong> характеризуется:</p>
    <ul>
      <li><strong>Чрезвычайностью</strong> — выходит за пределы обычного.</li>
      <li><strong>Непредотвратимостью</strong> — объективной невозможностью предотвратить при данных условиях.</li>
    </ul>
    <p>Примеры: землетрясение, наводнение, ураган, военные действия, эпидемии, акты государственных органов, делающие исполнение невозможным.</p>

    <h3>3. Понятие случая</h3>
    <p><strong>Случай</strong> — обстоятельство, которое никто не может ни предвидеть, ни предотвратить. Характеризуется <strong>субъективной непредотвратимостью</strong> (в отличие от непреодолимой силы — объективной).</p>

    <h3>4. Различие случая и непреодолимой силы</h3>
    <table>
      <tr><th>Критерий</th><th>Случай</th><th>Непреодолимая сила</th></tr>
      <tr><td>Непредотвратимость</td><td>Субъективная</td><td>Объективная</td></tr>
      <tr><td>Чрезвычайность</td><td>Не обязательно</td><td>Обязательно</td></tr>
      <tr><td>Пример</td><td>Внезапная болезнь</td><td>Землетрясение</td></tr>
    </table>

    <h3>5. Ответственность без вины и освобождение</h3>
    <p>Даже при ответственности без вины (например, в предпринимательской деятельности) должник освобождается, если докажет, что надлежащее исполнение оказалось невозможным вследствие непреодолимой силы.</p>

    <h3>6. Просрочка кредитора</h3>
    <p>Кредитор считается просрочившим, если он отказался принять предложенное должником надлежащее исполнение или не совершил действий, до совершения которых должник не мог исполнить обязательства. Просрочка кредитора освобождает должника от ответственности за просрочку исполнения.</p>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 372, 375 ГК</div>
      Регулируют основания освобождения от ответственности.
    </div>

    <div class="card warn">
      <div class="card-title">⚠️ Важно</div>
      Ссылка на непреодолимую силу должна быть доказана. Простое «не смог» не освобождает от ответственности.
    </div>
  `,
  tasks:[
    {type:"single",q:"Какой признак характерен для непреодолимой силы?",options:["Субъективная непредотвратимость","Объективная непредотвратимость","Зависимость от воли сторон","Обычность"],correct:1,explain:"Непреодолимая сила — объективно непредотвратимое обстоятельство."},
    {type:"multi",q:"Какие обстоятельства освобождают от ответственности?",options:["Непреодолимая сила","Случай","Просрочка кредитора","Нежелание исполнять"],correct:[0,1,2],explain:"Нежелание не является основанием освобождения."},
    {type:"case",q:"Кейс. Поставщик не поставил товар из-за того, что завод-изготовитель обанкротился. Это непреодолимая сила?",answer:"Нет, банкротство контрагента не является непреодолимой силой, так как это предпринимательский риск. Поставщик несёт ответственность за нарушение договора, если не докажет наличие непреодолимой силы (стихийное бедствие, военные действия и т.п.). Он может взыскать убытки с завода-изготовителя в порядке регресса, но перед покупателем отвечает сам."}
  ]
},
{
  id:"b21",
  section:"Раздел 8. Обязательственное право",
  title:"Билет 21. Ответственность за неисполнение денежных обязательств",
  subtitle:"Проценты за пользование чужими денежными средствами.",
  body:`
    <h3>1. Понятие денежного обязательства</h3>
    <p><strong>Денежное обязательство</strong> — обязательство, в силу которого должник обязан уплатить кредитору определённую денежную сумму.</p>

    <h3>2. Ответственность за неисполнение денежного обязательства (ст. 366 ГК)</h3>
    <p>За пользование чужими денежными средствами вследствие их неправомерного удержания, уклонения от их возврата, иной просрочки в их уплате либо неосновательного получения или сбережения за счёт другого лица подлежат уплате проценты на сумму этих средств.</p>

    <h3>3. Размер процентов</h3>
    <p>Размер процентов определяется:</p>
    <ul>
      <li>учётной ставкой Национального банка Республики Беларусь на день исполнения денежного обязательства или его соответствующей части;</li>
      <li>либо договором;</li>
      <li>либо обычаями делового оборота.</li>
    </ul>
    <p>Если убытки, причинённые кредитору, превышают сумму процентов, он вправе требовать возмещения убытков в части, превышающей эту сумму.</p>

    <h3>4. Проценты как мера ответственности</h3>
    <ul>
      <li><strong>Компенсационная функция</strong> — покрывают потери кредитора от неполучения денег.</li>
      <li><strong>Штрафная функция</strong> — стимулируют должника к своевременному исполнению.</li>
    </ul>

    <h3>5. Проценты и неустойка</h3>
    <p>Если договором предусмотрена неустойка за неисполнение денежного обязательства, кредитор вправе требовать либо неустойку, либо проценты по ст. 366 ГК, если иное не предусмотрено законом или договором.</p>

    <h3>6. Основания освобождения</h3>
    <p>Должник освобождается от уплаты процентов, если докажет, что невозможность исполнения вызвана непреодолимой силой.</p>

    <h3>7. Пример расчёта</h3>
    <p>Долг — 10 000 рублей, просрочка — 30 дней, учётная ставка Нацбанка — 10% годовых.</p>
    <p>Проценты = 10 000 × 10% / 365 × 30 = 82,19 рубля.</p>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 366 ГК</div>
      Регулирует ответственность за неисполнение денежного обязательства.
    </div>

    <div class="card note">
      <div class="card-title">💡 Совет</div>
      При взыскании долга всегда указывайте требование о процентах по ст. 366 ГК. Это дополнительная сумма к основному долгу.
    </div>
  `,
  tasks:[
    {type:"single",q:"Чем определяется размер процентов по ст. 366 ГК при отсутствии договора?",options:["Ключевой ставкой ЦБ РФ","Учётной ставкой Нацбанка РБ","Ставкой рефинансирования МВФ","По желанию кредитора"],correct:1,explain:"Учётная ставка Национального банка Республики Беларусь."},
    {type:"multi",q:"Какие функции выполняют проценты по ст. 366 ГК?",options:["Компенсационная","Штрафная","Воспитательная","Политическая"],correct:[0,1],explain:"Компенсационная и штрафная функции."},
    {type:"case",q:"Кейс. Должник задержал оплату на 60 дней. Сумма долга — 50 000 рублей. Учётная ставка Нацбанка — 10% годовых. Рассчитайте проценты.",answer:"Проценты = 50 000 × 10% / 365 × 60 = 821,92 рубля. Кредитор вправе взыскать эту сумму сверх основного долга. Если договором предусмотрена неустойка (например, 0,1% в день), кредитор вправе выбрать: либо неустойка (50 000 × 0,1% × 60 = 3000 рублей), либо проценты по ст. 366 ГК — по выбору кредитора."}
  ]
},
{
  id:"b22",
  section:"Раздел 8. Обязательственное право",
  title:"Билет 22. Понятие и основания прекращения обязательств",
  subtitle:"Способы прекращения обязательств.",
  body:`
    <h3>1. Понятие прекращения обязательств</h3>
    <p><strong>Прекращение обязательств</strong> — утрата прав и обязанностей их участников. С момента прекращения ни одна из сторон не обязана совершать действия по его исполнению и не имеет права требовать совершения таких действий.</p>
    <p>Прекращение влекут <strong>правопрекращающие юридические факты</strong>, которые называются основаниями (способами) прекращения обязательств.</p>

    <h3>2. Классификация оснований</h3>
    <p>Все способы делятся на:</p>
    <ul>
      <li><strong>Общие</strong> — применимые ко всем или большинству обязательств.</li>
      <li><strong>Специальные</strong> — прекращающие только те обязательства, для которых они специально предусмотрены.</li>
    </ul>
    <p>По воле сторон:</p>
    <ul>
      <li><strong>По воле сторон</strong> — исполнение, отступное, прощение долга, новация, зачёт.</li>
      <li><strong>Помимо воли сторон</strong> — совпадение должника и кредитора, смерть гражданина, ликвидация юридического лица, невозможность исполнения.</li>
    </ul>

    <h3>3. Прекращение по воле сторон</h3>
    <ul>
      <li><strong>Исполнение обязательства</strong> (ст. 379 ГК) — должно быть реальным и надлежащим. Кредитор обязан выдать расписку по требованию должника.</li>
      <li><strong>Отступное</strong> (ст. 380 ГК) — взамен исполнения кредитору предоставляется определённая сумма денег, имущество и т.п. Первоначальный предмет исполнения заменяется другим.</li>
      <li><strong>Прощение долга</strong> (ст. 385 ГК) — освобождение кредитором должника от лежащих на нём обязанностей.</li>
      <li><strong>Новация</strong> (ст. 384 ГК) — соглашение о замене одного обязательства другим между теми же лицами, предусматривающее иной предмет или способ исполнения. Например, договор аренды заменяется договором купли-продажи.</li>
      <li><strong>Зачёт</strong> (ст. 381 ГК) — взаимное погашение встречных требований. Условия: требования встречные, однородные, срок исполнения наступил.</li>
    </ul>

    <h3>4. Прекращение помимо воли сторон</h3>
    <ul>
      <li><strong>Совпадение должника и кредитора в одном лице</strong> — например, слияние двух юридических лиц.</li>
      <li><strong>Смерть гражданина</strong> — если обязательство связано с личностью (например, алименты).</li>
      <li><strong>Ликвидация юридического лица</strong> — если обязательство не переходит к правопреемнику.</li>
      <li><strong>Невозможность исполнения</strong> — вызванная обстоятельством, за которое ни одна из сторон не отвечает. Частный случай — издание государственным органом акта, запрещающего исполнение.</li>
    </ul>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 378–389 ГК</div>
      Регулируют прекращение обязательств.
    </div>
  `,
  tasks:[
    {type:"single",q:"Что такое новация?",options:["Прекращение обязательства без исполнения","Замена одного обязательства другим","Уступка требования","Прощение долга"],correct:1,explain:"Новация — замена одного обязательства другим между теми же лицами (ст. 384 ГК)."},
    {type:"multi",q:"Какие условия зачёта?",options:["Встречность требований","Однородность требований","Наступление срока исполнения","Письменное согласие должника"],correct:[0,1,2],explain:"Ст. 381 ГК: три условия."},
    {type:"match",q:"Соотнесите основание с примером:",left:["Отступное","Новация","Зачёт"],right:["Вместо денег — имущество","Замена аренды куплей-продажей","Погашение встречных долгов"],correct:[0,1,2],explain:"Разные основания прекращения."},
    {type:"case",q:"Кейс. Гражданин А. должен Б. 1000 рублей. Б. должен А. 1000 рублей. Можно ли прекратить обязательства?",answer:"Да, путём зачёта встречных требований (ст. 381 ГК). Условия соблюдены: требования встречные, однородные (денежные), срок исполнения наступил. Достаточно заявления одной стороны. Обязательства прекращаются полностью. Если суммы разные — зачитывается меньшая, а разница уплачивается."}
  ]
},
{
  id:"b23",
  section:"Раздел 8. Обязательственное право",
  title:"Билет 23. Зачёт встречных требований",
  subtitle:"Условия и порядок применения.",
  body:`
    <h3>1. Понятие зачёта (ст. 381 ГК)</h3>
    <p><strong>Зачёт</strong> — взаимное погашение встречных требований. Представляет собой форму исполнения двух или нескольких обязательств, связывающих одних и тех же лиц.</p>

    <h3>2. Условия зачёта</h3>
    <p>Зачёту подлежат требования, обладающие одновременно тремя особенностями:</p>
    <ul>
      <li><strong>Встречность</strong> — стороны одновременно являются кредитором и должником друг друга.</li>
      <li><strong>Однородность</strong> — предметы обязательств должны быть однородными (например, деньги — деньги, зерно — зерно того же сорта).</li>
      <li><strong>Наступление срока исполнения</strong> — по встречным требованиям срок исполнения должен наступить. Также допускается зачёт требования, срок которого не указан или определён моментом востребования.</li>
    </ul>

    <h3>3. Порядок зачёта</h3>
    <ul>
      <li>Достаточно заявления одной стороны.</li>
      <li>Заявление должно быть получено другой стороной.</li>
      <li>Зачёт производится с момента получения заявления.</li>
    </ul>

    <h3>4. Случаи недопустимости зачёта (ст. 383 ГК)</h3>
    <ul>
      <li>Если по заявлению одной стороны к требованию подлежит применению срок исковой давности и этот срок истёк.</li>
      <li>Если требование связано с возмещением вреда, причинённого жизни или здоровью.</li>
      <li>Если требование связано с взысканием алиментов.</li>
      <li>Если требование представляет собой пожизненное содержание.</li>
      <li>В иных случаях, предусмотренных законом или договором.</li>
    </ul>

    <h3>5. Зачёт при уступке требования</h3>
    <p>Если должник имеет встречное требование к первоначальному кредитору, он может зачесть его против требования нового кредитора, если требование возникло до получения уведомления об уступке.</p>

    <h3>6. Практическое значение</h3>
    <ul>
      <li>Упрощение расчётов.</li>
      <li>Экономия времени и средств.</li>
      <li>Взаимное удовлетворение интересов сторон.</li>
    </ul>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 381–383 ГК</div>
      Регулируют зачёт встречных требований.
    </div>

    <div class="card note">
      <div class="card-title">💡 Пример</div>
      Вы должны другу 500 рублей за билеты, а он вам — 500 рублей за обед. Можно зачесть: никто никому ничего не должен.
    </div>
  `,
  tasks:[
    {type:"single",q:"Какое условие зачёта является обязательным?",options:["Встречность требований","Наличие письменного соглашения","Нотариальное удостоверение","Участие третьего лица"],correct:0,explain:"Зачёт возможен при встречности, однородности и наступлении срока."},
    {type:"multi",q:"Какие требования не подлежат зачёту?",options:["О возмещении вреда жизни и здоровью","Алименты","Пожизненное содержание","Денежный долг"],correct:[0,1,2],explain:"Ст. 383 ГК. Денежный долг — можно."},
    {type:"case",q:"Кейс. Гражданин А. должен Б. 1000 рублей. Б. должен А. 800 рублей. Можно ли произвести зачёт?",answer:"Да. Требования встречные, однородные (денежные), срок наступил. Зачёт производится на сумму 800 рублей. После зачёта А. остаётся должен Б. 200 рублей. Зачёт можно произвести заявлением одной стороны."}
  ]
},
{
  id:"b24",
  section:"Раздел 8. Обязательственное право",
  title:"Билет 24. Новация, отступное, прощение долга",
  subtitle:"Способы прекращения обязательств по воле сторон.",
  body:`
    <h3>1. Новация (ст. 384 ГК)</h3>
    <p><strong>Новация</strong> — соглашение о замене одного обязательства другим между теми же лицами, предусматривающее иной предмет или способ исполнения.</p>
    <p>Особенности:</p>
    <ul>
      <li>Требуется соглашение сторон.</li>
      <li>Заменяется предмет или способ исполнения.</li>
      <li>Первоначальное обязательство прекращается, возникает новое.</li>
      <li>Новация не допускается в отношении обязательств по возмещению вреда жизни и здоровью и по уплате алиментов.</li>
      <li>Соглашение о новации совершается в той же форме, что и первоначальное обязательство.</li>
    </ul>
    <p><em>Пример:</em> договор аренды заменяется договором купли-продажи того же имущества.</p>

    <h3>2. Отступное (ст. 380 ГК)</h3>
    <p><strong>Отступное</strong> — предоставление кредитору взамен исполнения определённой суммы денег, имущества и т.п.</p>
    <p>Особенности:</p>
    <ul>
      <li>Первоначальный предмет исполнения заменяется другим.</li>
      <li>Стороны договариваются о размере, сроках и порядке предоставления отступного.</li>
      <li>Обязательство прекращается с момента предоставления отступного.</li>
    </ul>
    <p><em>Пример:</em> вместо возврата долга 100 000 рублей должник передаёт кредитору автомобиль.</p>

    <h3>3. Прощение долга (ст. 385 ГК)</h3>
    <p><strong>Прощение долга</strong> — освобождение кредитором должника от лежащих на нём обязанностей.</p>
    <p>Особенности:</p>
    <ul>
      <li>Обязательство прекращается с момента выражения воли кредитором.</li>
      <li>Прощение долга не должно нарушать права других лиц.</li>
      <li>Прощение долга — это сделка (может быть односторонней или договором).</li>
    </ul>
    <p><em>Пример:</em> кредитор освобождает должника от уплаты штрафа за просрочку.</p>

    <h3>4. Сравнение</h3>
    <table>
      <tr><th>Способ</th><th>Суть</th><th>Пример</th></tr>

      <tr><td>Отступное</td><td>Предоставление взамен</td><td>Долг → автомобиль</td></tr>

    <div class="card law">
      <div class="card-title">⚖️ Ст. 380, 384, 385 ГК</div>

  `,

    {type:"multi",q:"В каких случаях новация не допускается?",options:["По возмещению вреда жизни и здоровью","По алиментам","По договору аренды","По купле-продаже"],correct:[0,1],explain:"Новация не допускается для обязательств личного характера."},
    {type:"match",q:"Соотнесите способ с примером:",left:["Новация","Отступное","Прощение долга"],right:["Замена аренды куплей-продажей","Передача автомобиля вместо денег","Кредитор освобождает от долга"],correct:[0,1,2],explain:"Разные способы прекращения."},
    {type:"case",q:"Кейс. Гражданин должен банку 5000 рублей. Он предлагает отдать ноутбук стоимостью 5000 рублей. Как оформить?",answer:"Это соглашение об отступном (ст. 380 ГК). Необходимо заключить письменное соглашение, в котором указать: первоначальное обязательство (кредит), предмет отступного (ноутбук), его стоимость, срок передачи. После передачи ноутбука обязательство прекращается. Банк должен согласиться на замену предмета — односторонне это сделать нельзя."}

},
{
