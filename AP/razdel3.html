<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Раздел 3. Объекты гражданских прав</title>
<style>
  :root{--bg:#f5f7fa;--card:#fff;--text:#1a2332;--muted:#5a6a80;--accent:#1e5a96;--accent-hover:#164a7d;--border:#d8e0ea;--success:#1e7d4e;--error:#b03a3a;--warning:#a8761f;--shadow:0 2px 8px rgba(0,0,0,.06)}
  [data-theme="dark"]{--bg:#141a24;--card:#1d2532;--text:#e6ecf3;--muted:#93a3b8;--accent:#4a8fd1;--accent-hover:#6aa7e0;--border:#2c3a4d;--success:#4caf7d;--error:#e07a7a;--warning:#d4a548;--shadow:0 2px 8px rgba(0,0,0,.3)}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;transition:background .3s,color .3s}
  .layout{display:flex;min-height:100vh}
  .sidebar{width:320px;background:var(--card);border-right:1px solid var(--border);padding:20px 16px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;transition:transform .3s;z-index:100}
  .sidebar-header{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
  .sidebar-header h1{font-size:17px;color:var(--accent);margin-bottom:6px}
  .sidebar-header p{font-size:12px;color:var(--muted)}
  .search-box{width:100%;padding:8px 12px;margin-bottom:14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px}
  .search-box:focus{outline:2px solid var(--accent)}
  .progress-wrap{margin-bottom:14px}
  .progress-label{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
  .progress-bar-bg{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
  .progress-bar-fill{height:100%;background:var(--accent);width:0%;transition:width .4s}
  .nav-section{margin-bottom:6px}
  .nav-section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:10px 8px 6px}
  .nav-list{list-style:none}
  .nav-list li a{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:13.5px;color:var(--text);text-decoration:none;border-radius:6px;margin-bottom:2px;transition:background .15s}
  .nav-list li a:hover{background:var(--bg);color:var(--accent)}
  .nav-list li a.active{background:var(--accent);color:#fff}
  .nav-list li a .check{color:var(--success);font-weight:bold}
  .nav-list li a.active .check{color:#c8f5d8}
  .main{flex:1;margin-left:320px;padding:32px 40px 80px;max-width:900px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px;flex-wrap:wrap}
  .topbar .breadcrumb{font-size:13px;color:var(--muted)}
  .btn{padding:8px 14px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;cursor:pointer;font-size:13.5px;transition:all .2s;text-decoration:none;display:inline-block}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-primary:hover{background:var(--accent-hover);color:#fff}
  .ticket{display:none;animation:fade .3s}
  .ticket.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .ticket h2{font-size:24px;color:var(--accent);margin-bottom:6px;line-height:1.3}
  .ticket .subtitle{font-size:14px;color:var(--muted);margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid var(--border)}
  .ticket h3{font-size:18px;margin:26px 0 12px;color:var(--text);border-left:4px solid var(--accent);padding-left:10px}
  .ticket h4{font-size:15.5px;margin:18px 0 8px;color:var(--accent)}
  .ticket p{margin-bottom:12px}
  .ticket ul,.ticket ol{margin:0 0 14px 24px}
  .ticket li{margin-bottom:6px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin:16px 0;box-shadow:var(--shadow)}
  .card.note{border-left:4px solid var(--accent)}
  .card.warn{border-left:4px solid var(--warning);background:rgba(168,118,31,.06)}
  .card.law{border-left:4px solid var(--success);background:rgba(30,125,78,.05)}
  .card-title{font-weight:700;margin-bottom:8px;font-size:14.5px}
  .card.note .card-title{color:var(--accent)}
  .card.warn .card-title{color:var(--warning)}
  .card.law .card-title{color:var(--success)}
  table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}
  th,td{border:1px solid var(--border);padding:9px 12px;text-align:left;vertical-align:top}
  th{background:var(--bg);font-weight:700}
  .tasks-header{margin:34px 0 16px;padding:12px 18px;background:linear-gradient(90deg,var(--accent),var(--accent-hover));color:#fff;border-radius:10px;font-size:17px;font-weight:700}
  .task{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .task-title{font-weight:700;margin-bottom:10px;color:var(--accent);font-size:15px}
  .task .question{margin-bottom:12px}
  .options{list-style:none;margin:0 0 12px 0}
  .options li{margin-bottom:6px}
  .options label{display:flex;gap:9px;align-items:flex-start;padding:8px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;font-size:14px}
  .options label:hover{border-color:var(--accent);background:var(--bg)}
  .options input{margin-top:4px;accent-color:var(--accent)}
  .options label.correct{border-color:var(--success);background:rgba(30,125,78,.1)}
  .options label.wrong{border-color:var(--error);background:rgba(176,58,58,.1)}
  .feedback{margin-top:10px;font-size:14px;padding:10px 14px;border-radius:8px;display:none}
  .feedback.show{display:block}
  .feedback.ok{background:rgba(30,125,78,.12);color:var(--success);border-left:3px solid var(--success)}
  .feedback.bad{background:rgba(176,58,58,.1);color:var(--error);border-left:3px solid var(--error)}
  .feedback .explain{display:block;margin-top:6px;color:var(--text);font-size:13.5px}
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .match-item{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px}
  .match-item.left{background:var(--bg);font-weight:600}
  .match-item select{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:14px}
  textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;resize:vertical;margin-bottom:10px}
  textarea:focus{outline:2px solid var(--accent)}
  .reveal-btn{background:var(--bg);border:1px dashed var(--accent);color:var(--accent);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;margin-top:6px}
  .reveal-btn:hover{background:var(--accent);color:#fff}
  .reveal-content{display:none;margin-top:10px;padding:12px 16px;background:var(--bg);border-radius:8px;border-left:3px solid var(--accent);font-size:14px}
  .reveal-content.show{display:block}
  .ticket-nav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--border)}
  .ticket-nav .btn{flex:1;text-align:center}
  .menu-toggle{display:none;position:fixed;bottom:20px;right:20px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:200}
  @media (max-width:900px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}.main{margin-left:0;padding:20px 16px 90px}.menu-toggle{display:block}.match-grid{grid-template-columns:1fr}}
  .footer{margin-top:50px;padding-top:20px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>📘 Раздел 3</h1>
      <p>Объекты гражданских прав</p>
    </div>
    <input type="text" class="search-box" id="searchBox" placeholder="🔍 Поиск...">
    <div class="progress-wrap">
      <div class="progress-label"><span>Прогресс</span><span id="progressText">0 / 9</span></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    </div>
    <nav id="nav"></nav>
    <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn" onclick="toggleTheme()" id="themeBtn">🌙 Тема</button>
      <button class="btn" onclick="resetProgress()">↺ Сброс</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="breadcrumb" id="breadcrumb">Раздел 3 · Билет 1</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <a href="razdel2.html" class="btn">← Раздел 2</a>
        <a href="razdel4.html" class="btn">Раздел 4 →</a>
      </div>
    </div>
    <div id="content"></div>
    <div class="footer">© Учебный материал по курсу «Гражданское право (Общая часть)».<br>ГК Республики Беларусь (по состоянию на 2026 г.).</div>
  </main>
  <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
</div>

<script>
const tickets = [
{
  id:"b1",
  section:"Раздел 3. Объекты гражданских прав",
  title:"Билет 1. Понятие и классификация объектов гражданских прав",
  subtitle:"Материальные и нематериальные блага, по поводу которых возникают правоотношения.",
  body:`
    <h3>1. Понятие объекта гражданского права</h3>
    <p><strong>Объекты гражданского права</strong> — материальные, духовные блага, по поводу которых субъекты вступают в гражданско-правовые отношения.</p>
    <p>К объектам гражданских прав относятся (ст. 128 ГК):</p>
    <ol>
      <li>вещи, включая деньги и ценные бумаги, иное имущество, в том числе имущественные права;</li>
      <li>работы и услуги;</li>
      <li>охраняемая информация;</li>
      <li>исключительные права на результаты интеллектуальной деятельности (интеллектуальная собственность);</li>
      <li>нематериальные блага.</li>
    </ol>

    <h3>2. Классификация объектов по оборотоспособности</h3>
    <ul>
      <li><strong>Объекты, изъятые из оборота</strong> — отчуждение и использование которых не допускается. Они должны быть прямо указаны в законе (ядерное оружие, объекты общего пользования и т.д.).</li>
      <li><strong>Свободно обращаемые объекты</strong> — могут свободно отчуждаться, принадлежать любому субъекту, быть предметом сделок.</li>
      <li><strong>Объекты, ограниченные в обороте</strong> — могут принадлежать лишь определённым участникам оборота либо нахождение которых в обороте допускается по специальному разрешению (например, оружие, наркотические средства, драгоценные металлы).</li>
    </ul>

    <h3>3. Классификация по делимости</h3>
    <ul>
      <li><strong>Делимые</strong> — при разделении на отдельные физические части не утрачивают своего назначения (продукты, деньги).</li>
      <li><strong>Неделимые</strong> — при раздроблении на составные части теряют свою ценность и функциональные свойства целого (автомобиль, дом).</li>
    </ul>

    <h3>4. Материальные и нематериальные блага</h3>
    <p>Объекты делятся также на материальные (вещи, деньги) и нематериальные (результаты творческой деятельности, личные неимущественные блага).</p>

    <h3>5. Значение классификации объектов</h3>
    <p>Классификация объектов гражданских прав важна для:</p>
    <ul>
      <li>определения возможности участия объекта в гражданском обороте;</li>
      <li>выбора способа защиты права;</li>
      <li>определения вида договора (например, купля-продажа недвижимости или движимого имущества);</li>
      <li>установления особенностей правового режима.</li>
    </ul>

    <div class="card law">
      <div class="card-title">⚖️ Статья 128 ГК</div>
      Даёт примерный перечень объектов гражданских прав. Перечень не является исчерпывающим — в оборот могут вовлекаться и иные блага, если это не противоречит закону.
    </div>
  `,
  tasks:[
    {type:"single",q:"Что относится к объектам гражданских прав?",options:["Только вещи","Вещи, работы, услуги, информация, интеллектуальная собственность, нематериальные блага","Только деньги и ценные бумаги","Только имущественные права"],correct:1,explain:"Ст. 128 ГК даёт широкий перечень объектов гражданских прав."},
    {type:"multi",q:"Какие объекты относятся к ограниченным в обороте?",options:["Оружие","Наркотические средства","Продукты питания","Драгоценные металлы"],correct:[0,1,3],explain:"Продукты питания — свободно обращаемые объекты."},
    {type:"match",q:"Соотнесите вид объекта с примером:",left:["Изъятые из оборота","Свободно обращаемые","Ограниченные в обороте"],right:["Ядерное оружие","Продукты питания","Оружие"],correct:[0,1,2],explain:"Разный правовой режим объектов."},
    {type:"case",q:"Кейс. Гражданин К. купил у знакомого охотничье ружьё без разрешения. Законна ли сделка?",answer:"Нет, незаконна. Охотничье ружьё — объект, ограниченный в обороте. Для его приобретения требуется специальное разрешение (лицензия) органов внутренних дел. Сделка без разрешения может быть признана недействительной, а стороны могут быть привлечены к ответственности."}
  ]
},
{
  id:"b2",
  section:"Раздел 3. Объекты гражданских прав",
  title:"Билет 2. Вещи как объекты гражданских прав и их классификация",
  subtitle:"Правовое значение деления вещей на виды.",
  body:`
    <h3>1. Понятие вещи</h3>
    <p><strong>Вещи</strong> — материальные предметы внешнего по отношению к человеку окружающего мира, предназначенные для удовлетворения потребностей людей.</p>

    <h3>2. Классификация вещей</h3>
    <h4>2.1. По оборотоспособности:</h4>
    <ul>
      <li>оборотоспособные;</li>
      <li>ограниченные в обороте;</li>
      <li>необоротоспособные (изъятые из оборота).</li>
    </ul>
    <h4>2.2. По связи с местом расположения (ст. 130 ГК):</h4>
    <ul>
      <li><strong>Движимые</strong> — любые перемещаемые в пространстве вещи, кроме приравненных к недвижимым.</li>
      <li><strong>Недвижимые</strong> — постоянно расположены в одном месте, перемещение невозможно или сопряжено с несоразмерным ущербом. Это всё, что прочно связано с землёй (здания, сооружения, земельные участки). К недвижимым приравниваются: предприятие как имущественный комплекс, воздушные и морские суда, суда внутреннего плавания, космические объекты. Права на недвижимость и сделки с ней подлежат государственной регистрации.</li>
    </ul>
    <h4>2.3. По критерию потребляемости:</h4>
    <ul>
      <li>непотребляемые — сохраняют качества после однократного использования;</li>
      <li>потребляемые — уничтожаются в процессе использования.</li>
    </ul>
    <h4>2.4. По критерию делимости:</h4>
    <ul>
      <li>делимые;</li>
      <li>неделимые.</li>
    </ul>
    <h4>2.5. По индивидуализированности:</h4>
    <ul>
      <li><strong>Индивидуально-определённые</strong> — наделены особыми, только им присущими признаками.</li>
      <li><strong>Определяемые родовыми признаками</strong> — обладают признаками, присущими всем вещам подобного рода.</li>
    </ul>
    <h4>2.6. Другие классификации:</h4>
    <ul>
      <li>одушевлённые (животные) и неодушевлённые;</li>
      <li>природные и созданные человеком;</li>
      <li>сложные и парные;</li>
      <li>главная вещь и принадлежность.</li>
    </ul>

    <h3>3. Плоды, продукция, доходы (ст. 136 ГК)</h3>
    <ul>
      <li><strong>Плоды</strong> — результаты органического, естественного развития вещи (плоды деревьев, приплод животных).</li>
      <li><strong>Продукция</strong> — результат производственного использования вещи (текстильные изделия).</li>
      <li><strong>Доходы</strong> — денежные и иные материальные поступления от участия вещи в гражданском обороте.</li>
    </ul>
    <p>По общему правилу плоды, продукция и доходы принадлежат лицу, использующему вещь на законном основании.</p>

    <h3>4. Понятие имущества</h3>
    <p>Термином «имущество» охватываются вещи или их совокупность, а также имущественные права и обязанности. Выделяют имущественные права: вещные (право собственности) и обязательственные (право требования).</p>

    <div class="card note">
      <div class="card-title">💡 Практическое значение</div>
      Деление вещей на движимые и недвижимые важно для регистрации сделок; на индивидуально-определённые и родовые — для возможности виндикации; на делимые и неделимые — для раздела имущества.
    </div>
  `,
  tasks:[
    {type:"single",q:"Какое имущество относится к недвижимому?",options:["Автомобиль","Земельный участок","Деньги","Мебель"],correct:1,explain:"Ст. 130 ГК: недвижимость — всё, что прочно связано с землёй, а также приравненные объекты."},
    {type:"multi",q:"Что приравнивается к недвижимым вещам?",options:["Воздушные суда","Морские суда","Предприятие как имущественный комплекс","Автомобили"],correct:[0,1,2],explain:"Автомобили — движимое имущество."},
    {type:"match",q:"Соотнесите вид вещи с примером:",left:["Делимая","Неделимая","Индивидуально-определённая","Родовая"],right:["Деньги","Автомобиль","Картина Репина","10 тонн пшеницы"],correct:[0,1,2,3],explain:"Разные критерии классификации вещей."},
    {type:"case",q:"Кейс. Гражданин продал 100 кг картофеля из своего урожая. Является ли это предпринимательской деятельностью?",answer:"Нет. Продажа урожая, выращенного на своём участке, не является предпринимательской деятельностью, если она носит разовый характер и не направлена на систематическое извлечение прибыли (п. 1 ст. 1 ГК). Однако систематическая продажа может быть признана предпринимательством, требующим регистрации."}
  ]
},
{
  id:"b3",
  section:"Раздел 3. Объекты гражданских прав",
  title:"Билет 3. Деньги и ценные бумаги как объекты гражданских прав",
  subtitle:"Особенности правового режима денег и ценных бумаг.",
  body:`
    <h3>1. Деньги (ст. 141 ГК)</h3>
    <p><strong>Деньги</strong> — специфический вид вещей. Деньги являются законным платёжным средством, обязательным к приёму по номинальной стоимости на всей территории страны. В Республике Беларусь таким средством является белорусский рубль.</p>
    <p>Особенности денег как объекта:</p>
    <ul>
      <li>родовые, делимые, потребляемые вещи;</li>
      <li>не имеют индивидуально-определённых признаков (кроме редких монет);</li>
      <li>являются всеобщим эквивалентом.</li>
    </ul>
    <p>Денежные обязательства исполняются в белорусских рублях. Расчёты в иностранной валюте допускаются в случаях, предусмотренных законодательством (ст. 141, 298 ГК, Закон о валютном регулировании).</p>

    <h3>2. Ценная бумага (ст. 143 ГК)</h3>
    <p><strong>Ценная бумага</strong> — документ, удостоверяющий с соблюдением установленной формы и (или) обязательных реквизитов имущественные права, осуществление или передача которых возможны только при его предъявлении.</p>

    <h3>3. Признаки ценной бумаги</h3>
    <ul>
      <li><strong>Тесная связь бумаги и воплощённого в ней права.</strong></li>
      <li><strong>Литеральность</strong> — письменное оформление (кроме бездокументарных).</li>
      <li><strong>Строго формальный характер</strong> — реквизиты, установленные законом.</li>
      <li><strong>Легитимация субъекта</strong> — указание на лицо, уполномоченное получить исполнение.</li>
      <li><strong>Необходимость предъявления</strong> для реализации права.</li>
      <li><strong>Абстрактный характер</strong> — право не зависит от причины возникновения.</li>
      <li><strong>Автономность</strong> права.</li>
    </ul>

    <h3>4. Классификация по способу легитимации</h3>
    <ul>
      <li><strong>На предъявителя</strong> — требовать исполнения может любой держатель.</li>
      <li><strong>Именная</strong> — содержит имя держателя, зарегистрированное у эмитента. Передаётся путём уступки права требования (цессии).</li>
      <li><strong>Ордерная</strong> — право переходит к новому владельцу путём совершения на самой бумаге передаточной надписи — индоссамента (вексель, чек).</li>
    </ul>

    <h3>5. Основные виды ценных бумаг</h3>
    <ul>
      <li><strong>Облигация</strong> — удостоверяет право держателя получить от эмитента номинальную стоимость и фиксированный процент.</li>
      <li><strong>Акция</strong> — удостоверяет право на получение части прибыли (дивиденда), на участие в управлении, на долю при ликвидации.</li>
      <li><strong>Вексель</strong> — ничем не обусловленное обязательство векселедателя выплатить определённую сумму (простой и переводной).</li>
      <li><strong>Чек</strong> — письменное распоряжение чекодателя банку выплатить указанную сумму предъявителю.</li>
      <li><strong>Приватизационные чеки</strong> («Жильё», «Имущество»).</li>
      <li><strong>Депозитный и сберегательный сертификаты.</strong></li>
      <li><strong>Банковская сберегательная книжка на предъявителя.</strong></li>
      <li><strong>Коносамент</strong> — товарораспорядительный документ.</li>
    </ul>

    <div class="card law">
      <div class="card-title">⚖️ Бездокументарные ценные бумаги</div>
      Оформляются с помощью средств электронно-вычислительной техники. К ним не применяется признак литеральности, но остальные признаки сохраняются.
    </div>
  `,

  section:"Раздел 3. Объекты гражданских прав",
  title:"Билет 4. Передача прав по ценным бумагам",

  body:`
    <h3>1. Способы передачи прав</h3>
    <p>Способ передачи прав по ценной бумаге зависит от способа легитимации:</p>
    <table>
      <tr><th>Вид ценной бумаги</th><th>Способ передачи</th></tr>
      <tr><td>На предъявителя</td><td>Вручение бумаги новому владельцу</td></tr>
      <tr><td>Именная</td><td>Уступка права требования (цессия) с уведомлением эмитента</td></tr>
      <tr><td>Ордерная</td><td>Передаточная надпись — индоссамент</td></tr>
    </table>

    <h3>2. Ценная бумага на предъявителя</h3>
    <p>Требовать реализации права может любой держатель. Передаётся простым вручением. Пример: сберегательная книжка на предъявителя, простой вексель на предъявителя.</p>

    <h3>3. Именная ценная бумага</h3>
    <p>Содержит имя держателя, зарегистрированное у эмитента. Только этот держатель вправе осуществить право. Передаётся путём уступки права требования (цессии). Эмитент должен быть уведомлён о переходе права. Пример: именная акция.</p>

    <h3>4. Ордерная ценная бумага</h3>
    <p>Право принадлежит названному в бумаге лицу, которое может передать его путём передаточной надписи — индоссамента.</p>
    <p>Виды индоссамента:</p>
    <ul>
      <li><strong>Полный</strong> — с указанием имени нового приобретателя.</li>
      <li><strong>Бланковый</strong> — без указания имени (бумага становится бумагой на предъявителя).</li>
      <li><strong>Препоручительный</strong> — поручает индоссату получить исполнение, но не передаёт право собственности.</li>
      <li><strong>Залоговый</strong> — передаёт право в залог.</li>
    </ul>

    <h3>5. Правовые последствия передачи</h3>
    <ul>
      <li>Все права переходят к новому владельцу в том же объёме.</li>
      <li>Обязанное лицо вправе выдвигать против нового владельца возражения, которые оно имело против первоначального.</li>
      <li>Передача ценной бумаги влечёт переход удостоверенного ею права в совокупности.</li>
    </ul>

    <div class="card note">
      <div class="card-title">💡 Бездокументарные ценные бумаги</div>
      Права по ним фиксируются в системе ведения реестра или у депозитария. Передача осуществляется путём обращения к регистратору (депозитарию), а не вручением документа.
    </div>

    {type:"case",q:"Кейс. Гражданин получил по наследству вексель, выданный на имя его отца. Как он может получить по нему деньги?",answer:"Вексель — ордерная ценная бумага. Наследник должен либо получить индоссамент от предыдущего владельца (если это возможно), либо подтвердить свои права через свидетельство о праве на наследство. Согласно вексельному законодательству, переход прав по векселю в порядке наследования оформляется на основании свидетельства о праве на наследство. Наследник обращается к векселедателю с требованием о платеже, предъявив вексель и документы о наследстве."}

  body:`
    <h3>1. Информация как объект</h3>
    <p>В ст. 128 ГК информация названа охраняемой. В условиях рыночной экономики информация приобретает качество товара и входит в гражданский оборот.</p>

    <h3>2. Виды охраняемой информации</h3>
    <p>ГК выделяет:</p>
    <ul>

      <li><strong>Коммерческую тайну</strong> — сведения, связанные с коммерческой деятельностью, доступ к которым ограничен в соответствии с законодательством.</li>

  section:"Раздел 3. Объекты гражданских прав",
  title:"Билет 6. Понятие и виды нематериальных благ",
  subtitle:"Личные неимущественные права, не связанные с имущественными.",
  body:`
    <h3>1. Понятие личных неимущественных прав</h3>
    <p><strong>Личные неимущественные права, не связанные с имущественными</strong>, являются объектами гражданского права. Они возникают по поводу нематериальных благ.</p>
    <p>ГК содержит примерный перечень важнейших нематериальных благ (ст. 151): жизнь и здоровье, достоинство, личная неприкосновенность, честь и доброе имя, деловая репутация, личная и семейная тайна.</p>
    <p>Законом также признаются: право на свободу передвижения, выбор места пребывания и жительства, право на национальную принадлежность, право гражданства, иные личные неимущественные права.</p>

    <h3>2. Признаки нематериальных благ</h3>
    <ul>
      <li>Лишены экономического содержания (неимущественные).</li>
      <li>Тесно связаны с личностью носителя, неотделимы от неё.</li>
      <li>Неотчуждаемы и непередаваемы любым способом.</li>
    </ul>

    <h3>3. Возникновение прав</h3>
    <ul>
      <li><strong>От рождения:</strong> жизнь, здоровье, личная неприкосновенность, неприкосновенность частной жизни, личная и семейная тайна, честь, доброе имя.</li>
      <li><strong>В силу акта законодательства:</strong> право свободного передвижения, право на имя, право авторства.</li>
    </ul>
    <p>Некоторые неимущественные права принадлежат и юридическим лицам (право на деловую репутацию, на наименование).</p>

    <h3>4. Классификация по направленности</h3>
    <ul>
      <li><strong>Права, направленные на индивидуализацию личности:</strong> право на имя, на честь, достоинство, деловую репутацию.</li>
      <li><strong>Права, обеспечивающие личную безопасность:</strong> право на жизнь, здоровье, выбор места жительства, благоприятную окружающую среду.</li>
      <li><strong>Права, обеспечивающие неприкосновенность частной жизни:</strong> неприкосновенность жилища, тайна переписки, невмешательство в личную жизнь.</li>
    </ul>

    <h3>5. Защита нематериальных благ</h3>
    <p>На требования о защите личных неимущественных прав исковая давность не распространяется. Основные способы защиты:</p>
    <ul>
      <li>признание права;</li>
      <li>пресечение действий, нарушающих право;</li>
      <li>компенсация морального вреда (ст. 152 ГК);</li>
      <li>опровержение сведений, порочащих честь, достоинство, деловую репутацию.</li>
    </ul>

    <div class="card note">
      <div class="card-title">💡 Моральный вред</div>
      Компенсация морального вреда осуществляется в денежной форме. Размер определяется судом с учётом характера страданий, степени вины нарушителя и иных обстоятельств.
    </div>

    {type:"case",q:"Кейс. Гражданин опоздал на самолёт из-за того, что его необоснованно задержала полиция. Он подал иск о компенсации морального вреда. Распространяется ли на такие требования исковая давность?",answer:"Нет, на требования о защите личных неимущественных прав и других нематериальных благ исковая давность не распространяется (ст. 208 ГК). Гражданин может требовать компенсации морального вреда в любое время, пока нарушение продолжается. Однако если требование связано с возмещением имущественного вреда, сроки могут применяться."}

{
  id:"b7",
  section:"Раздел 3. Объекты гражданских прав",
  title:"Билет 7. Гражданско-правовая защита чести, достоинства и деловой репутации",
  subtitle:"Способы защиты личных неимущественных прав.",
  body:`
    <h3>1. Понятие чести, достоинства, деловой репутации</h3>
    <ul>
      <li><strong>Честь</strong> — общественная оценка личности, её моральных качеств.</li>
      <li><strong>Достоинство</strong> — самооценка личности, осознание своих качеств.</li>
      <li><strong>Деловая репутация</strong> — оценка профессиональных качеств гражданина или юридического лица.</li>
    </ul>

    <h3>2. Основания для защиты (ст. 153 ГК)</h3>
    <p>Гражданин вправе требовать в суде опровержения сведений, порочащих его честь, достоинство или деловую репутацию, если распространивший такие сведения не докажет, что они соответствуют действительности.</p>
    <p>Условия для защиты:</p>
    <ul>
      <li>сведения распространены (сообщены третьим лицам);</li>
      <li>сведения не соответствуют действительности;</li>

const navEl=document.getElementById('nav');
const contentEl=document.getElementById('content');
const breadcrumbEl=document.getElementById('breadcrumb');
const progressTextEl=document.getElementById('progressText');
const progressFillEl=document.getElementById('progressFill');
let currentTicket=tickets[0].id;
const STORAGE_KEY='gp_progress_rz3_v1';
let progress=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');

function buildNav(){
  const sections={};
  tickets.forEach(t=>{if(!sections[t.section])sections[t.section]=[];sections[t.section].push(t);});
  let html='';
  Object.keys(sections).forEach(sec=>{
    html+=`<div class="nav-section"><div class="nav-section-title">${sec}</div><ul class="nav-list">`;
    sections[sec].forEach(t=>{
      const done=progress[t.id]?'<span class="check">✓</span>':'';
      html+=`<li><a href="#${t.id}" data-id="${t.id}">${done}<span>${t.title.replace(/^Билет \\d+\\.\\s*/,'')}</span></a></li>`;
    });
    html+='</ul></div>';
  });
  navEl.innerHTML=html;
  navEl.querySelectorAll('a').forEach(a=>{
    a.addEventListener('click',e=>{e.preventDefault();showTicket(a.dataset.id);document.getElementById('sidebar').classList.remove('open');});
  });
}
function showTicket(id){
  currentTicket=id;
  const t=tickets.find(x=>x.id===id);
  if(!t)return;
  breadcrumbEl.textContent=t.section+' · '+t.title.split('.')[0];
  contentEl.innerHTML=`
    <div class="ticket active">
      <h2>${t.title}</h2>
      <p class="subtitle">${t.subtitle}</p>
      ${t.body}
      <div class="tasks-header">📝 Задания для закрепления</div>
      <div id="tasks-${t.id}"></div>
      <div class="ticket-nav">
        ${prevTicketId(id)?`<button class="btn" onclick="showTicket('${prevTicketId(id)}')">← Предыдущий</button>`:'<span></span>'}
        <button class="btn btn-primary" onclick="markDone('${t.id}')">✓ Отметить как изученный</button>
        ${nextTicketId(id)?`<button class="btn" onclick="showTicket('${nextTicketId(id)}')">Следующий →</button>`:'<span></span>'}
      </div>
    </div>`;
  renderTasks(t);
  updateNavActive();
  window.scrollTo({top:0,behavior:'smooth'});
}
function prevTicketId(id){const i=tickets.findIndex(t=>t.id===id);return i>0?tickets[i-1].id:null;}
function nextTicketId(id){const i=tickets.findIndex(t=>t.id===id);return i<tickets.length-1?tickets[i+1].id:null;}
function updateNavActive(){navEl.querySelectorAll('a').forEach(a=>{a.classList.toggle('active',a.dataset.id===currentTicket);});}
function renderTasks(t){
  const container=document.getElementById('tasks-'+t.id);
  if(!container)return;
  let html='';
  t.tasks.forEach((task,idx)=>{
    html+=`<div class="task" id="task-${t.id}-${idx}"><div class="task-title">Задание ${idx+1}</div><div class="question">${task.q}</div>`;
    if(task.type==='single'){
      html+='<ul class="options">';
      task.options.forEach((opt,i)=>{html+=`<li><label><input type="radio" name="single-${t.id}-${idx}" value="${i}"> <span>${opt}</span></label></li>`;});
      html+='</ul>';
      html+=`<button class="btn btn-primary" onclick="checkSingle('${t.id}',${idx})">Проверить</button><div class="feedback" id="fb-${t.id}-${idx}"></div>`;
    }else if(task.type==='multi'){
      html+='<ul class="options">';
      task.options.forEach((opt,i)=>{html+=`<li><label><input type="checkbox" name="multi-${t.id}-${idx}" value="${i}"> <span>${opt}</span></label></li>`;});
      html+='</ul>';
      html+=`<button class="btn btn-primary" onclick="checkMulti('${t.id}',${idx})">Проверить</button><div class="feedback" id="fb-${t.id}-${idx}"></div>`;
    }else if(task.type==='match'){
      html+='<div class="match-grid">';
      task.left.forEach((left,i)=>{
        html+=`<div class="match-item left">${left}</div><div class="match-item"><select id="match-${t.id}-${idx}-${i}"><option value="">— выберите —</option>`;
        task.right.forEach((r,j)=>{html+=`<option value="${j}">${r}</option>`;});
        html+='</select></div>';
      });
      html+='</div>';
      html+=`<button class="btn btn-primary" onclick="checkMatch('${t.id}',${idx})">Проверить</button><div class="feedback" id="fb-${t.id}-${idx}"></div>`;
    }else if(task.type==='case'){
      html+=`<textarea placeholder="Напишите ответ..." id="case-${t.id}-${idx}"></textarea>`;
      html+=`<button class="reveal-btn" onclick="toggleReveal('${t.id}',${idx})">👁 Показать образец</button><div class="reveal-content" id="reveal-${t.id}-${idx}"><strong>Образец:</strong><br>${task.answer}</div>`;
    }
    html+='</div>';
  });
  container.innerHTML=html;
}
function checkSingle(tid,idx){
  const t=tickets.find(x=>x.id===tid);const task=t.tasks[idx];
  const selected=document.querySelector(`input[name="single-${tid}-${idx}"]:checked`);
  const fb=document.getElementById(`fb-${tid}-${idx}`);
  const labels=document.querySelectorAll(`#task-${tid}-${idx} .options label`);
  labels.forEach((l,i)=>{l.classList.remove('correct','wrong');if(i===task.correct)l.classList.add('correct');});
  if(!selected){fb.className='feedback show bad';fb.innerHTML='Выберите вариант.';return;}
  const val=parseInt(selected.value);
  if(val===task.correct){fb.className='feedback show ok';fb.innerHTML='✅ Правильно! <span class="explain">'+task.explain+'</span>';}
  else{selected.parentElement.classList.add('wrong');fb.className='feedback show bad';fb.innerHTML='❌ Неправильно. <span class="explain">'+task.explain+'</span>';}
}
function checkMulti(tid,idx){
  const t=tickets.find(x=>x.id===tid);const task=t.tasks[idx];
  const selected=Array.from(document.querySelectorAll(`input[name="multi-${tid}-${idx}"]:checked`)).map(c=>parseInt(c.value));
  const fb=document.getElementById(`fb-${tid}-${idx}`);
  const labels=document.querySelectorAll(`#task-${tid}-${idx} .options label`);
  labels.forEach((l,i)=>{l.classList.remove('correct','wrong');if(task.correct.includes(i))l.classList.add('correct');if(selected.includes(i)&&!task.correct.includes(i))l.classList.add('wrong');});
  const ok=selected.length===task.correct.length&&selected.every(v=>task.correct.includes(v));
  if(ok){fb.className='feedback show ok';fb.innerHTML='✅ Правильно! <span class="explain">'+task.explain+'</span>';}
  else{fb.className='feedback show bad';fb.innerHTML='❌ Неправильно. <span class="explain">'+task.explain+'</span>';}
}
function checkMatch(tid,idx){
  const t=tickets.find(x=>x.id===tid);const task=t.tasks[idx];
  const fb=document.getElementById(`fb-${tid}-${idx}`);
  let ok=true;
  task.left.forEach((_,i)=>{const sel=document.getElementById(`match-${tid}-${idx}-${i}`);if(parseInt(sel.value)!==task.correct[i])ok=false;});
  if(ok){fb.className='feedback show ok';fb.innerHTML='✅ Всё верно! <span class="explain">'+task.explain+'</span>';}
  else{fb.className='feedback show bad';fb.innerHTML='❌ Есть ошибки. <span class="explain">'+task.explain+'</span>';}
}
function toggleReveal(tid,idx){document.getElementById(`reveal-${tid}-${idx}`).classList.toggle('show');}
function markDone(id){progress[id]=true;localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));buildNav();updateNavActive();updateProgress();const next=nextTicketId(id);if(next)setTimeout(()=>showTicket(next),300);}
function updateProgress(){const done=Object.keys(progress).length;const total=tickets.length;progressTextEl.textContent=`${done} / ${total}`;progressFillEl.style.width=(done/total*100)+'%';}
function resetProgress(){if(confirm('Сбросить прогресс?')){progress={};localStorage.removeItem(STORAGE_KEY);buildNav();updateNavActive();updateProgress();}}
function toggleTheme(){const html=document.documentElement;const isDark=html.getAttribute('data-theme')==='dark';html.setAttribute('data-theme',isDark?'light':'dark');localStorage.setItem('gp_theme',isDark?'light':'dark');document.getElementById('themeBtn').textContent=isDark?'🌙 Тема':'☀️ Тема';}
document.getElementById('searchBox').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();navEl.querySelectorAll('a').forEach(a=>{const t=tickets.find(x=>x.id===a.dataset.id);const m=!q||t.title.toLowerCase().includes(q)||t.subtitle.toLowerCase().includes(q)||t.body.toLowerCase().includes(q);a.parentElement.style.display=m?'':'none';});navEl.querySelectorAll('.nav-section').forEach(sec=>{const v=Array.from(sec.querySelectorAll('li')).some(li=>li.style.display!=='none');sec.style.display=v?'':'none';});});
(function init(){const savedTheme=localStorage.getItem('gp_theme');if(savedTheme==='dark'){document.documentElement.setAttribute('data-theme','dark');document.getElementById('themeBtn').textContent='☀️ Тема';}buildNav();showTicket(currentTicket);updateProgress();})();
</script>
</body>
</html>
