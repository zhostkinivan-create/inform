<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Раздел 2. Субъекты гражданского права</title>
<style>
  :root{--bg:#f5f7fa;--card:#fff;--text:#1a2332;--muted:#5a6a80;--accent:#1e5a96;--accent-hover:#164a7d;--border:#d8e0ea;--success:#1e7d4e;--error:#b03a3a;--warning:#a8761f;--shadow:0 2px 8px rgba(0,0,0,.06)}
  [data-theme="dark"]{--bg:#141a24;--card:#1d2532;--text:#e6ecf3;--muted:#93a3b8;--accent:#4a8fd1;--accent-hover:#6aa7e0;--border:#2c3a4d;--success:#4caf7d;--error:#e07a7a;--warning:#d4a548;--shadow:0 2px 8px rgba(0,0,0,.3)}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;transition:background .3s,color .3s}
  .layout{display:flex;min-height:100vh}
  .sidebar{width:320px;background:var(--card);border-right:1px solid var(--border);padding:20px 16px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;transition:transform .3s;z-index:100}
  .sidebar-header{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
  .sidebar-header h1{font-size:17px;color:var(--accent);margin-bottom:6px}
  .sidebar-header p{font-size:12px;color:var(--muted)}
  .search-box{width:100%;padding:8px 12px;margin-bottom:14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px}
  .search-box:focus{outline:2px solid var(--accent)}
  .progress-wrap{margin-bottom:14px}
  .progress-label{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
  .progress-bar-bg{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
  .progress-bar-fill{height:100%;background:var(--accent);width:0%;transition:width .4s}
  .nav-section{margin-bottom:6px}
  .nav-section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:10px 8px 6px;display:flex;justify-content:space-between;align-items:center}
  .nav-list{list-style:none}
  .nav-list li a{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:13.5px;color:var(--text);text-decoration:none;border-radius:6px;margin-bottom:2px;transition:background .15s}
  .nav-list li a:hover{background:var(--bg);color:var(--accent)}
  .nav-list li a.active{background:var(--accent);color:#fff}
  .nav-list li a .check{color:var(--success);font-weight:bold}
  .nav-list li a.active .check{color:#c8f5d8}
  .main{flex:1;margin-left:320px;padding:32px 40px 80px;max-width:900px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px;flex-wrap:wrap}
  .topbar .breadcrumb{font-size:13px;color:var(--muted)}
  .btn{padding:8px 14px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;cursor:pointer;font-size:13.5px;transition:all .2s;text-decoration:none;display:inline-block}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-primary:hover{background:var(--accent-hover);color:#fff}
  .ticket{display:none;animation:fade .3s}
  .ticket.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .ticket h2{font-size:24px;color:var(--accent);margin-bottom:6px;line-height:1.3}
  .ticket .subtitle{font-size:14px;color:var(--muted);margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid var(--border)}
  .ticket h3{font-size:18px;margin:26px 0 12px;color:var(--text);border-left:4px solid var(--accent);padding-left:10px}
  .ticket h4{font-size:15.5px;margin:18px 0 8px;color:var(--accent)}
  .ticket p{margin-bottom:12px}
  .ticket ul,.ticket ol{margin:0 0 14px 24px}
  .ticket li{margin-bottom:6px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin:16px 0;box-shadow:var(--shadow)}
  .card.note{border-left:4px solid var(--accent)}
  .card.warn{border-left:4px solid var(--warning);background:rgba(168,118,31,.06)}
  .card.law{border-left:4px solid var(--success);background:rgba(30,125,78,.05)}
  .card-title{font-weight:700;margin-bottom:8px;font-size:14.5px}
  .card.note .card-title{color:var(--accent)}
  .card.warn .card-title{color:var(--warning)}
  .card.law .card-title{color:var(--success)}
  table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}
  th,td{border:1px solid var(--border);padding:9px 12px;text-align:left;vertical-align:top}
  th{background:var(--bg);font-weight:700}
  .tasks-header{margin:34px 0 16px;padding:12px 18px;background:linear-gradient(90deg,var(--accent),var(--accent-hover));color:#fff;border-radius:10px;font-size:17px;font-weight:700}
  .task{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .task-title{font-weight:700;margin-bottom:10px;color:var(--accent);font-size:15px}
  .task .question{margin-bottom:12px}
  .options{list-style:none;margin:0 0 12px 0}
  .options li{margin-bottom:6px}
  .options label{display:flex;gap:9px;align-items:flex-start;padding:8px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;font-size:14px}
  .options label:hover{border-color:var(--accent);background:var(--bg)}
  .options input{margin-top:4px;accent-color:var(--accent)}
  .options label.correct{border-color:var(--success);background:rgba(30,125,78,.1)}
  .options label.wrong{border-color:var(--error);background:rgba(176,58,58,.1)}
  .feedback{margin-top:10px;font-size:14px;padding:10px 14px;border-radius:8px;display:none}
  .feedback.show{display:block}
  .feedback.ok{background:rgba(30,125,78,.12);color:var(--success);border-left:3px solid var(--success)}
  .feedback.bad{background:rgba(176,58,58,.1);color:var(--error);border-left:3px solid var(--error)}
  .feedback .explain{display:block;margin-top:6px;color:var(--text);font-size:13.5px}
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .match-item{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px}
  .match-item.left{background:var(--bg);font-weight:600}
  .match-item select{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:14px}
  textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;resize:vertical;margin-bottom:10px}
  textarea:focus{outline:2px solid var(--accent)}
  .reveal-btn{background:var(--bg);border:1px dashed var(--accent);color:var(--accent);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;margin-top:6px}
  .reveal-btn:hover{background:var(--accent);color:#fff}
  .reveal-content{display:none;margin-top:10px;padding:12px 16px;background:var(--bg);border-radius:8px;border-left:3px solid var(--accent);font-size:14px}
  .reveal-content.show{display:block}
  .ticket-nav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--border)}
  .ticket-nav .btn{flex:1;text-align:center}
  .menu-toggle{display:none;position:fixed;bottom:20px;right:20px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:200}
  @media (max-width:900px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}.main{margin-left:0;padding:20px 16px 90px}.menu-toggle{display:block}.match-grid{grid-template-columns:1fr}}
  .footer{margin-top:50px;padding-top:20px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>📘 Раздел 2</h1>
      <p>Субъекты гражданского права</p>
    </div>
    <input type="text" class="search-box" id="searchBox" placeholder="🔍 Поиск...">
    <div class="progress-wrap">
      <div class="progress-label"><span>Прогресс</span><span id="progressText">0 / 20</span></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    </div>
    <nav id="nav"></nav>
    <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn" onclick="toggleTheme()" id="themeBtn">🌙 Тема</button>
      <button class="btn" onclick="resetProgress()">↺ Сброс</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="breadcrumb" id="breadcrumb">Раздел 2 · Билет 1</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <a href="index.html" class="btn">← Раздел 1</a>
        <a href="razdel3.html" class="btn">Раздел 3 →</a>
      </div>
    </div>
    <div id="content"></div>
    <div class="footer">© Учебный материал по курсу «Гражданское право (Общая часть)».<br>ГК Республики Беларусь (по состоянию на 2026 г.).</div>
  </main>
  <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
</div>

<script>
/* =========================================================
   БИЛЕТЫ РАЗДЕЛА 2 (20 билетов)
   ========================================================= */
const tickets = [
  {
    id: "b1",
    section: "Раздел 2. Субъекты гражданского права",
    title: "Билет 1. Понятие и содержание правосубъектности",
    subtitle: "Правоспособность, дееспособность, деликтоспособность.",
    body: `
      <h3>1. Понятие правосубъектности</h3>
      <p><strong>Гражданская правосубъектность</strong> — социально-правовая способность лица быть участником гражданских правоотношений. Это обобщающая категория, которая включает три элемента:</p>
      <ul>
        <li><strong>Правоспособность</strong> — способность иметь гражданские права и нести обязанности.</li>
        <li><strong>Дееспособность</strong> — способность своими действиями приобретать и осуществлять гражданские права, создавать для себя гражданские обязанности и исполнять их.</li>
        <li><strong>Деликтоспособность</strong> — способность нести ответственность за гражданское правонарушение.</li>
      </ul>

      <h3>2. Правоспособность</h3>
      <p>Правоспособность — способность иметь гражданские права и нести обязанности (ст. 16 ГК).</p>
      <p>Характерные черты правоспособности граждан:</p>
      <ul>
        <li><strong>Гарантированность (реальность)</strong> — признаётся за всеми гражданами РБ.</li>
        <li><strong>Равенство</strong> — все обладают равной правоспособностью.</li>
        <li><strong>Неотчуждаемость</strong> — гражданин не может отказаться от правоспособности или ограничить её. Сделки, направленные на ограничение правоспособности, ничтожны.</li>
        <li><strong>Неразрывная связь прав и обязанностей.</strong></li>
      </ul>
      <p>Возникает с момента рождения, прекращается смертью. У юридических лиц — с момента государственной регистрации и до ликвидации.</p>

      <h3>3. Дееспособность</h3>
      <p>Дееспособность (ст. 20 ГК) — способность гражданина своими действиями приобретать и осуществлять гражданские права, создавать для себя обязанности и исполнять их. Дееспособность неотчуждаема и не может быть ограничена по воле гражданина.</p>

      <h3>4. Деликтоспособность</h3>
      <p>Деликтоспособность — способность лица нести ответственность за причинённый вред. У физических лиц возникает с 14 лет (ст. 943 ГК — частичная), в полном объёме — с 18 лет. У юридических лиц — с момента создания.</p>

      <h3>5. Виды правосубъектности</h3>
      <ul>
        <li><strong>Общая</strong> — у физических лиц (могут иметь любые права, кроме запрещённых законом).</li>
        <li><strong>Специальная</strong> — у юридических лиц (объём прав определяется целями деятельности, указанными в учредительных документах).</li>
      </ul>

      <div class="card law">
        <div class="card-title">⚖️ Статья 16 ГК</div>
        Гражданская правоспособность признаётся в равной мере за всеми гражданами. Граждане могут иметь имущество на праве собственности, наследовать и завещать, заниматься предпринимательской деятельностью, совершать сделки, иметь иные права.
      </div>
    `,
    tasks: [
      {type:"single",q:"С какого момента возникает гражданская правоспособность физического лица?",options:["С 14 лет","С 18 лет","С момента рождения","С момента регистрации"],correct:2,explain:"Правоспособность возникает с рождения и прекращается смертью (ст. 16 ГК)."},
      {type:"multi",q:"Что входит в содержание правосубъектности?",options:["Правоспособность","Дееспособность","Деликтоспособность","Правопреемство"],correct:[0,1,2],explain:"Правосубъектность = правоспособность + дееспособность + деликтоспособность."},
      {type:"match",q:"Соотнесите элемент с его определением:",left:["Правоспособность","Дееспособность","Деликтоспособность"],right:["Способность иметь права и обязанности","Способность своими действиями приобретать права и обязанности","Способность нести ответственность за правонарушение"],correct:[0,1,2],explain:"Классическая триада."},
      {type:"case",q:"Кейс. Гражданин Н. подписал договор, по которому обязался отказаться от права на защиту своей чести и достоинства. Действителен ли такой договор?",answer:"Нет, договор ничтожен. Согласно ст. 16 ГК, сделки, направленные на ограничение правоспособности, ничтожны. Право на защиту чести и достоинства — неотчуждаемое личное неимущественное право, от которого нельзя отказаться."}
    ]
  },
  {
    id: "b2",
    section: "Раздел 2. Субъекты гражданского права",
    title: "Билет 2. Граждане как субъекты гражданского права",
    subtitle: "Граждане РБ, иностранные граждане, лица без гражданства.",
    body: `
      <h3>1. Понятие физического лица</h3>
      <p><strong>Физическое лицо</strong> — правовое положение человека как субъекта частного права. Термин «гражданин» употребляется, когда нужно установить положение человека в конкретном государстве.</p>
      <ul>
        <li><strong>Граждане РБ</strong> — лица, имеющие гражданство Республики Беларусь.</li>
        <li><strong>Иностранные граждане</strong> — лица, имеющие гражданство другого государства.</li>
        <li><strong>Лица без гражданства (апатриды)</strong> — лица, не имеющие доказательств принадлежности к гражданству какого-либо государства.</li>
      </ul>

      <h3>2. Правовое положение иностранцев</h3>
      <p>Иностранные граждане и лица без гражданства пользуются в Республике Беларусь гражданской правоспособностью наравне с гражданами Республики Беларусь, если иное не предусмотрено законодательными актами (ст. 1102 ГК).</p>
      <p>Ограничения могут устанавливаться для защиты национальной безопасности, общественного порядка, здоровья населения.</p>

      <h3>3. Гражданская правоспособность</h3>
      <p>Содержание правоспособности (ст. 17 ГК): граждане могут иметь имущество на праве собственности, наследовать и завещать его, заниматься предпринимательской и иной не запрещённой деятельностью, совершать сделки, иметь иные права.</p>

      <h3>4. Гражданская дееспособность</h3>
      <p>Объём дееспособности зависит от возраста (см. отдельный билет). Полная дееспособность наступает с 18 лет. Возможна эмансипация с 16 лет.</p>

      <h3>5. Ограничение правоспособности</h3>
      <p>В виде исключения допускается ограничение правоспособности по приговору суда (например, лишение права занимать определённые должности на срок от 1 до 5 лет) или в случаях, предусмотренных ГК (например, ограничение права заниматься предпринимательской деятельностью на срок до 3 лет — ст. 31 ГК).</p>

      <div class="card law">
        <div class="card-title">⚖️ Ключевые статьи</div>
        Ст. 16 — правоспособность; ст. 17 — содержание правоспособности; ст. 20 — дееспособность; ст. 1102 — правовое положение иностранцев.
      </div>
    `,
    tasks: [
      {type:"single",q:"В каком объёме иностранные граждане пользуются гражданской правоспособностью в РБ?",options:["В меньшем, чем граждане РБ","Наравне с гражданами РБ, если иное не предусмотрено законом","Только по международным договорам","Не пользуются"],correct:1,explain:"Ст. 1102 ГК: иностранцы и апатриды имеют гражданскую правоспособность наравне с гражданами РБ."},
      {type:"multi",q:"Кто относится к физическим лицам как субъектам гражданского права?",options:["Граждане РБ","Иностранные граждане","Лица без гражданства","Юридические лица"],correct:[0,1,2],explain:"Юридические лица — отдельная категория субъектов."},
      {type:"case",q:"Кейс. Гражданин Германии приехал в Беларусь и решил открыть здесь ИП. Возможно ли это? Какие ограничения?",answer:"Да, иностранный гражданин вправе заниматься предпринимательской деятельностью в РБ (ст. 1102 ГК), но для этого требуется специальное разрешение на постоянное проживание или вид на жительство и государственная регистрация в качестве ИП (Положение о регистрации, Декрет № 1 от 16.01.2009). Ограничения могут касаться отдельных видов деятельности, требующих лицензии."}
    ]
  },
  {
    id: "b3",
    section: "Раздел 2. Субъекты гражданского права",
    title: "Билет 3. Объём дееспособности малолетних и несовершеннолетних. Эмансипация",
    subtitle: "Частичная дееспособность по возрастным категориям.",
    body: `
      <h3>1. Полная дееспособность</h3>
      <p>Возникает с наступлением совершеннолетия, т.е. по достижении <strong>18 лет</strong>. Возможны исключения: вступление в брак до 18 лет и эмансипация.</p>

      <h3>2. Дееспособность малолетних (до 14 лет)</h3>
      <p>Малолетние (ст. 27 ГК) вправе самостоятельно совершать:</p>
      <ul>
        <li><strong>Мелкие бытовые сделки</strong> — направлены на удовлетворение личных нужд, незначительны по сумме, момент заключения совпадает с моментом исполнения.</li>
        <li><strong>Сделки, направленные на безвозмездное получение выгод</strong>, не требующие нотариального удостоверения или государственной регистрации.</li>
        <li><strong>Сделки по распоряжению средствами</strong>, предоставленными законными представителями или третьими лицами для целевого или свободного использования.</li>
      </ul>
      <p>От имени малолетних в гражданском обороте выступают их законные представители — родители (усыновители) или опекуны.</p>

      <h3>3. Дееспособность несовершеннолетних (14–18 лет)</h3>
      <p>Самостоятельно без согласия законных представителей такие несовершеннолетние могут (ст. 25 ГК):</p>
      <ul>
        <li>распоряжаться своим заработком или стипендией;</li>
        <li>вносить вклады в кредитные учреждения и распоряжаться ими;</li>
        <li>осуществлять права автора произведения науки, литературы или искусства;</li>
        <li>совершать мелкие бытовые сделки;</li>
        <li>по достижении 16 лет быть членом кооператива.</li>
      </ul>
      <p>Другие сделки — с письменного согласия законных представителей.</p>
      <p><strong>Деликтоспособность:</strong> с 14 лет несовершеннолетние самостоятельно отвечают за причинённый вред. Если у них нет доходов или имущества для возмещения, вред возмещается их родителями (попечителями) субсидиарно.</p>

      <h3>4. Эмансипация (ст. 26 ГК)</h3>
      <p>Несовершеннолетний, достигший <strong>16 лет</strong>, может быть объявлен полностью дееспособным, если он:</p>
      <ul>
        <li>работает по трудовому договору (контракту);</li>
        <li>с согласия родителей, попечителей, усыновителя занимается предпринимательской деятельностью.</li>
      </ul>
      <p><strong>Порядок:</strong> решение принимается органом опеки и попечительства с согласия обоих родителей (усыновителей, попечителя) либо, при отсутствии согласия — судом.</p>

        <li><strong>Присоединение</strong> — одно юридическое лицо присоединяется к другому. К последнему переходят права и обязанности присоединённого по передаточному акту.</li>
        <li><strong>Разделение</strong> — юридическое лицо делится на несколько новых. Права и обязанности переходят по разделительному балансу.</li>

    body: `
      <h3>1. Понятие ликвидации</h3>
      <p><strong>Ликвидация</strong> — прекращение юридического лица без перехода прав и обязанностей к другим лицам (в отличие от реорганизации).</p>

      <h3>2. Основания ликвидации</h3>
      <p>Ликвидация может быть <strong>добровольной</strong> и <strong>принудительной</strong>.</p>
      <p><strong>По решению учредителей (участников):</strong></p>
      <ul>
        <li>истечение срока, на который создано юридическое лицо;</li>
        <li>достижение цели, ради которой оно создано;</li>
        <li>признание судом недействительной регистрации в связи с неустранимыми нарушениями.</li>
      </ul>
      <p><strong>По решению хозяйственного суда:</strong></p>
      <ul>
        <li>непринятие решения о ликвидации при истечении срока/достижении цели;</li>
        <li>уменьшение стоимости чистых активов ниже минимального размера уставного фонда;</li>
        <li>осуществление деятельности без лицензии либо запрещённой деятельности;</li>
        <li>неоднократные или грубые нарушения законодательства;</li>
        <li>систематическое осуществление деятельности, противоречащей уставным целям.</li>
      </ul>
      <p><strong>По решению регистрирующего органа:</strong></p>
      <ul>
        <li>неосуществление предпринимательской деятельности 12 месяцев подряд без уведомления налогового органа;</li>
        <li>внесение налоговым органом представления о ликвидации в связи с признанием задолженности безнадёжным долгом.</li>
      </ul>

      <h3>3. Порядок ликвидации</h3>
      <ol>
        <li>Выявление кредиторов ликвидируемого юридического лица.</li>
        <li>Составление промежуточного ликвидационного баланса.</li>
        <li>Продажа имущества ликвидируемого юридического лица.</li>
        <li>Выплата денежных сумм кредиторам в порядке очерёдности.</li>
      </ol>

      <h3>4. Очерёдность удовлетворения требований</h3>
      <ol>
        <li>Требования граждан о возмещении вреда, причинённого жизни или здоровью.</li>
        <li>Выплата выходных пособий, оплата труда, выплата вознаграждений по авторским договорам.</li>
        <li>Обязательные платежи в бюджет и внебюджетные фонды.</li>
        <li>Требования, обеспеченные залогом имущества ликвидируемого юридического лица.</li>
        <li>Все остальные кредиторы.</li>
      </ol>

      <h3>5. Завершение ликвидации</h3>
      <p>Ликвидация считается завершённой, а юридическое лицо прекратившим существование после внесения записи в Единый государственный регистр.</p>

      <div class="card warn">

      </div>
    `,

      <p>Полными товарищами могут быть ИП и (или) коммерческие организации. Участник может быть полным товарищем только в одном товариществе.</p>

      <h3>1. Унитарное предприятие (ст. 113 ГК)</h3>
      <p><strong>Унитарное предприятие</strong> — коммерческая организация, не наделённая правом собственности на закреплённое за ней собственником имущество. Имущество унитарного предприятия является неделимым и не может быть распределено по вкладам (долям, паям), в том числе между работниками.</p>

      <p>Фирменное наименование должно содержать указание на форму собственности.</p>
      <p>Единственный учредительный документ — <strong>устав</strong>.</p>

        <li><strong>На праве оперативного управления (казённые)</strong> — распоряжаются имуществом только с согласия собственника.</li>

      <h3>3. Ответственность унитарного предприятия</h3>
      <p>Унитарное предприятие отвечает по своим обязательствам всем принадлежащим ему имуществом. Собственник не отвечает по долгам предприятия, кроме случаев, предусмотренных ГК (например, при банкротстве, вызванном указаниями собственника).</p>

      <h3>4. Дочерние предприятия (ст. 114 ГК)</h3>
      <p><strong>Дочернее предприятие</strong> — унитарное предприятие, созданное другим унитарным предприятием (или иным субъектом) путём передачи ему части имущества в хозяйственное ведение.</p>
      <p>Учредитель утверждает устав дочернего предприятия и назначает руководителя. Ответственность по обязательствам дочернего предприятия несёт учредитель, если банкротство вызвано его указаниями.</p>

      <h3>5. Дочерние и зависимые хозяйственные общества</h3>
      <ul>

        <li><strong>Зависимое общество</strong> (ст. 106 ГК) — общество, в котором другое общество имеет более 20% голосующих акций (долей).</li>
      </ul>

      <h3>6. Филиалы и представительства</h3>
      <p><strong>Филиал</strong> — обособленное подразделение, осуществляющее все или часть функций юридического лица, включая функции представительства.</p>
      <p><strong>Представительство</strong> — обособленное подразделение, представляющее интересы юридического лица и осуществляющее их защиту.</p>

const navEl=document.getElementById('nav');
const contentEl=document.getElementById('content');
const breadcrumbEl=document.getElementById('breadcrumb');
const progressTextEl=document.getElementById('progressText');
const progressFillEl=document.getElementById('progressFill');
let currentTicket=tickets[0].id;
const STORAGE_KEY='gp_progress_rz2_v1';
let progress=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');

function buildNav(){
  const sections={};
  tickets.forEach(t=>{if(!sections[t.section])sections[t.section]=[];sections[t.section].push(t);});
  let html='';
  Object.keys(sections).forEach(sec=>{
    html+=`<div class="nav-section"><div class="nav-section-title">${sec}</div><ul class="nav-list">`;
    sections[sec].forEach(t=>{
      const done=progress[t.id]?'<span class="check">✓</span>':'';
      html+=`<li><a href="#${t.id}" data-id="${t.id}">${done}<span>${t.title.replace(/^Билет \\d+\\.\\s*/,'')}</span></a></li>`;
    });
    html+=`</ul></div>`;
  });
  navEl.innerHTML=html;
  navEl.querySelectorAll('a').forEach(a=>{
    a.addEventListener('click',e=>{e.preventDefault();showTicket(a.dataset.id);document.getElementById('sidebar').classList.remove('open');});
  });
}

function showTicket(id){
  currentTicket=id;
  const t=tickets.find(x=>x.id===id);
  if(!t)return;
  breadcrumbEl.textContent=t.section+' · '+t.title.split('.')[0];
  contentEl.innerHTML=`
    <div class="ticket active">
      <h2>${t.title}</h2>
      <p class="subtitle">${t.subtitle}</p>
      ${t.body}
      <div class="tasks-header">📝 Задания для закрепления</div>
      <div id="tasks-${t.id}"></div>
      <div class="ticket-nav">
        ${prevTicketId(id)?`<button class="btn" onclick="showTicket('${prevTicketId(id)}')">← Предыдущий</button>`:'<span></span>'}
        <button class="btn btn-primary" onclick="markDone('${t.id}')">✓ Отметить как изученный</button>
        ${nextTicketId(id)?`<button class="btn" onclick="showTicket('${nextTicketId(id)}')">Следующий →</button>`:'<span></span>'}
      </div>
    </div>`;
  renderTasks(t);
  updateNavActive();
  window.scrollTo({top:0,behavior:'smooth'});
}
function prevTicketId(id){const i=tickets.findIndex(t=>t.id===id);return i>0?tickets[i-1].id:null;}
function nextTicketId(id){const i=tickets.findIndex(t=>t.id===id);return i<tickets.length-1?tickets[i+1].id:null;}
function updateNavActive(){navEl.querySelectorAll('a').forEach(a=>{a.classList.toggle('active',a.dataset.id===currentTicket);});}

function renderTasks(t){
  const container=document.getElementById('tasks-'+t.id);
  if(!container)return;
  let html='';
  t.tasks.forEach((task,idx)=>{
    html+=`<div class="task" id="task-${t.id}-${idx}">`;
    html+=`<div class="task-title">Задание ${idx+1}</div>`;
    html+=`<div class="question">${task.q}</div>`;
    if(task.type==='single'){
      html+='<ul class="options">';
      task.options.forEach((opt,i)=>{html+=`<li><label><input type="radio" name="single-${t.id}-${idx}" value="${i}"> <span>${opt}</span></label></li>`;});
      html+='</ul>';
      html+=`<button class="btn btn-primary" onclick="checkSingle('${t.id}',${idx})">Проверить</button>`;
      html+=`<div class="feedback" id="fb-${t.id}-${idx}"></div>`;
    }else if(task.type==='multi'){
      html+='<ul class="options">';
      task.options.forEach((opt,i)=>{html+=`<li><label><input type="checkbox" name="multi-${t.id}-${idx}" value="${i}"> <span>${opt}</span></label></li>`;});
      html+='</ul>';
      html+=`<button class="btn btn-primary" onclick="checkMulti('${t.id}',${idx})">Проверить</button>`;
      html+=`<div class="feedback" id="fb-${t.id}-${idx}"></div>`;
    }else if(task.type==='match'){
      html+='<div class="match-grid">';
      task.left.forEach((left,i)=>{
        html+=`<div class="match-item left">${left}</div>`;
        html+=`<div class="match-item"><select id="match-${t.id}-${idx}-${i}"><option value="">— выберите —</option>`;
        task.right.forEach((r,j)=>{html+=`<option value="${j}">${r}</option>`;});
        html+='</select></div>';
      });
      html+='</div>';
      html+=`<button class="btn btn-primary" onclick="checkMatch('${t.id}',${idx})">Проверить</button>`;
      html+=`<div class="feedback" id="fb-${t.id}-${idx}"></div>`;
    }else if(task.type==='case'){
      html+=`<textarea placeholder="Напишите свой ответ..." id="case-${t.id}-${idx}"></textarea>`;
      html+=`<button class="reveal-btn" onclick="toggleReveal('${t.id}',${idx})">👁 Показать образец ответа</button>`;
      html+=`<div class="reveal-content" id="reveal-${t.id}-${idx}"><strong>Образец:</strong><br>${task.answer}</div>`;
    }
    html+='</div>';
  });
  container.innerHTML=html;
}

function checkSingle(tid,idx){
  const t=tickets.find(x=>x.id===tid);const task=t.tasks[idx];
  const selected=document.querySelector(`input[name="single-${tid}-${idx}"]:checked`);
  const fb=document.getElementById(`fb-${tid}-${idx}`);
  const labels=document.querySelectorAll(`#task-${tid}-${idx} .options label`);
  labels.forEach((l,i)=>{l.classList.remove('correct','wrong');if(i===task.correct)l.classList.add('correct');});
  if(!selected){fb.className='feedback show bad';fb.innerHTML='Выберите вариант.';return;}
  const val=parseInt(selected.value);
  if(val===task.correct){fb.className='feedback show ok';fb.innerHTML='✅ Правильно! <span class="explain">'+task.explain+'</span>';}
  else{selected.parentElement.classList.add('wrong');fb.className='feedback show bad';fb.innerHTML='❌ Неправильно. <span class="explain">'+task.explain+'</span>';}
}
function checkMulti(tid,idx){
  const t=tickets.find(x=>x.id===tid);const task=t.tasks[idx];
  const selected=Array.from(document.querySelectorAll(`input[name="multi-${tid}-${idx}"]:checked`)).map(c=>parseInt(c.value));
  const fb=document.getElementById(`fb-${tid}-${idx}`);
  const labels=document.querySelectorAll(`#task-${tid}-${idx} .options label`);
  labels.forEach((l,i)=>{l.classList.remove('correct','wrong');if(task.correct.includes(i))l.classList.add('correct');if(selected.includes(i)&&!task.correct.includes(i))l.classList.add('wrong');});
  const ok=selected.length===task.correct.length&&selected.every(v=>task.correct.includes(v));
  if(ok){fb.className='feedback show ok';fb.innerHTML='✅ Правильно! <span class="explain">'+task.explain+'</span>';}
  else{fb.className='feedback show bad';fb.innerHTML='❌ Неправильно. <span class="explain">'+task.explain+'</span>';}
}
function checkMatch(tid,idx){
  const t=tickets.find(x=>x.id===tid);const task=t.tasks[idx];
  const fb=document.getElementById(`fb-${tid}-${idx}`);
  let ok=true;
  task.left.forEach((_,i)=>{const sel=document.getElementById(`match-${tid}-${idx}-${i}`);if(parseInt(sel.value)!==task.correct[i])ok=false;});
  if(ok){fb.className='feedback show ok';fb.innerHTML='✅ Всё верно! <span class="explain">'+task.explain+'</span>';}
  else{fb.className='feedback show bad';fb.innerHTML='❌ Есть ошибки. <span class="explain">'+task.explain+'</span>';}
}
function toggleReveal(tid,idx){document.getElementById(`reveal-${tid}-${idx}`).classList.toggle('show');}

function markDone(id){
  progress[id]=true;
  localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));
  buildNav();updateNavActive();updateProgress();
  const next=nextTicketId(id);
  if(next)setTimeout(()=>showTicket(next),300);
}
function updateProgress(){
  const done=Object.keys(progress).length;const total=tickets.length;
  progressTextEl.textContent=`${done} / ${total}`;
  progressFillEl.style.width=(done/total*100)+'%';
}
function resetProgress(){if(confirm('Сбросить весь прогресс?')){progress={};localStorage.removeItem(STORAGE_KEY);buildNav();updateNavActive();updateProgress();}}
function toggleTheme(){
  const html=document.documentElement;const isDark=html.getAttribute('data-theme')==='dark';
  html.setAttribute('data-theme',isDark?'light':'dark');
  localStorage.setItem('gp_theme',isDark?'light':'dark');
  document.getElementById('themeBtn').textContent=isDark?'🌙 Тема':'☀️ Тема';
}
document.getElementById('searchBox').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase().trim();
  navEl.querySelectorAll('a').forEach(a=>{
    const t=tickets.find(x=>x.id===a.dataset.id);
    const m=!q||t.title.toLowerCase().includes(q)||t.subtitle.toLowerCase().includes(q)||t.body.toLowerCase().includes(q);
    a.parentElement.style.display=m?'':'none';
  });
  navEl.querySelectorAll('.nav-section').forEach(sec=>{
    const v=Array.from(sec.querySelectorAll('li')).some(li=>li.style.display!=='none');
    sec.style.display=v?'':'none';
  });
});
(function init(){
  const savedTheme=localStorage.getItem('gp_theme');
  if(savedTheme==='dark'){document.documentElement.setAttribute('data-theme','dark');document.getElementById('themeBtn').textContent='☀️ Тема';}
  buildNav();showTicket(currentTicket);updateProgress();
})();
</script>
</body>
</html>
