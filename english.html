<style>
  :root{
    --bg:#000;
    --fg:#fff;
    --muted:#9aa0a6;
    --card:#111;
    --accent:#4da3ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-text-size-adjust:100%;}
  body{padding:6px 6px 16px;}
  header{
    position:sticky;top:0;z-index:10;background:var(--bg);
    padding:4px 2px 6px;border-bottom:1px solid #222;
  }
  h1{font-size:14px;margin:0 0 4px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  .list{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
  button.ticket{
    width:100%;text-align:left;background:var(--card);color:var(--fg);
    border:1px solid #222;border-radius:12px;padding:10px 12px;
    font-size:14px;line-height:1.25;cursor:pointer;
  }
  button.ticket:active{background:#1b1b1b}
  button.ticket .num{color:var(--accent);font-weight:700;margin-right:6px}
  .card{
    background:var(--card);border:1px solid #222;border-radius:14px;
    padding:10px 12px;margin-top:8px;
  }
  .card h2{font-size:14px;margin:0 0 8px;color:var(--accent)}
  .block{margin:10px 0 0}
  .block .label{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .en{font-size:14px;line-height:1.45}
  .ru{font-size:13px;line-height:1.4;color:#d7d7d7}
  .back{
    position:sticky;bottom:8px;margin-top:12px;width:100%;
    background:#1f6feb;color:#fff;border:none;border-radius:12px;
    padding:10px;font-size:14px;font-weight:600;cursor:pointer;
  }
  .back:active{background:#1858b8}
  .hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.35}
  @media (max-width:260px){
    .en{font-size:12.5px}.ru{font-size:12px}
    button.ticket{font-size:12.5px;padding:8px}
    h1{font-size:12px}
  }

const app = document.getElementById("app");

function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderList(){
  let html = '<div class="list">';
  TICKETS.forEach(t=>{
    html += `<button class="ticket" data-id="${t.n}">
      <span class="num">${t.n}.</span>${esc(t.ruTitle)}
    </button>`;
  });
  html += '</div><div class="hint">Нажми на билет, чтобы увидеть ответ на английском и русском.</div>';
  app.innerHTML = html;

  app.querySelectorAll("button.ticket").forEach(btn=>{
    btn.addEventListener("click", ()=> renderTicket(Number(btn.dataset.id)));
  });
  window.scrollTo(0,0);
}

function renderTicket(id){
  const t = TICKETS.find(x=>x.n===id);
  if(!t){ renderList(); return; }

  const enHtml = t.en.map((s,i)=>`<div>${i+1}. ${esc(s)}</div>`).join("");
  const ruHtml = t.ru.map((s,i)=>`<div>${i+1}. ${esc(s)}</div>`).join("");

  app.innerHTML = `
    <div class="card">
      <h2>Билет ${t.n}. ${esc(t.ruTitle)}</h2>

      <div class="block">
        <div class="label">English</div>
        <div class="en">${enHtml}</div>
      </div>

      <div class="block">
        <div class="label">Русский</div>
        <div class="ru">${ruHtml}</div>
      </div>
    </div>

    <button class="back" id="backBtn">← К списку билетов</button>
    <div class="hint">Совет: говори по схеме «определение → пояснение → пример по Беларуси → вывод».</div>
  `;

  document.getElementById("backBtn").addEventListener("click", renderList);
  window.scrollTo(0,0);
}
